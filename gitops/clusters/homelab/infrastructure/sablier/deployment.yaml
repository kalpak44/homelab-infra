apiVersion: apps/v1
kind: Deployment
metadata:
  name: sablier
  namespace: kube-system
spec:
  # A new image tag on every bump leaves the superseded ReplicaSet behind for ever, and
  # the image scanner reports each one, burying live findings under dead revisions.
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: sablier
  template:
    metadata:
      labels:
        app: sablier
    spec:
      serviceAccountName: sablier
      containers:
        - name: sablier
          image: sablierapp/sablier:1.18.0
          args:
            - start
            - --provider.name=kubernetes
          ports:
            - containerPort: 10000