# The identities the two agent workflows run as. They exist so "read-only" is enforced by
# the API server rather than by a prompt: each agent is handed a token minted for its own
# account and never sees a cluster-admin credential.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-agent
  namespace: crowdsec
---
# Shared by both agents. Traefik's pod logs are the security agent's request evidence, and
# the workload and node objects are what either one checks after a change lands. No verb
# here can mutate anything.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-read
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, endpoints, namespaces, nodes, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets, replicasets]
    verbs: [get, list, watch]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, watch]
  # Reconciliation status only. Flux is left to its own 30s interval rather than nudged,
  # because `flux reconcile` annotates the object and that is a write.
  - apiGroups: [helm.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io]
    resources: [helmreleases, kustomizations]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-read
subjects:
  - kind: ServiceAccount
    name: security-agent
    namespace: crowdsec
---
# The identity .github/workflows/ai-update-agent.yml runs as. It reads nodes, workloads and
# reconciliation status to decide whether an upgrade landed; it gets no exec anywhere,
# because nothing it does needs a shell in a pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: update-agent
  namespace: crowdsec
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: update-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-read
subjects:
  - kind: ServiceAccount
    name: update-agent
    namespace: crowdsec
---
# The one write-shaped verb the security agent gets, and it is namespaced to crowdsec.
# cscli is the only interface to the alert and decision history, and reaching it means
# exec. Widening this to another namespace hands the agent a shell next to whatever runs
# there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-agent-exec
  namespace: crowdsec
rules:
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-agent-exec
  namespace: crowdsec
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: security-agent-exec
subjects:
  - kind: ServiceAccount
    name: security-agent
    namespace: crowdsec
