# Bound by name rather than provisioned, so a rebuilt cluster reattaches the same directory.
# The directory name is the one the retired subdir provisioner gave it.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: crowdsec-config
spec:
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-csi
  mountOptions:
    - nfsvers=4
  claimRef:
    namespace: crowdsec
    name: crowdsec-config
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.1.108#srv/nfs/k8s#crowdsec-crowdsec-config-pvc-pvc-c716efc1-bdb6-499d-8a3b-195ab7ea8ab8##
    volumeAttributes:
      server: 192.168.1.108
      share: /srv/nfs/k8s/crowdsec-crowdsec-config-pvc-pvc-c716efc1-bdb6-499d-8a3b-195ab7ea8ab8
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-config
  namespace: crowdsec
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi
  volumeName: crowdsec-config
  resources:
    requests:
      storage: 100Mi
---
# Local disk, not NFS: the LAPI database is SQLite, whose locking NFS does not honour
# reliably. local-path pins the LAPI pod to the node holding the volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crowdsec-db
  namespace: crowdsec
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
