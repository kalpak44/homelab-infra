apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
  namespace: crowdsec
spec:
  interval: 30s
  chart:
    spec:
      chart: crowdsec
      version: "0.24.x"
      sourceRef:
        kind: HelmRepository
        name: crowdsec
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  # Every CrowdSec config, parser, scenario and AppSec rule is its own file in the
  # directory beside this one, turned into a ConfigMap by kustomization.yaml. A new file
  # needs an entry there and one here, or it never reaches the chart.
  valuesFrom:
    - kind: ConfigMap
      name: crowdsec-src-config-files
      valuesKey: config.yaml.local
      targetPath: 'config.config\.yaml\.local'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-config-files
      valuesKey: profiles.yaml
      targetPath: 'config.profiles\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-parsers
      valuesKey: cloudflare-whitelist.yaml
      targetPath: 'config.parsers.s02-enrich.cloudflare-whitelist\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-parsers
      valuesKey: trusted-clients.yaml
      targetPath: 'config.parsers.s02-enrich.trusted-clients\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-scenarios
      valuesKey: manual-blocklist.yaml
      targetPath: 'config.scenarios.manual-blocklist\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-scenarios
      valuesKey: mcp-auth-failure.yaml
      targetPath: 'config.scenarios.mcp-auth-failure\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-scenarios
      valuesKey: mcp-surface-probing.yaml
      targetPath: 'config.scenarios.mcp-surface-probing\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-scenarios
      valuesKey: public-mcp-probing.yaml
      targetPath: 'config.scenarios.public-mcp-probing\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-scenarios
      valuesKey: proklinator-api-probing.yaml
      targetPath: 'config.scenarios.proklinator-api-probing\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-scenarios
      valuesKey: checkout-session-abuse.yaml
      targetPath: 'config.scenarios.checkout-session-abuse\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-scenarios
      valuesKey: checkout-payload-rejected.yaml
      targetPath: 'config.scenarios.checkout-payload-rejected\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-scenarios
      valuesKey: http-error-burst.yaml
      targetPath: 'config.scenarios.http-error-burst\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-scenarios
      valuesKey: actuator-probing.yaml
      targetPath: 'config.scenarios.actuator-probing\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-scenarios
      valuesKey: http-error-threshold.yaml
      targetPath: 'config.scenarios.http-error-threshold\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-appsec-rules
      valuesKey: block-php.yaml
      targetPath: 'appsec.rules.block-php\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-appsec-rules
      valuesKey: block-cms-admin.yaml
      targetPath: 'appsec.rules.block-cms-admin\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-appsec-rules
      valuesKey: block-secret-files.yaml
      targetPath: 'appsec.rules.block-secret-files\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-appsec-rules
      valuesKey: block-laravel-ignition.yaml
      targetPath: 'appsec.rules.block-laravel-ignition\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-appsec-rules
      valuesKey: block-recon-artifacts.yaml
      targetPath: 'appsec.rules.block-recon-artifacts\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-appsec-configs
      valuesKey: app-surface.yaml
      targetPath: 'appsec.configs.app-surface\.yaml'
      literal: true
    - kind: ConfigMap
      name: crowdsec-src-appsec-configs
      valuesKey: crs-observe.yaml
      targetPath: 'appsec.configs.crs-observe\.yaml'
      literal: true
  values:
    container_runtime: containerd

    lapi:
      replicas: 1
      env:
        - name: BOUNCER_KEY_traefik
          valueFrom:
            secretKeyRef:
              name: crowdsec-secrets
              key: bouncer-api-key
        - name: ENROLLMENT_KEY
          valueFrom:
            secretKeyRef:
              name: crowdsec-secrets
              key: enrollment-key

      lifecycle:
        postStart:
          exec:
            command:
              - /bin/sh
              - -c
              - |
                # Dropped and recreated rather than only added to: `add` cannot retract
                # an entry, so a list that is only ever appended to keeps every address
                # this block has named since the volume was created.
                cscli allowlists delete trusted_ips 2>/dev/null || true
                cscli allowlists create trusted_ips --description "Trusted client IPs" 2>/dev/null || true
                cscli allowlists add trusted_ips 46.10.211.21 -d "Trusted client IP" 2>/dev/null || true
                # Agents register under their pod name and `cscli lapi register` has no
                # --force, so a record that outlives the pod makes the replacement's init
                # container fail for ever. Clear the dead ones before they reconnect.
                cscli machines prune --duration 1h --force 2>/dev/null || true
                cscli bouncers delete traefik 2>/dev/null || true
                cscli bouncers add traefik --key "${BOUNCER_KEY_traefik}"
                # Enrolling before the local database answers fails silently, so wait
                # for it. postStart blocks the container from reaching Running, so
                # every wasted iteration here is pure LAPI downtime, which is what
                # crash-loops the appsec pods.
                for i in $(seq 1 60); do
                  cscli machines list >/dev/null 2>&1 && break
                  sleep 2
                done
                cscli console enroll "${ENROLLMENT_KEY}" || true
                cscli console enable console_management manual || true

      persistentVolume:
        data:
          storageClassName: nfs
          size: 1Gi
        config:
          storageClassName: nfs
          size: 100Mi

      resources:
        limits:
          memory: 500Mi
          cpu: 500m
        requests:
          cpu: 100m
          memory: 200Mi

    agent:
      # The ConfigMap mount does not reload in a running pod, and nothing else here changes
      # when only the list does — without this the DaemonSet keeps serving the old one.
      # sha256 of blocked-ips.txt; update both in the same commit.
      podAnnotations:
        homelab.pavel-usanli.online/blocked-ips-sha256: "c47d9f950bc0b999b58f1c18fcfd73829507afada566f954ac3fef5a3a57e426"

      # subPath, so the mount adds one file instead of masking the data directory the hub
      # downloads its pattern files into.
      extraVolumes:
        - name: blocked-ips
          configMap:
            name: crowdsec-blocked-ips
      extraVolumeMounts:
        - name: blocked-ips
          mountPath: /var/lib/crowdsec/data/blocked-ips.txt
          subPath: blocked-ips.txt
          readOnly: true

      acquisition:
        - namespace: kube-system
          podName: "traefik-*"
          program: traefik
          # The kubelet rotates a container log by renaming it and creating a new file
          # at the same path. The inotify watch stays on the old inode, so the agent
          # goes deaf at the first rotation and every log-fed scenario stops firing.
          poll_without_inotify: true

      env:
        - name: COLLECTIONS
          value: "crowdsecurity/linux crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/whitelist-good-actors"
        - name: SCENARIOS
          value: "LePresidente/adguardhome-bf crowdsecurity/http-probing crowdsecurity/http-bad-user-agent crowdsecurity/http-backdoors-attempts crowdsecurity/http-sensitive-files crowdsecurity/ssh-bf crowdsecurity/http-path-traversal-probing crowdsecurity/http-sqli-probing crowdsecurity/http-xss-probing crowdsecurity/http-crawl-non_statics crowdsecurity/http-generic-bf crowdsecurity/http-admin-interface-probing crowdsecurity/http-open-proxy"

      # Deliberately unpersisted. The chart seeds a config volume with `mv -n`, so hub
      # files survive while their pattern data under /var/lib/crowdsec does not - and
      # `cscli install` then skips the already-present scenario and never refetches it.
      # Eight scenarios loaded with no patterns and silently matched nothing. It also
      # gave both agents one shared machine identity on a ReadWriteOnce claim.
      persistentVolume:
        config:
          enabled: false

      resources:
        limits:
          memory: 250Mi
          cpu: 500m
        requests:
          cpu: 50m
          memory: 100Mi

    appsec:
      enabled: true

      # AppSec pods are stateless, so config changes can roll without a gap.
      # The chart defaults to replicas 1 + Recreate, which tears the only pod
      # down before starting its replacement.
      replicas: 2
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1

      acquisitions:
        - source: appsec
          listen_addr: "0.0.0.0:7422"
          path: /
          # appsec_config (singular) and appsec_configs (plural) are mutually
          # exclusive - setting both is a hard config error.
          appsec_configs:
            - crowdsecurity/virtual-patching
            - custom/app-surface
            - custom/crs-observe
          labels:
            type: appsec

      env:
        - name: COLLECTIONS
          value: "crowdsecurity/appsec-virtual-patching"
        - name: APPSEC_CONFIGS
          value: "crowdsecurity/appsec-default"
        - name: APPSEC_RULES
          value: "crowdsecurity/crs crowdsecurity/base-config crowdsecurity/appsec-generic-test"
      resources:
        limits:
          memory: 250Mi
          cpu: 500m
        requests:
          cpu: 50m
          memory: 100Mi
