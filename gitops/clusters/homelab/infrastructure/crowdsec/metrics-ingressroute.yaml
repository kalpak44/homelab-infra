# Prometheus runs outside the cluster, so LAPI's metrics need a route in. LAPI has one
# replica, so the Service always reaches the same counters.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: crowdsec-lapi-metrics
  namespace: crowdsec
spec:
  entryPoints:
    - private-web-secure
  routes:
    - match: Host(`crowdsec.internal.pavel-usanli.online`) && Path(`/metrics`)
      kind: Rule
      services:
        - name: crowdsec-service
          port: 6060
  tls:
    certResolver: cloudflare
