# www is a static site: it does not serve MCP or JSON-RPC and rejects POSTs
# with 405. A browser has no reason to retry those paths, so repeats are a
# client or scanner looking for an API that is not there.
type: leaky
name: custom/public-mcp-probing
description: "Repeated POSTs to MCP-shaped paths on the public site"
filter: "evt.Meta.service == 'http' && evt.Meta.target_fqdn == 'www.pavel-usanli.online' && evt.Meta.http_verb == 'POST' && evt.Meta.http_status == '405' && evt.Meta.http_path in ['/', '/mcp', '/jsonrpc']"
groupby: evt.Meta.source_ip
capacity: 1
leakspeed: "5m"
blackhole: 6h
labels:
  service: http
  type: public-mcp-probe
  remediation: true
