type: leaky
name: custom/http-error-threshold
description: "Block IP when 50 non-static 4xx responses overflow a counter draining once per minute"

# Client errors only: a 301 and Traefik's 0 for a disconnected client are ordinary traffic,
# and counting them bans a visitor who merely followed a redirect and missed a favicon.
# Static assets are excluded too: a stale browser asking for an old hashed bundle (or a
# source map) produces a burst of 404s that says nothing about intent.
#
# MCP clients probe GET/DELETE session handling and retry POST during negotiation; 405
# and 400 are normal protocol outcomes there. The MCP-specific auth and surface scenarios
# judge those requests, so a sparse run of negotation errors must not become a 24h ban.
# Server failures (5xx) describe the backend, not abuse by its caller. Counting them
# bans legitimate visitors and VM supervisors during rollouts, then blocks recovery.
# This applies to every source address and hostname; no VM or domain allowlist is needed.
filter: "evt.Meta.service == 'http' && evt.Parsed.static_ressource == 'false' && evt.Meta.http_status startsWith '4' && (evt.Meta.target_fqdn != 'mite-assistant.pavel-usanli.online' || evt.Meta.http_path != '/mcp' || evt.Meta.http_status not in ['400', '405'])"

# Group events by source IP - each IP gets its own bucket
groupby: evt.Meta.source_ip

# capacity 49 + 1 overflow event = 50 4xx responses trigger a ban without draining.
capacity: 49

# Drain one error per minute so ordinary authentication and permission errors do not
# accumulate all day. The separate burst rule still catches rapid automated traffic.
leakspeed: "1m"

# After firing once, suppress further alerts for this IP for 1 hour (avoid alert spam)
blackhole: 1h

labels:
  service: http
  type: http-error
  remediation: true
