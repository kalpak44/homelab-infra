name: custom/block-secret-files
description: "Request for a credential, state or VCS file"
# Build-tool state and hosted-platform config are never served, so a
# request for them is a scan rather than a missing asset.
rules:
  - zones:
      - URI
    transform:
      - lowercase
    match:
      type: regex
      value: "(^|/)(\\.env([.~_-][^/]*)?([?#/]|$)|[^/]*\\.env([?#/]|$)|\\.aws/(credentials|config)|\\.ssh/id_[a-z0-9]+|id_rsa|\\.npmrc|\\.netrc|\\.htpasswd|\\.htaccess|\\.dockercfg|\\.docker/config\\.json|\\.git-credentials|\\.git/|\\.gitmodules|\\.lfsconfig|\\.gitlab-ci\\.yml|\\.github/|\\.kube/config|\\.svn/|\\.hg/|\\.bzr/|\\.boto|\\.s3cfg|\\.amplifyrc|\\.pypirc|\\.cursor/mcp\\.json|\\.claude/settings[^/]*|\\.streamlit/secrets\\.toml|auth\\.json|credentials\\.json|credentials\\.ini([?#/]|$)|secrets?\\.json([?#/]|$)|keys?\\.json([?#/]|$)|service[-_]?account\\.json([?#/]|$)|gcp-credentials\\.json([?#/]|$)|sentry\\.properties([?#/]|$)|database\\.sql([?#/]|$)|application\\.ya?ml([?#/]|$)|config\\.ya?ml([?#/]|$)|aws-exports\\.js|firebase-(admin|service-account)[^/]*\\.json|appsettings([.][^/]*)?\\.json|app\\.config\\.js|local_settings\\.py|secrets\\.(env|ya?ml)|docker-compose\\.ya?ml|terraform\\.tfstate|terraform\\.tfvars|\\.terraform/|backup\\.sql|dump\\.sql|db\\.sql|next\\.config\\.[a-z]+([?#/]|$)|nuxt\\.config\\.[a-z]+([?#/]|$)|\\.next/|\\.output/|\\.netlify/|\\.turbo/|\\.vercel/|wrangler\\.toml([?#/]|$)|vercel\\.json([?#/]|$)|railway\\.toml([?#/]|$)|supabase/config\\.toml([?#/]|$)|serverless\\.ya?ml([?#/]|$)|settings\\.py([?#/]|$)|serviceaccountkey\\.json([?#/]|$)|localhost\\.key([?#/]|$)|server\\.key([?#/]|$)|proc/self/environ([?#/]|$)|serviceaccount/token([?#/]|$)|telescope/|laravel\\.log([?#/]|$))"
labels:
  type: exploit
  service: http
  behavior: "http:exploit"
  confidence: 3
  spoofable: 0
  label: "Secret file probing"
