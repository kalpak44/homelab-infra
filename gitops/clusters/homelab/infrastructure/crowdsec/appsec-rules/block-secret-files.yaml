name: custom/block-secret-files
description: "Request for a credential, state or VCS file"
# Build-tool state and hosted-platform config are never served, so a
# request for them is a scan rather than a missing asset.
# AI-provider credential/config filenames are in the same category: scanners
# request them directly, and static hosting would otherwise answer with index.html.
# The 2026-11-19 scan also walked the client homes and CI files below; those were
# served with 200 because the earlier patterns only named the provider files.
rules:
  - zones:
      - URI
    transform:
      - lowercase
    match:
      type: regex
      value: "(^|/)(\\.env([.~_-][^/]*)?([?#/]|$)|[^/]*\\.env([?#/]|$)|\\.aws/(credentials|config)|\\.ssh/id_[a-z0-9]+|id_rsa|\\.npmrc|\\.netrc|\\.htpasswd|\\.htaccess|\\.dockercfg|\\.docker/config\\.json|\\.git-credentials|\\.git/|\\.gitmodules|\\.lfsconfig|\\.gitlab-ci\\.yml|\\.github/|\\.kube/config|\\.svn/|\\.hg/|\\.bzr/|\\.boto|\\.s3cfg|\\.amplifyrc|\\.pypirc|\\.cursor/mcp\\.json|\\.claude/settings[^/]*|\\.streamlit/secrets\\.toml|auth\\.json|credentials\\.json|credentials\\.ini([?#/]|$)|secrets?\\.json([?#/]|$)|keys?\\.json([?#/]|$)|service[-_]?account\\.json([?#/]|$)|gcp-credentials\\.json([?#/]|$)|sentry\\.properties([?#/]|$)|database\\.sql([?#/]|$)|application\\.ya?ml([?#/]|$)|config\\.ya?ml([?#/]|$)|aws-exports\\.js|firebase-(admin|service-account)[^/]*\\.json|appsettings([.][^/]*)?\\.json|app\\.config\\.js|local_settings\\.py|secrets\\.(env|ya?ml)|docker-compose\\.ya?ml|terraform\\.tfstate|terraform\\.tfvars|\\.terraform/|backup\\.sql|dump\\.sql|db\\.sql|next\\.config\\.[a-z]+([?#/]|$)|nuxt\\.config\\.[a-z]+([?#/]|$)|\\.next/|\\.output/|\\.netlify/|\\.turbo/|\\.vercel/|wrangler\\.toml([?#/]|$)|vercel\\.json([?#/]|$)|railway\\.toml([?#/]|$)|supabase/config\\.toml([?#/]|$)|serverless\\.ya?ml([?#/]|$)|settings\\.py([?#/]|$)|serviceaccountkey\\.json([?#/]|$)|localhost\\.key([?#/]|$)|server\\.key([?#/]|$)|proc/self/environ([?#/]|$)|serviceaccount/token([?#/]|$)|telescope/|laravel\\.log([?#/]|$)|(^|/)(openai|llm|llm-config|ai|ai-keys|gcp-creds|gemini|vertex|token|tokens|client_secrets?|keys)\\.(json|ya?ml)([?#/]|$)|(^|/)(litellm|config/litellm)\\.ya?ml([?#/]|$)|(^|/)(\\.aider\\.model\\.settings\\.ya?ml|aider\\.conf\\.ya?ml|claude_desktop_config\\.json|\\.claude/\\.credentials\\.json|\\.windsurf/mcp_config\\.json|\\.drone\\.ya?ml|(azure|bitbucket)-pipelines\\.ya?ml)([?#/]|$)|(^|/)\\.config/(claude|anthropic|configstore|gemini|gh|huggingface|mods|openai|rclone|shell_gpt|zed)(/|[?#]|$))"
labels:
  type: exploit
  service: http
  behavior: "http:exploit"
  confidence: 3
  spoofable: 0
  label: "Secret file probing"
