name: custom/block-laravel-ignition
description: "Request for the Laravel Ignition execution endpoint"
rules:
  - zones:
      - URI
    transform:
      - lowercase
    match:
      type: regex
      value: "(^|/)_ignition(/|$)"
labels:
  type: exploit
  service: http
  behavior: "http:exploit"
  confidence: 3
  spoofable: 0
  label: "Laravel Ignition probing"
