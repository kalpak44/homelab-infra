# Scanner paths for software, build artifacts and developer state that this homelab does
# not serve. The static sites answer every unknown path with index.html, so these probes
# return 200 and the 4xx scenarios never see them; they are still never legitimate here.
# The existing block-secret-files rule already covers .env/.aws/.ssh/VCS paths, so this
# rule deliberately does not repeat them.
# Backup archives and developer/AI credential files are included for the same reason:
# the fallback serves them as 200 even though none are legitimate site assets.
#
# /api/session/properties is Metabase's pre-auth setup endpoint used by CVE-2023-38646.
# Four unrelated sources requested it twice per burst on 2026-11-19; nothing here runs
# Metabase, so the endpoint is never a legitimate path.
name: custom/block-recon-artifacts
description: "Request for an artifact or software surface that is not deployed"
rules:
  - zones:
      - URI
    transform:
      - lowercase
    match:
      type: regex
      value: '^/(config|settings|tokens)\.json([?#/]|$)|^/config/config\.json([?#/]|$)|^/credentials([?#/]|$)|^/package(-lock)?\.json([?#/]|$)|(^|/)(sa|gcp-key|gcp-sa|google-credentials|google-key)\.json([?#/]|$)|(^|/)phpinfo([?#/]|$)|(^|/)actuator([?#/]|$)|(^|/)composer\.(json|lock)([?#/]|$)|(^|/)web\.config([?#/]|$)|(^|/)server-(info|status)([?#/]|$)|(^|/)cgi-bin([?#/]|$)|(^|/)magento_version([?#/]|$)|(^|/)containers/json([?#/]|$)|(^|/)_catalog([?#/]|$)|(^|/)dockerfile([?#/]|$)|(^|/)docker-compose\.[^/]+\.ya?ml([?#/]|$)|(^|/)compose\.ya?ml([?#/]|$)|(^|/)netlify\.toml([?#/]|$)|(^|/)\.travis\.ya?ml([?#/]|$)|(^|/)config\.toml([?#/]|$)|(^|/)app\.db([?#/]|$)|(^|/)wp-config\.txt([?#/]|$)|(^|/)client_secrets\.json([?#/]|$)|(^|/)credentials\.ya?ml([?#/]|$)|(^|/)parameters\.ya?ml([?#/]|$)|(^|/)config/aws\.ya?ml([?#/]|$)|(^|/)\.config/app\.ya?ml([?#/]|$)|(^|/)\.cargo/credentials\.toml([?#/]|$)|(^|/)\.gem/credentials([?#/]|$)|(^|/)\.ds_store([?#/]|$)|(^|/)env([?#/]|$)|(^|/)environment([?#/]|$)|(^|/)env\.txt([?#/]|$)|(^|/)(vendor/composer/|\.config/gcloud/|\.azure/|\.dbeaver/|\.anthropic/|\.continue/|\.codeium/|\.llm/|\.config/llm/)|^/api/session/properties([?#/]|$)|(^|/)(backup|database_backup|db_backup|site_backup|www_backup|wordpress_backup|full_backup|home_backup)\.(zip|tar|tar\.gz|tgz|tbz2|7z|rar|sql|sql\.gz|bak)([?#/]|$)|(^|/)zzcanary-[a-z0-9]+(\.[a-z0-9]+)?([?#/]|$)|(^|/)(\.pgpass|\.my\.cnf|\.gemini/settings\.json|\.huggingface/token|\.cache/huggingface/token|\.idea/(workspace|datasources|deployment)\.xml|\.vscode/(sftp|ftp-sync|settings)\.json|config/master\.key|service-account-key\.json|\.sentryclirc|\.oci/config|\.pg_service\.conf|oai_config_list|oai_config_list\.json|\.m2/settings\.xml|\.gradle/gradle\.properties|nuget\.config|\.nuget/nuget\.config|\.vault_pass\.txt|\.ansible/vault_pass\.txt|\.bash_history|\.auth\.json|\.credentials|\.circleci/[^/?#]+|\.config/sftp\.json|[^/]*secrets?\.(json|ya?ml|env))([?#/]|$)|(^|/)(prometheus|alertmanager)\.ya?ml([?#/]|$)|(^|/)grafana\.ini([?#/]|$)|(^|/)(rabbitmq|redis)\.conf([?#/]|$)'
labels:
  type: scan
  service: http
  behavior: "http:scan"
  confidence: 3
  spoofable: 0
  label: "Reconnaissance for undeployed software and developer artifacts"
