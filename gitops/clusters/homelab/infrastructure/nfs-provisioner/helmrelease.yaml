apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-provisioner
  namespace: nfs-provisioner
spec:
  interval: 10m
  # The first rollout was slower than the default timeout and stalled the release for
  # good: with no retries Flux gives up after one failed upgrade and stops reconciling,
  # while the Deployment itself goes healthy minutes later.
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      version: "4.*"
      sourceRef:
        kind: HelmRepository
        name: nfs-subdir-external-provisioner
        namespace: flux-system
  values:
    nfs:
      server: "192.168.1.108"
      path: /srv/nfs/k8s
      mountOptions:
        - vers=4
    storageClass:
      name: nfs
      defaultClass: true
      reclaimPolicy: Retain