apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-csi-smoke
provisioner: nfs.csi.k8s.io
parameters:
  server: "192.168.1.108"
  share: /srv/nfs/k8s
  subDir: "smoke-${pvc.metadata.namespace}-${pvc.metadata.name}"
  mountPermissions: "0777"
  onDelete: delete
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-csi-smoke
  namespace: nfs-csi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-csi-smoke
  resources:
    requests:
      storage: 1Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: nfs-csi-smoke
  namespace: nfs-csi
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: busybox:1.36.1
      command:
        - sh
        - -ec
        - printf 'nfs-csi-smoke-ok\n' > /data/probe && cat /data/probe
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: nfs-csi-smoke
