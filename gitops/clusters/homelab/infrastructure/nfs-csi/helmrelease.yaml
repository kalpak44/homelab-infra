apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: nfs-csi
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: csi-driver-nfs
      version: "4.13.6"
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # The chart's 4.13.6 defaults predate the current CSI sidecar patch releases.
    # These builds contain the upstream fixes for the Go libraries reported against
    # the controller and are compatible with Kubernetes 1.37. The node registrar is
    # included so every sidecar remains on its newest stable release.
    image:
      csiProvisioner:
        tag: "v6.4.1"
      csiResizer:
        tag: "v2.3.1"
      livenessProbe:
        tag: "v2.20.1"
      nodeDriverRegistrar:
        tag: "v2.18.1"
    controller:
      replicas: 1
      # No VolumeSnapshotClass is in use, so the optional sidecar is unused attack surface.
      enableSnapshotter: false
      defaultOnDeletePolicy: retain
    externalSnapshotter:
      enabled: false
    storageClass:
      create: true
      name: nfs-csi
      annotations:
        storageclass.kubernetes.io/is-default-class: "true"
      parameters:
        server: "192.168.1.108"
        share: /srv/nfs/k8s
        subDir: "${pvc.metadata.namespace}-${pvc.metadata.name}"
        mountPermissions: "0777"
        onDelete: retain
      reclaimPolicy: Retain
      volumeBindingMode: Immediate
      mountOptions:
        - nfsvers=4
