apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 30s
  chart:
    spec:
      chart: trivy-operator
      version: "0.35.x"
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    # Empty = every namespace. The operator discovers images itself, so nothing
    # here needs updating when an app is added under apps/{public,private}.
    targetNamespaces: ""

    operator:
      # Runs one long-lived trivy-server that owns the vulnerability DB; scan
      # jobs become thin clients against it. Without this every scan job pulls
      # trivy-db from the registry itself, and unauthenticated pulls get
      # throttled well before a cluster-wide sweep finishes.
      # Setting this also forces trivy.mode to ClientServer and wires
      # trivy.serverURL to the in-cluster service - do not set them by hand.
      builtInTrivyServer: true

      # These two are coupled - do not raise scanJobTTL without raising this.
      # The operator's limit check (pkg/operator/jobs/limit_checker.go) counts
      # scan jobs with a plain List and no status filter, so Completed and
      # Failed jobs occupy the budget until they are reaped. Pairing a small
      # limit with a long TTL wedges the sweep: the first N jobs finish, and
      # nothing else is scheduled until the TTL expires.
      scanJobsConcurrentLimit: 4

      # Short on purpose, per the above - finished jobs must be reaped fast to
      # free the budget. VulnerabilityReport CRs are the durable artifact, so
      # nothing is lost; only the job's logs age out.
      scanJobTTL: "2m"

      # Rescan cadence: 30 days (Go duration, so no day unit - 720h).
      # This only governs images that have not changed. A new image tag changes
      # the workload's pod-spec hash, which forces an immediate rescan
      # regardless of this TTL - so anything gitops-bump-images touches is
      # still scanned on every bump, and this is the floor for stale images.
      scannerReportTTL: "720h"

      # Only the live ReplicaSet of each Deployment, not every old revision.
      vulnerabilityScannerScanOnlyCurrentRevisions: true
      configAuditScannerScanOnlyCurrentRevisions: true

      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

    trivy:
      # emptyDir instead of the nfs StorageClass on purpose: trivy-db is a
      # bbolt file that gets mmap'd, which is the one access pattern NFS
      # handles badly. The server pod is long-lived, so the cost is a single
      # DB download per pod restart.
      storageClassEnabled: false

      # LOW/UNKNOWN on a base image is thousands of rows of noise that never
      # get acted on. Raise this later if the board ever looks too quiet.
      severity: "MEDIUM,HIGH,CRITICAL"

      # Without these a report row is a bare CVE id - no description, no CVSS,
      # no link. They are what makes the Headlamp detail pane worth opening.
      additionalVulnerabilityReportFields: "Description,Links,CVSS,Target,Class,PackagePath,PackageType"

      # Per-scan-job limits. Thin clients in ClientServer mode, so modest.
      resources:
        requests:
          cpu: 50m
          memory: 100M
        limits:
          cpu: 500m
          memory: 500M

      server:
        replicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 1Gi

    compliance:
      # k8s-cis-1.23 alone. The other three specs each spawn their own periodic
      # scan and largely restate the same findings on a single-node k3s box.
      specs:
        - k8s-cis-1.23