apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: external-secrets
      version: "2.10.x"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
    # Nine unused generator CRDs carry a stale NamesAccepted=False, from a shortName the
    # old chart set equal to its own singular. Re-applying does not clear it, and Helm's
    # readiness gate reads it as failed, which stalls every upgrade of this release.
    disableWait: true
