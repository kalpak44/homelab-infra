# The API starts, watches and deletes one pod per workspace in its own namespace, with a
# Secret and a ConfigMap holding its environment: a Role, not a ClusterRole. Secrets need
# get and patch because a workspace's secrets are added and removed one key at a time.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspaced-ai-api
  namespace: private
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspaced-ai-api
  namespace: private
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspaced-ai-api
  namespace: private
subjects:
  - kind: ServiceAccount
    name: workspaced-ai-api
    namespace: private
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspaced-ai-api
