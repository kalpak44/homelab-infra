# The API runs each workspace as a one-replica Deployment behind a Service, with a Secret
# and a ConfigMap holding its environment and a PersistentVolumeClaim for its home, in the
# API's namespace: a Role, not a ClusterRole.
# Pods are only watched, and deleted for the bare pods workspaces ran as before
# Deployments. Secrets need get and patch because a workspace's secrets are added and
# removed one key at a time.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspaced-ai-api
  namespace: private
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspaced-ai-api
  namespace: private
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspaced-ai-api
  namespace: private
subjects:
  - kind: ServiceAccount
    name: workspaced-ai-api
    namespace: private
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspaced-ai-api
