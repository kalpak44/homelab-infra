apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspaced-ai-web
  namespace: private
spec:
  replicas: 1
  # A new image tag on every bump leaves the superseded ReplicaSet behind for ever, and
  # the image scanner reports each one, burying live findings under dead revisions.
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: workspaced-ai-web
  template:
    metadata:
      labels:
        app: workspaced-ai-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/kalpak44/workspaced-ai-web:6e2737e
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            # readOnlyRootFilesystem is on, and nginx keeps its pid file and proxy
            # buffers under /tmp in the unprivileged image.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
