# The database credentials, the JWT signing key and the backup bucket's keys, synced from
# Vault. Every key is named for the environment variable the application reads, so the
# Deployment can take the whole Secret with `envFrom` and nothing has to restate the mapping.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workspaced-ai
  namespace: private
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: workspaced-ai-secrets
    creationPolicy: Owner
  data:
    - secretKey: WORKSPACED_DB_HOST
      remoteRef:
        key: workspaced-secrets
        property: database-host
    - secretKey: WORKSPACED_DB_PORT
      remoteRef:
        key: workspaced-secrets
        property: database-port
    - secretKey: WORKSPACED_DB_NAME
      remoteRef:
        key: workspaced-secrets
        property: database-name
    - secretKey: WORKSPACED_DB_USERNAME
      remoteRef:
        key: workspaced-secrets
        property: database-username
    - secretKey: WORKSPACED_DB_PASSWORD
      remoteRef:
        key: workspaced-secrets
        property: database-password
    # Signs the login JWTs. Without it the API makes a random key per start, so every
    # rollout would sign everyone out.
    - secretKey: WORKSPACED_JWT_SECRET
      remoteRef:
        key: workspaced-secrets
        property: jwt-secret
    # A RustFS user whose policy reaches the workspace-backups bucket alone.
    - secretKey: WORKSPACED_BACKUP_ACCESS_KEY
      remoteRef:
        key: workspaced-secrets
        property: access-key
    - secretKey: WORKSPACED_BACKUP_SECRET_KEY
      remoteRef:
        key: workspaced-secrets
        property: secret-key
