# Everything on the host the API route does not claim. Traefik ranks rules by length, so
# the longer /api/v1/ rule keeps precedence over this one.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: workspaced-ai-web
  namespace: private
spec:
  entryPoints:
    - private-web-secure
  routes:
    - match: Host(`workspaced-ai.internal.pavel-usanli.online`)
      kind: Rule
      services:
        - name: workspaced-ai-web
          port: 8080
  tls:
    certResolver: cloudflare
