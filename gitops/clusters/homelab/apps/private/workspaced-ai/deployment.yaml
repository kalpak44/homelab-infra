apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspaced-ai-api
  namespace: private
spec:
  replicas: 1
  # A new image tag on every bump leaves the superseded ReplicaSet behind for ever, and
  # the image scanner reports each one, burying live findings under dead revisions.
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: workspaced-ai-api
  template:
    metadata:
      labels:
        app: workspaced-ai-api
    spec:
      # The token is what the API manages workspaces with; rbac.yaml limits it to their
      # Deployments, Services, pods, Secrets and ConfigMaps in this namespace.
      serviceAccountName: workspaced-ai-api
      automountServiceAccountToken: true
      # A pod-level context, not only the per-container one below: the config scanner
      # treats an empty pod securityContext as running with defaults regardless of what
      # the containers set.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/kalpak44/workspaced-ai-api:26aef82
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Every key in this Secret is named for the variable it sets, so there is no
          # mapping here to drift from the ExternalSecret that produces it.
          envFrom:
            - secretRef:
                name: workspaced-ai-secrets
          env:
            # The harness every workspace pod runs. Pinned here rather than baked into the
            # API, and bumped with the API's own tag, because both come from one commit.
            - name: WORKSPACED_WORKSPACE_IMAGE
              value: ghcr.io/kalpak44/workspaced-ai-harness:26aef82
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            periodSeconds: 20
          volumeMounts:
            # readOnlyRootFilesystem is on, and Tomcat and the JVM still need somewhere
            # to write their temporary files.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
