# The app serves everything, Swagger and health included, under its /api/v1 context path;
# web-ingressroute.yaml takes the rest of the host. SSE and the WebSocket pass through as-is.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: workspaced-ai-api
  namespace: private
spec:
  entryPoints:
    - private-web-secure
  routes:
    - match: Host(`workspaced-ai.internal.pavel-usanli.online`) && PathPrefix(`/api/v1/`)
      kind: Rule
      services:
        - name: workspaced-ai-api
          port: 8080
  tls:
    certResolver: cloudflare
