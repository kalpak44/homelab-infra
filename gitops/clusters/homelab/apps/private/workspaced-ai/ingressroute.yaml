# Only /api/v1 is routed, so the host stays free for a web app at the root later. SSE and
# the terminal WebSocket both pass through Traefik as-is.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: workspaced-ai-api
  namespace: private
spec:
  entryPoints:
    - private-web-secure
  routes:
    - match: Host(`workspaced-ai.internal.pavel-usanli.online`) && PathPrefix(`/api/v1/`)
      kind: Rule
      services:
        - name: workspaced-ai-api
          port: 8080
  tls:
    certResolver: cloudflare
