apiVersion: apps/v1
kind: Deployment
metadata:
  name: crowdsec-web-ui
  namespace: private
spec:
  # A new image tag on every bump leaves the superseded ReplicaSet behind for ever, and
  # the image scanner reports each one, burying live findings under dead revisions.
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: crowdsec-web-ui
  template:
    metadata:
      labels:
        app: crowdsec-web-ui
    spec:
      containers:
        - name: crowdsec-web-ui
          image: ghcr.io/theduffman85/crowdsec-web-ui:latest
          ports:
            - containerPort: 3000
          env:
            - name: CROWDSEC_URL
              value: "http://crowdsec-service.crowdsec.svc.cluster.local:8080"
          envFrom:
            - secretRef:
                name: crowdsec-web-ui-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          # 256Mi was OOM-killed during the initial history import, crash-looping the pod
          # out of reach of its own UI. The importer holds the whole lookback window in
          # memory, so the ceiling has to cover that spike, not the idle footprint.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: crowdsec-web-ui-data