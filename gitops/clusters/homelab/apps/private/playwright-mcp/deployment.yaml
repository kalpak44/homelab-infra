apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-mcp
  namespace: private
spec:
  replicas: 1
  # maxSurge 0 keeps a single pod attached to the ReadWriteOnce PVC at any moment.
  # Do not switch this to `type: Recreate`: the API server has already defaulted a
  # rollingUpdate block onto the live object, Flux's server-side apply does not own
  # it, and Recreate alongside a leftover rollingUpdate is rejected on apply.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: playwright-mcp
  template:
    metadata:
      labels:
        app: playwright-mcp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: playwright-mcp
          image: mcp/playwright:latest
          # A caller-supplied screenshot/PDF filename is resolved against the
          # process cwd, not against --output-dir, so without this those files
          # land on the container filesystem and die with the pod. Safe to move:
          # the image entrypoint is `node /app/cli.js`, an absolute path.
          workingDir: /output
          args:
            - --headless
            - --browser
            - chromium
            - --no-sandbox
            - --port
            - "8931"
            - --host
            - 0.0.0.0
            - --allowed-hosts
            - playwright-mcp.internal.pavel-usanli.online
            # Every connection gets its own in-memory profile, so no cookie,
            # login or localStorage written by one MCP client is visible to the
            # next. Nothing browser-related is persisted; that is the point.
            - --isolated
            # The PVC therefore holds output artifacts, not a profile: screenshots,
            # PDFs, traces and snapshots survive the pod. Capped so accumulating
            # outputs cannot fill the claim -- the server evicts oldest first.
            - --output-dir
            - /output
            - --output-max-size
            - "2147483648"
            # Writes each session's full trace into --output-dir, so what a client
            # actually did survives on NFS after the pod log has rotated away.
            - --save-session
            - --user-agent
            - "Mozilla/5.0 (compatible; DuckDuckBot-Https/1.1; https://duckduckgo.com/duckduckbot)"
          env:
            # playwright-mcp has no server log-level flag; it logs through the
            # `debug` package on stderr, which is what `kubectl logs` reads.
            # Namespaces verified present in this image: pw:mcp:{server,request,
            # server:response,error,file,test}. server:response is excluded
            # because it dumps every full page snapshot into the log.
            - name: DEBUG
              value: "pw:mcp:*,-pw:mcp:server:response"
            # `debug` emits ANSI colour codes when it thinks it has a TTY; they
            # render as escape noise in kubectl logs.
            - name: DEBUG_COLORS
              value: "0"
          volumeMounts:
            - name: output
              mountPath: /output
            # Kubernetes gives /dev/shm 64Mi by default. Chromium uses shared
            # memory for its renderers and crashes on heavy pages at that size.
            - name: dshm
              mountPath: /dev/shm
          ports:
            - containerPort: 8931
          readinessProbe:
            tcpSocket:
              port: 8931
            initialDelaySeconds: 10
            periodSeconds: 10
          # Under --isolated each connection gets its OWN browser (confirmed in
          # the log: "create browser (isolated)" per session), so memory scales
          # with concurrent clients rather than being a flat cost. The 512Mi
          # memory-backed /dev/shm also counts against the container limit.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: 2000m
              memory: 3Gi
              ephemeral-storage: 2Gi
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: playwright-mcp-output
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
