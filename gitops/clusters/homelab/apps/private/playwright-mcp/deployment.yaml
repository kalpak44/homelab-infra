apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright-mcp
  namespace: private
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the Chromium profile on the PVC is single-writer
  # (SingletonLock + leveldb locks). A rolling update would start the new pod while
  # the old one still holds the profile, and the new browser would refuse to launch.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: playwright-mcp
  template:
    metadata:
      labels:
        app: playwright-mcp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: playwright-mcp
          image: mcp/playwright:latest
          args:
            - --headless
            - --browser
            - chromium
            - --no-sandbox
            - --port
            - "8931"
            - --host
            - 0.0.0.0
            - --allowed-hosts
            - playwright-mcp.internal.pavel-usanli.online
            # Persistent profile on NFS. Without this the server creates a temp
            # user-data-dir per pod, so cookies and logins die with the pod.
            - --user-data-dir
            - /profile
            - --user-agent
            - "Mozilla/5.0 (compatible; DuckDuckBot-Https/1.1; https://duckduckgo.com/duckduckbot)"
          volumeMounts:
            - name: profile
              mountPath: /profile
          ports:
            - containerPort: 8931
          readinessProbe:
            tcpSocket:
              port: 8931
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 2Gi
      volumes:
        - name: profile
          persistentVolumeClaim:
            claimName: playwright-mcp-profile
