apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: song-radar
  namespace: private
spec:
  entryPoints:
    - private-web-secure
  routes:
    - match: Host(`songradar.internal.pavel-usanli.online`)
      kind: Rule
      services:
        - name: song-radar
          port: 8080
  tls:
    certResolver: cloudflare
