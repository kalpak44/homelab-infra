# The music library's storage. The NFS driver treats the requested size as metadata
# rather than an enforced quota, so the Deployment also passes 30 GB as SongRadar's
# logical capacity for monitoring and application-level limits.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: song-radar-data
  namespace: private
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 30Gi
