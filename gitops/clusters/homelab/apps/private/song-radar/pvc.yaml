# The music library's storage. The NFS provisioner treats the requested size as metadata
# rather than an enforced quota, so the Deployment also passes 30 GB as SongRadar's
# logical capacity for monitoring and application-level limits.
#
# `nfs` is named rather than left to the default: the cluster has two StorageClasses both
# flagged default, so an unnamed claim binds to whichever the API server picks.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: song-radar-data
  namespace: private
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  resources:
    requests:
      storage: 30Gi
