apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: private
spec:
  entryPoints:
    - private-web-secure
  routes:
    - match: Host(`grafana.internal.pavel-usanli.online`)
      kind: Rule
      services:
        - name: grafana
          port: 80
  tls:
    certResolver: cloudflare
