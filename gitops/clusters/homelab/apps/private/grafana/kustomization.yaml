apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrepository.yaml
  - externalsecret.yaml
  - helmrelease.yaml
  - ingressroute.yaml

configMapGenerator:
  - name: grafana-dashboard-crowdsec
    namespace: private
    files:
      - dashboards/crowdsec.json
    options:
      labels:
        grafana_dashboard: "1"
