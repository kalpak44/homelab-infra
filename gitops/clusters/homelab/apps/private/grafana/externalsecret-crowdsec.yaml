# The same key the Traefik bouncer uses, synced here so Grafana can read the decision
# list from the LAPI. Read-only on decisions, and no second credential to rotate.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: crowdsec-bouncer-key
  namespace: private
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: crowdsec-bouncer-key
    creationPolicy: Owner
  data:
    - secretKey: bouncer-api-key
      remoteRef:
        key: crowdsec-secrets
        property: bouncer-api-key
