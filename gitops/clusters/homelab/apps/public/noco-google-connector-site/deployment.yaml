apiVersion: apps/v1
kind: Deployment
metadata:
  name: noco-google-connector-site
  namespace: public
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: noco-google-connector-site
  template:
    metadata:
      labels:
        app: noco-google-connector-site
    spec:
      automountServiceAccountToken: false
      containers:
        - name: noco-google-connector-site
          image: "ghcr.io/kalpak44/noco-tools-site:94d1aac"
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 50Mi
            limits:
              memory: 64Mi
              ephemeral-storage: 100Mi
