apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-planner
  namespace: public
spec:
  # A new image tag on every bump leaves the superseded ReplicaSet behind for ever, and
  # the image scanner reports each one, burying live findings under dead revisions.
  revisionHistoryLimit: 2
  # No `replicas` on purpose — Sablier owns the replica count. See the note in
  # bunker-game-app/deployment.yaml.
  selector:
    matchLabels:
      app: capacity-planner
  template:
    metadata:
      labels:
        app: capacity-planner
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          # No capability drop or runAsNonRoot here: the container binds port 80, which
          # needs NET_BIND_SERVICE and a root uid. Moving it to 8080 is what unlocks both.
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: html
          configMap:
            name: capacity-planner-html