apiVersion: apps/v1
kind: Deployment
metadata:
  name: noco-google-connector-web-page
  namespace: public
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: noco-google-connector-web-page
  template:
    metadata:
      labels:
        app: noco-google-connector-web-page
    spec:
      automountServiceAccountToken: false
      containers:
        - name: noco-google-connector-web-page
          # Unquoted on purpose. gitops/Justfile finds this line with
          # `grep -rlE "^ *image: <repo>:"` and rewrites it with sed, so a quoted
          # value is invisible to it — `just bump-images` prints "no image line,
          # skipping" and the app silently never deploys. Keep the
          # `image: <repo>:<tag>` shape on one line.
          image: ghcr.io/kalpak44/noco-google-connector-web-page:99e9d02
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 50Mi
            limits:
              memory: 64Mi
              ephemeral-storage: 100Mi
