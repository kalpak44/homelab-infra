apiVersion: apps/v1
kind: Deployment
metadata:
  name: noco-google-connector-web-page
  namespace: public
spec:
  # A new image tag on every bump leaves the superseded ReplicaSet behind for ever, and
  # the image scanner reports each one, burying live findings under dead revisions.
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: noco-google-connector-web-page
  template:
    metadata:
      labels:
        app: noco-google-connector-web-page
    spec:
      automountServiceAccountToken: false
      # A pod-level context, not only the per-container ones below: the config scanner
      # treats an empty pod securityContext as running with defaults regardless of what
      # the containers set.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: noco-google-connector-web-page
          # Unquoted on purpose. gitops/Justfile finds this line with
          # `grep -rlE "^ *image: <repo>:"` and rewrites it with sed, so a quoted
          # value is invisible to it — `just bump-images` prints "no image line,
          # skipping" and the app silently never deploys. Keep the
          # `image: <repo>:<tag>` shape on one line.
          image: ghcr.io/kalpak44/noco-google-connector-web-page:023b0af
          # No capability drop or runAsNonRoot here: the container binds port 80, which
          # needs NET_BIND_SERVICE and a root uid. Moving it to 8080 is what unlocks both.
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 50Mi
            limits:
              memory: 64Mi
              ephemeral-storage: 100Mi
