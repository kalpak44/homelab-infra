apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunker-game-app
  namespace: public
spec:
  # No `replicas` on purpose. Sablier owns the replica count — it scales this up on the
  # first request and back to 0 after the middleware's sessionDuration. Declaring it
  # here would make kustomize-controller own the field under server-side apply and
  # re-assert 0 on every reconcile (every 30s), killing the pod Sablier just started.
  selector:
    matchLabels:
      app: bunker-game-app
  template:
    metadata:
      labels:
        app: bunker-game-app
    spec:
      automountServiceAccountToken: false
      containers:
        - name: bunker
          image: ghcr.io/kalpak44/bunker-party:d2463d1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 256Mi