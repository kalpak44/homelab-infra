# Stripe credentials for the API, pulled from Vault rather than committed anywhere.
#
# The remote keys are kebab-case because that is how they are written in Vault; the
# secretKey names are the environment variable names the container actually reads, and
# they match what CI puts in the agents' environment from the STRIPE_TEST_* repository
# secrets. Same names everywhere, different values — nothing in backend/ branches on
# which environment it is running in.
#
# refreshInterval is 1m, so rotating a key in Vault reaches the pod within a minute of
# the Secret being rewritten. The pod does not restart on its own, though: env vars are
# read once at process start, so a rotation needs a rollout to take effect.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: proklinator
  namespace: public
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: proklinator-secrets
    creationPolicy: Owner
  data:
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: proklinator-secrets
        property: stripe-api-secret-key
    - secretKey: STRIPE_PUBLISHABLE_KEY
      remoteRef:
        key: proklinator-secrets
        property: stripe-api-publishable-key