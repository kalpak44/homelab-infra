apiVersion: apps/v1
kind: Deployment
metadata:
  name: proklinator
  namespace: public
spec:
  # A new image tag on every bump leaves the superseded ReplicaSet behind for ever, and
  # the image scanner reports each one, burying live findings under dead revisions.
  revisionHistoryLimit: 2
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: proklinator
  template:
    metadata:
      labels:
        app: proklinator
    spec:
      automountServiceAccountToken: false
      # Long enough for the preStop drain plus any in-flight request to finish.
      terminationGracePeriodSeconds: 30
      # A pod-level context, not only the per-container ones below: the config scanner
      # treats an empty pod securityContext as running with defaults regardless of what
      # the containers set.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: proklinator
          # Tag bumped by `just bump-images` — dispatched by the source repo's publish
          # workflow, and swept nightly as a backstop. Keep the `image: <repo>:<tag>`
          # shape on one line; the recipe rewrites it with sed.
          image: ghcr.io/kalpak44/proklinator-app:d5d6d1c
          # No capability drop or runAsNonRoot here: the container binds port 80, which
          # needs NET_BIND_SERVICE and a root uid. Moving it to 8080 is what unlocks both.
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 50Mi
            limits:
              memory: 64Mi
              ephemeral-storage: 100Mi
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 3
            failureThreshold: 20 # up to 60s to come up before it counts as failed
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            preStop:
              # Give Traefik time to drop this pod from its endpoints before nginx
              # exits; otherwise in-flight requests land on a dead pod.
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]