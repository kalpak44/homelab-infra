# The one route into every workspace's web server: web-gateway-ingressroute.yaml sends
# the whole wildcard here, and the API resolves enabled names to VM tunnels. Its
# routing and its 404 page are built into the image, from the app's own repository.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspaced-ai-web-gateway
  namespace: workspaced-ai
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: workspaced-ai-web-gateway
  template:
    metadata:
      labels:
        app: workspaced-ai-web-gateway
    spec:
      automountServiceAccountToken: false
      serviceAccountName: workspaced-ai-web-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/kalpak44/workspaced-ai-gateway:ff67a47
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # Retained for the previous image during upgrades and rollbacks.
            - name: WORKSPACE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # nginx's runtime resolver requires full DNS names; it does not use search domains.
            # Every box- host goes to the agent hub, which carries it through the tunnel to the
            # workspace's VM.
            - name: AGENT_HUB_URL
              value: http://workspaced-ai-agent-hub.$(WORKSPACE_NAMESPACE).svc.cluster.local:8080
            # Resolve only enabled, database-owned domains before opening a VM web tunnel.
            - name: API_URL
              value: http://workspaced-ai-api.$(WORKSPACE_NAMESPACE).svc.cluster.local:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            # readOnlyRootFilesystem is on, and nginx keeps its pid file and proxy
            # buffers under /tmp in the unprivileged image.
            - name: tmp
              mountPath: /tmp
            - name: agent-hub-token
              mountPath: /var/run/secrets/workspaced-ai/agent-hub
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
        # Proves this pod to the agent hub. Issued for the hub's audience alone, so it is
        # no use against the Kubernetes API; rotated by the kubelet and read on every call.
        - name: agent-hub-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: workspaced-ai-agent-hub
                  expirationSeconds: 3600
