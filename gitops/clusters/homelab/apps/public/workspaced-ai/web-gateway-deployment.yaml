# The one route into every workspace's web server: web-gateway-ingressroute.yaml sends
# the whole wildcard here, and the gateway picks the workspace's Service by name. Its
# routing and its 404 page are built into the image, from the app's own repository.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspaced-ai-web-gateway
  namespace: workspaced-ai
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: workspaced-ai-web-gateway
  template:
    metadata:
      labels:
        app: workspaced-ai-web-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/kalpak44/workspaced-ai-gateway:0b0795d
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # Where the workspaces' Services are: this namespace, whatever it is called.
            - name: WORKSPACE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            # readOnlyRootFilesystem is on, and nginx keeps its pid file and proxy
            # buffers under /tmp in the unprivileged image.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
