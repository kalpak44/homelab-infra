# Only workspace box- names enter the gateway; ai and agent always keep their own routes.
# One wildcard certificate serves every workspace name without per-name issuance.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: workspaced-ai-web-gateway
  namespace: workspaced-ai
spec:
  entryPoints:
    - public-web-secure
  routes:
    - match: HostRegexp(`^box-[a-z0-9-]+\.workspaced\.online$`)
      kind: Rule
      # Below every Host() rule, whatever their length.
      priority: 1
      services:
        - name: workspaced-ai-web-gateway
          port: 8080
  tls:
    certResolver: cloudflare
    domains:
      - main: workspaced.online
        sans:
          - "*.workspaced.online"
