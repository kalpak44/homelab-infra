apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspaced-ai-api
  namespace: workspaced-ai
spec:
  replicas: 1
  # A new image tag on every bump leaves the superseded ReplicaSet behind for ever, and
  # the image scanner reports each one, burying live findings under dead revisions.
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: workspaced-ai-api
  template:
    metadata:
      labels:
        app: workspaced-ai-api
    spec:
      # The API never calls the Kubernetes API; its only token is the agent hub's below.
      automountServiceAccountToken: false
      serviceAccountName: workspaced-ai-api
      # A pod-level context, not only the per-container one below: the config scanner
      # treats an empty pod securityContext as running with defaults regardless of what
      # the containers set.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/kalpak44/workspaced-ai-api:4585a2b
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Every key in this Secret is named for the variable it sets, so there is no
          # mapping here to drift from the ExternalSecret that produces it.
          envFrom:
            - secretRef:
                name: workspaced-ai-secrets
          env:
            # Each workspace's VM is created and deleted through the VM manager, which only
            # this pod may reach (vm-manager-networkpolicy.yaml).
            - name: WORKSPACED_VM_MANAGER_URL
              value: http://workspaced-ai-vm-manager:8080/api/v1
            # Every call to a workspace's harness goes through the agent hub's tunnel to its VM.
            - name: WORKSPACED_AGENT_HUB_URL
              value: http://workspaced-ai-agent-hub:8080/api/v1
            # Where Stripe Checkout sends the browser back after a top-up.
            - name: WORKSPACED_BILLING_RETURN_URL
              value: https://ai.workspaced.online/billing
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            periodSeconds: 20
          volumeMounts:
            # readOnlyRootFilesystem is on, and Tomcat and the JVM still need somewhere
            # to write their temporary files.
            - name: tmp
              mountPath: /tmp
            - name: agent-hub-token
              mountPath: /var/run/secrets/workspaced-ai/agent-hub
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
              ephemeral-storage: 64Mi
            # The JVM sizes its heap from what is left of this after its fixed reservations,
            # and 512Mi left too little for the API to start.
            limits:
              cpu: "1"
              memory: 768Mi
              ephemeral-storage: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
        # Proves this pod to the agent hub. Issued for the hub's audience alone, so it is
        # no use against the Kubernetes API; rotated by the kubelet and read on every call.
        - name: agent-hub-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: workspaced-ai-agent-hub
                  expirationSeconds: 3600
