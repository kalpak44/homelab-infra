apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspaced-ai-api
  namespace: workspaced-ai
spec:
  replicas: 1
  # A new image tag on every bump leaves the superseded ReplicaSet behind for ever, and
  # the image scanner reports each one, burying live findings under dead revisions.
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: workspaced-ai-api
  template:
    metadata:
      labels:
        app: workspaced-ai-api
    spec:
      # Workspaces run on Hetzner VMs the VM manager makes, so the API never calls the
      # Kubernetes API and needs no token.
      automountServiceAccountToken: false
      # Named rather than left out: the API server copies the deprecated serviceAccount
      # field back into an absent serviceAccountName, which kept the deleted one.
      serviceAccountName: default
      # A pod-level context, not only the per-container one below: the config scanner
      # treats an empty pod securityContext as running with defaults regardless of what
      # the containers set.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/kalpak44/workspaced-ai-api:985bbde
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Every key in this Secret is named for the variable it sets, so there is no
          # mapping here to drift from the ExternalSecret that produces it.
          envFrom:
            - secretRef:
                name: workspaced-ai-secrets
          env:
            # Each workspace's VM is created and deleted through the VM manager, which only
            # this pod may reach (vm-manager-networkpolicy.yaml).
            - name: WORKSPACED_VM_MANAGER_URL
              value: http://workspaced-ai-vm-manager:8080/api/v1
            # Workspace backups. Each workspace uploads and downloads its own archive through
            # URLs the API signs, so the pods must reach this host as well as the API.
            - name: WORKSPACED_BACKUP_ENDPOINT
              value: https://rustfs.internal.pavel-usanli.online
            - name: WORKSPACED_BACKUP_BUCKET
              value: workspace-backups
            # Workspace web servers are public as <name>.<this>; the API only names a
            # Service after each, and the gateway routes the domain to them.
            - name: WORKSPACED_WEB_SERVER_DOMAIN
              value: workspaced.online
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            periodSeconds: 20
          volumeMounts:
            # readOnlyRootFilesystem is on, and Tomcat and the JVM still need somewhere
            # to write their temporary files.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
              ephemeral-storage: 64Mi
            # The JVM sizes its heap from what is left of this after its fixed reservations,
            # and 512Mi left too little for the API to start.
            limits:
              cpu: "1"
              memory: 768Mi
              ephemeral-storage: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
