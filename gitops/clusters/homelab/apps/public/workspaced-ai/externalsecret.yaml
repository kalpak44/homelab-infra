# The database credentials and the JWT, Stripe, Domain Connect, Mailjet and OpenRouter
# keys, synced from Vault. Every key is named for the environment variable the application
# reads, so the Deployment can take the whole Secret with `envFrom` and nothing has to
# restate the mapping.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workspaced-ai
  namespace: workspaced-ai
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: workspaced-ai-secrets
    creationPolicy: Owner
  data:
    - secretKey: WORKSPACED_DB_HOST
      remoteRef:
        key: workspaced-secrets
        property: database-host
    - secretKey: WORKSPACED_DB_PORT
      remoteRef:
        key: workspaced-secrets
        property: database-port
    - secretKey: WORKSPACED_DB_NAME
      remoteRef:
        key: workspaced-secrets
        property: database-name
    - secretKey: WORKSPACED_DB_USERNAME
      remoteRef:
        key: workspaced-secrets
        property: database-username
    - secretKey: WORKSPACED_DB_PASSWORD
      remoteRef:
        key: workspaced-secrets
        property: database-password
    # Signs the login JWTs. Without it the API makes a random key per start, so every
    # rollout would sign everyone out.
    - secretKey: WORKSPACED_JWT_SECRET
      remoteRef:
        key: workspaced-secrets
        property: jwt-secret
    # The Auth0 application's secret, for the sign-in's code exchange. The API refuses to
    # start without it.
    - secretKey: WORKSPACED_AUTH_CLIENT_SECRET
      remoteRef:
        key: workspaced-secrets
        property: auth0-client-secret
    # A restricted key: write on Customers, Checkout Sessions, Tax Rates, Invoices, Invoice
    # Items and Payment Methods, read on Setup Intents. Saving or charging a card needs all.
    - secretKey: WORKSPACED_STRIPE_SECRET_KEY
      remoteRef:
        key: workspaced-secrets
        property: stripe-secret-key
    # Signs the events Stripe posts to /api/v1/billing/stripe/webhook.
    - secretKey: WORKSPACED_STRIPE_WEBHOOK_SECRET
      remoteRef:
        key: workspaced-secrets
        property: stripe-webhook-secret
    # Signs Domain Connect requests; its public half is the _dck1 records in
    # terraform/cloudflare/zones/workspaced.online/edge/domain-connect.tf.
    - secretKey: WORKSPACED_DOMAIN_CONNECT_PRIVATE_KEY
      remoteRef:
        key: workspaced-secrets
        property: domain-connect-private-key
    # Mailjet's API key pair, the same one Terraform uses to manage the workspaced.online
    # sender; mail goes out as any address on that domain.
    - secretKey: WORKSPACED_MAIL_API_KEY
      remoteRef:
        key: workspaced-secrets
        property: mailjet-api-key
    - secretKey: WORKSPACED_MAIL_SECRET_KEY
      remoteRef:
        key: workspaced-secrets
        property: mailjet-secret-key
    # OpenRouter's management key, which creates and revokes the trial's per-user API keys.
    - secretKey: WORKSPACED_OPENROUTER_MANAGEMENT_KEY
      remoteRef:
        key: workspaced-secrets
        property: openrouter-management-key
