# The API runs each workspace as a one-replica Deployment behind a Service, plus a box-<name>
# Service while its web server is public, with a Secret and a ConfigMap holding its
# environment and a PersistentVolumeClaim for its home, in the API's namespace: a Role, not
# a ClusterRole.
# Pods and Deployments are watched, so workspace statuses come from a cache rather than a
# list per request; a Deployment is patched when a restart moves it to the current harness
# image. A restart deletes a workspace's pods by label selector, which is deletecollection,
# not delete. Secrets need get and patch because a workspace's secrets are added and
# removed one key at a time.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspaced-ai-api
  namespace: workspaced-ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspaced-ai-api
  namespace: workspaced-ai
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete", "deletecollection"]
  # A restore runs before the workspace's harness starts, so its log is the only place the
  # API can read its progress from.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # Listed as well, because a workspace's published box-<name> Services are found by
  # label, and the API server offers no deletecollection on Services.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspaced-ai-api
  namespace: workspaced-ai
subjects:
  - kind: ServiceAccount
    name: workspaced-ai-api
    namespace: workspaced-ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspaced-ai-api
