# The agent hub keeps its tables in the API's database, with the API's user; this copies only
# those keys, not the JWT or backup secrets the API's own Secret also holds.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workspaced-ai-agent-hub
  namespace: workspaced-ai
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: workspaced-ai-agent-hub-secrets
    creationPolicy: Owner
  data:
    - secretKey: WORKSPACED_DB_HOST
      remoteRef:
        key: workspaced-secrets
        property: database-host
    - secretKey: WORKSPACED_DB_PORT
      remoteRef:
        key: workspaced-secrets
        property: database-port
    - secretKey: WORKSPACED_DB_NAME
      remoteRef:
        key: workspaced-secrets
        property: database-name
    - secretKey: WORKSPACED_DB_USERNAME
      remoteRef:
        key: workspaced-secrets
        property: database-username
    - secretKey: WORKSPACED_DB_PASSWORD
      remoteRef:
        key: workspaced-secrets
        property: database-password
