# Routes <name>.workspaced.online to web-<name>, the Service the API creates when a
# workspace's web server is turned on, so no route has to be added per workspace.
# The variable in proxy_pass makes nginx resolve each name per request, through the
# resolver below, instead of once at start.
resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name ~^(?<name>[a-z0-9-]+)\.workspaced\.online$;
  client_max_body_size 100m;

  location / {
    proxy_pass http://web-$name.workspaced-ai.svc.cluster.local;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Traefik already set these from the visitor; pass them on rather than add this hop.
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  # A name with no Service does not resolve, and a stopped workspace's Service has no
  # endpoint; nginx reports both as 502, which reads as an outage rather than nothing here.
  error_page 502 504 = @nothing;
  location @nothing {
    return 404 "Nothing is published here.\n";
  }
}

# Probes reach the pod by its IP, which matches no name above.
server {
  listen 8080 default_server;

  location = /healthz {
    return 200;
  }

  location / {
    return 404;
  }
}
