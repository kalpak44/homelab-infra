# Creates, watches and deletes the Hetzner VMs workspaces run on. Internal only: a
# ClusterIP Service and no IngressRoute, so nothing outside the cluster can reach it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspaced-ai-vm-manager
  namespace: workspaced-ai
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: workspaced-ai-vm-manager
  template:
    metadata:
      labels:
        app: workspaced-ai-vm-manager
    spec:
      # Its token reaches Vault only, through the projected volume below; it never talks
      # to the Kubernetes API.
      serviceAccountName: workspaced-ai-vm-manager
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vm-manager
          image: ghcr.io/kalpak44/workspaced-ai-vm-manager:f3b38b8
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: workspaced-ai-vm-manager-secrets
          env:
            # Each VM's secrets, kept under secret/workspaced-ai/vms/<vm id>.
            - name: WORKSPACED_VAULT_URL
              value: https://vault.internal.pavel-usanli.online:8200
            - name: WORKSPACED_VAULT_JWT_PATH
              value: /var/run/secrets/vault/token
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: http
            periodSeconds: 20
          volumeMounts:
            # readOnlyRootFilesystem is on, and Tomcat and the JVM still need somewhere
            # to write their temporary files.
            - name: tmp
              mountPath: /tmp
            - name: vault-token
              mountPath: /var/run/secrets/vault
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
              ephemeral-storage: 64Mi
            # Same as the API's: the JVM sizes its heap from what is left of this after
            # its fixed reservations.
            limits:
              cpu: "1"
              memory: 768Mi
              ephemeral-storage: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
        # Short-lived and rotated by the kubelet; the app reads it afresh at each sign-in.
        - name: vault-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
