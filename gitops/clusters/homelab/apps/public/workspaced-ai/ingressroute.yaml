# The app serves everything, Swagger and health included, under its /api/v1 context path;
# web-ingressroute.yaml takes the rest of the host. middleware.yaml keeps the terminal's
# WebSocket handshake from failing the origin check.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: workspaced-ai-api
  namespace: workspaced-ai
spec:
  entryPoints:
    - public-web-secure
  routes:
    - match: Host(`ai.workspaced.online`) && PathPrefix(`/api/v1/`)
      kind: Rule
      middlewares:
        - name: workspaced-ai-forwarded-https
      services:
        - name: workspaced-ai-api
          port: 8080
  tls:
    certResolver: cloudflare
