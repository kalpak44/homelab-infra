# Each caller of the agent hub's internal routes proves which of these it is with a projected
# token issued for the hub's audience, and the hub lets each reach only its own routes. None
# of them is bound to any Role, and none mounts a token for the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspaced-ai-api
  namespace: workspaced-ai
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspaced-ai-web-gateway
  namespace: workspaced-ai
automountServiceAccountToken: false
