# The Hetzner Cloud token the VM manager creates and deletes VMs with, and the Cloudflare
# token, limited to DNS edit on workspaced.online, it writes each VM's own name with. Its
# own Secret, not keys in workspaced-ai-secrets, so the API pod holds neither.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workspaced-ai-vm-manager
  namespace: workspaced-ai
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: workspaced-ai-vm-manager-secrets
    creationPolicy: Owner
  data:
    - secretKey: WORKSPACED_HETZNER_TOKEN
      remoteRef:
        key: workspaced-vm-manager-secrets
        property: hcloud-token
    - secretKey: WORKSPACED_CLOUDFLARE_TOKEN
      remoteRef:
        key: workspaced-vm-manager-secrets
        property: cloudflare-token
