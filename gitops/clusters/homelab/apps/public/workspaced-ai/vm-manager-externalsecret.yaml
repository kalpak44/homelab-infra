# The Hetzner Cloud token the VM manager creates and deletes VMs with. Its own Secret, not
# a key in workspaced-ai-secrets, so the API pod never holds a credential for Hetzner.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workspaced-ai-vm-manager
  namespace: workspaced-ai
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: workspaced-ai-vm-manager-secrets
    creationPolicy: Owner
  data:
    - secretKey: WORKSPACED_HETZNER_TOKEN
      remoteRef:
        key: workspaced-vm-manager-secrets
        property: hcloud-token
