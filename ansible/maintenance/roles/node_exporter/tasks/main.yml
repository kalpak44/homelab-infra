---
- name: Create the node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# Upstream's tarball rather than apt: Ubuntu's prometheus-node-exporter lags by several
# minors. The version check keeps a re-run from re-downloading what is installed.
- name: Read the installed node_exporter version
  ansible.builtin.command:
    cmd: /usr/local/bin/node_exporter --version
  register: node_exporter_installed
  changed_when: false
  failed_when: false

- name: Download and unpack node_exporter
  ansible.builtin.unarchive:
    src: >-
      https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz
    dest: /opt
    remote_src: true
    owner: root
    group: root
  when: node_exporter_version not in (node_exporter_installed.stdout | default('')) + (node_exporter_installed.stderr | default(''))
  register: node_exporter_unpacked

- name: Install the node_exporter binary
  ansible.builtin.copy:
    src: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: node_exporter_unpacked.changed
  notify: Restart node_exporter

- name: Remove the unpacked node_exporter archive
  ansible.builtin.file:
    path: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64"
    state: absent

- name: Create the textfile collector directory
  ansible.builtin.file:
    path: "{{ node_exporter_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Collect thin pool usage on the Proxmox node
  ansible.builtin.import_tasks: lvm-thin.yml
  when: "'proxmox_host' in group_names"

- name: Deploy the node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
  notify: Restart node_exporter

- name: Flush handlers to apply the unit
  ansible.builtin.meta: flush_handlers

- name: Ensure node_exporter is running
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for node_exporter to answer
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ node_exporter_port }}/metrics"
  register: node_exporter_ready
  until: node_exporter_ready.status == 200
  retries: 6
  delay: 5
