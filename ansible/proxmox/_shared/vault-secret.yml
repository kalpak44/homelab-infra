---
# Read one KV secret from Vault on the controller and expose it as `vault_secret_data`.
# Imported by every role whose service has credentials, so they live in Vault and never in
# the repository or in another CI secret. The convention is in .claude/rules/secrets.md.
#
# Requires: vault_secret (name under secret/), vault_username, vault_password
# Optional: vault_secret_generate, a map of key to value written when the secret does not
#   exist yet; an empty value becomes a random 32-character string. Without it, a missing
#   secret fails the run.

- name: Log in to Vault
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/auth/userpass/login/{{ vault_username }}"
    method: POST
    body_format: json
    body:
      password: "{{ vault_password }}"
  register: vault_login
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: Read secret/{{ vault_secret }}
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/{{ vault_secret }}"
    headers:
      X-Vault-Token: "{{ vault_login.json.auth.client_token }}"
    status_code: [200, 404]
  register: vault_read
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: Fail on a missing secret nothing may generate
  ansible.builtin.fail:
    msg: >-
      secret/{{ vault_secret }} does not exist in Vault. Create it with
      `vault kv put secret/{{ vault_secret }} <key>=<value> ...` and re-run.
  when: vault_read.status == 404 and vault_secret_generate is not defined

# One iteration per key, so each empty value draws its own random string.
- name: Fill in the values to generate
  ansible.builtin.set_fact:
    vault_secret_new: >-
      {{ (vault_secret_new | default({})) | combine({item.key: item.value
           or lookup('ansible.builtin.password', '/dev/null', length=32,
                     chars=['ascii_letters', 'digits'])}) }}
  loop: "{{ vault_secret_generate | dict2items }}"
  when: vault_read.status == 404 and vault_secret_generate is defined
  run_once: true
  no_log: true

# Written only when absent, so a value someone rotated in Vault is never overwritten.
- name: Generate secret/{{ vault_secret }}
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/{{ vault_secret }}"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_login.json.auth.client_token }}"
    body_format: json
    body:
      data: "{{ vault_secret_new }}"
  when: vault_read.status == 404 and vault_secret_generate is defined
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: Re-read the generated secret
  ansible.builtin.uri:
    url: "{{ vault_addr }}/v1/secret/data/{{ vault_secret }}"
    headers:
      X-Vault-Token: "{{ vault_login.json.auth.client_token }}"
  register: vault_reread
  when: vault_read.status == 404 and vault_secret_generate is defined
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: Keep the secret's values
  ansible.builtin.set_fact:
    vault_secret_data: "{{ (vault_reread if vault_read.status == 404 else vault_read).json.data.data }}"
  no_log: true
