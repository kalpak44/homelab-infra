modules:
  # Redirects are followed, so a UI that answers / with a redirect to its login page is
  # healthy. Certificate verification stays on: an expired certificate fails the probe.
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true

  # A resolver can answer NOERROR with no records when its upstreams are unreachable, so
  # the probe also requires an A record in the answer.
  dns_udp:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: ip4
      query_name: cloudflare.com
      query_type: A
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_none_matches_regexp: ['.*\tIN\tA\t.*']

  # Connect and hang up without a byte, which PostgreSQL does not log. Anything sent
  # draws a FATAL line on every probe: blackbox appends a newline to each send, and
  # Postgres reads it as a malformed message.
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
