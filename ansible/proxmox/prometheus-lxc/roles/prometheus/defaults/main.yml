---
prometheus_version: "3.16.0"
node_exporter_version: "1.12.1"

prometheus_port: 9090
node_exporter_port: 9100
prometheus_config_dir: /etc/prometheus
# Matches data_disk_path in terraform/proxmox/prometheus-lxc/main.tf — the TSDB
# is the only thing on that volume.
prometheus_data_dir: /var/lib/prometheus
prometheus_scrape_interval: 15s

# Both caps are enforced, whichever is reached first. The size is held well under
# the 20G data volume: Prometheus deletes a block only after it is written, so a
# cap at the disk size fills the disk before the first deletion.
prometheus_retention_time: 30d
prometheus_retention_size: 15GB

prometheus_tls_enabled: true
prometheus_tls_domain: "prometheus.internal.pavel-usanli.online"
prometheus_cert_path: "/etc/prometheus/tls/cert.pem"
prometheus_key_path: "/etc/prometheus/tls/key.pem"

# One entry per extra target: {name: <job>, targets: ["host:port"]}, with optional
# scheme and metrics_path. The server and its own node_exporter are scraped
# unconditionally.
prometheus_extra_scrape_jobs:
  # Reached through the cluster's ingress rather than the pod, because this host sits
  # outside k3s. The route serves /metrics only.
  - name: crowdsec
    scheme: https
    targets: ["crowdsec.internal.pavel-usanli.online"]
  # Status, method and latency per entryPoint, router and service. No client address:
  # that comes from traefik-requests below.
  - name: traefik
    scheme: https
    targets: ["traefik.internal.pavel-usanli.online"]
  # Per-source request counters from gitops/.../infrastructure/request-metrics. One
  # target per k3s node, on its hostPort: a pod only has data on the node running Traefik.
  - name: traefik-requests
    targets: ["192.168.1.110:9598", "192.168.1.111:9598"]
