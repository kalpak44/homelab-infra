---
prometheus_version: "3.15.0"
node_exporter_version: "1.12.1"

prometheus_port: 9090
node_exporter_port: 9100
prometheus_config_dir: /etc/prometheus
# Matches data_disk_path in terraform/proxmox/prometheus-lxc/main.tf — the TSDB
# is the only thing on that volume.
prometheus_data_dir: /var/lib/prometheus
prometheus_scrape_interval: 15s

# Both caps are enforced, whichever is reached first. The size is held well under
# the 20G data volume: Prometheus deletes a block only after it is written, so a
# cap at the disk size fills the disk before the first deletion.
prometheus_retention_time: 30d
prometheus_retention_size: 15GB

prometheus_tls_enabled: true
prometheus_tls_domain: "prometheus.internal.pavel-usanli.online"
prometheus_cert_path: "/etc/prometheus/tls/cert.pem"
prometheus_key_path: "/etc/prometheus/tls/key.pem"

# One entry per extra target: {name: <job>, targets: ["host:port"]}. The server
# and its own node_exporter are scraped unconditionally.
prometheus_extra_scrape_jobs: []
