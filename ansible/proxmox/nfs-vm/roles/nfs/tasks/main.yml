---
- name: Install qemu-guest-agent
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
    update_cache: true

- name: Ensure qemu-guest-agent is running
  ansible.builtin.systemd:
    name: qemu-guest-agent
    state: started
    enabled: true

- name: Install nfs-kernel-server
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present

- name: Format data disk
  community.general.filesystem:
    fstype: ext4
    dev: "{{ nfs_data_disk }}"
    state: present

- name: Mount data disk
  ansible.builtin.mount:
    path: /srv/nfs
    src: "{{ nfs_data_disk }}"
    fstype: ext4
    opts: defaults
    state: mounted

- name: Create export directory
  ansible.builtin.file:
    path: "{{ nfs_export_path }}"
    state: directory
    owner: nobody
    group: nogroup
    mode: "0777"

- name: Configure exports
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify: Reload exports

- name: Load nfsd kernel module
  community.general.modprobe:
    name: nfsd
    state: present

- name: Persist nfsd module across reboots
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/nfs.conf
    line: nfsd
    create: true

# nfsd sizes its block limit from RAM at boot, and a mount keeps the size it negotiated, so
# shrinking the VM made every client write "RPC fragment too large" and hang on its hard mount.
# The value is only writable while nfsd is stopped, hence before rpc.nfsd starts.
- name: Create the nfs-server drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nfs-server.service.d
    state: directory
    mode: "0755"

- name: Pin the nfsd block size
  ansible.builtin.copy:
    dest: /etc/systemd/system/nfs-server.service.d/max-block-size.conf
    content: |
      [Service]
      ExecStartPre=/bin/sh -c 'echo {{ nfs_max_block_size }} > /proc/fs/nfsd/max_block_size'
    owner: root
    group: root
    mode: "0644"
  notify: Restart nfs-kernel-server

- name: Enable and start nfs-kernel-server
  ansible.builtin.systemd:
    name: nfs-kernel-server
    enabled: true
    state: started