---
grafana_version: "13.3.0"

# Served on 443 directly, so the URL carries no port. The unit gets
# CAP_NET_BIND_SERVICE for it rather than running as root.
grafana_port: 443
grafana_domain: "grafana.internal.pavel-usanli.online"
grafana_tls_dir: /etc/grafana/tls

grafana_prometheus_url: "https://prometheus.internal.pavel-usanli.online:9090"

# The admin login lives in this Vault secret, generated on the first run if absent.
grafana_vault_admin_secret: grafana-secrets

# One dashboard each, from files/host-dashboards/. Every host node_exporter runs on,
# the Prometheus LXC included.
grafana_host_dashboards: "{{ (groups['proxmox_host'] + groups['lxc'] + groups['k3s'] + groups['vm']) | sort }}"
