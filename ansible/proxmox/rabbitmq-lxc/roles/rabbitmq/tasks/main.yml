# `latest`, not `present`: with `present` the package is installed once and then never
# moves, so a broker provisioned a year ago stays on that year's release for ever.
- name: Install RabbitMQ
  apt:
    name: rabbitmq-server
    state: latest
    update_cache: true

- name: Enable and start RabbitMQ
  systemd:
    name: rabbitmq-server
    enabled: true
    state: started

- name: Enable management plugin
  command: rabbitmq-plugins enable rabbitmq_management
  register: plugin_result
  changed_when: "'Plugin configuration unchanged' not in plugin_result.stdout"

# Asked for, not inferred from an error string. Tolerating "already exists" meant matching
# rabbitmqctl's wording, and `no_log` censors the result, so any other failure surfaced as
# a red task with no reason attached.
- name: Read existing users
  command: rabbitmqctl list_users --quiet --formatter json
  register: rabbitmq_users
  changed_when: false

# Skipped when no credentials were supplied, the same guard the postgres role uses. A
# shell missing the secret would otherwise run `add_user "" ""` and fail the whole play.
- name: Create admin user
  command: rabbitmqctl add_user {{ rabbitmq_user }} {{ rabbitmq_password }}
  when:
    - rabbitmq_user != ""
    - rabbitmq_user not in (rabbitmq_users.stdout | from_json | map(attribute='user') | list)
  no_log: true

- name: Set admin user tags
  command: rabbitmqctl set_user_tags {{ rabbitmq_user }} administrator
  when: rabbitmq_user != ""
  changed_when: true

- name: Set admin user permissions
  command: rabbitmqctl set_permissions -p {{ rabbitmq_vhost }} {{ rabbitmq_user }} ".*" ".*" ".*"
  when: rabbitmq_user != ""
  changed_when: true

# The default guest account is reachable on localhost with a published password.
- name: Delete guest user
  command: rabbitmqctl delete_user guest
  when: "'guest' in (rabbitmq_users.stdout | from_json | map(attribute='user') | list)"

- name: Install certbot, Cloudflare plugin, and nginx
  apt:
    name:
      - certbot
      - python3-certbot-dns-cloudflare
      - nginx
    state: present

- name: Deploy Cloudflare credentials
  copy:
    dest: /etc/letsencrypt/cloudflare.ini
    content: "dns_cloudflare_api_token = {{ cloudflare_api_token }}\n"
    mode: "0600"

- name: Issue Let's Encrypt certificate
  command: >
    certbot certonly --dns-cloudflare
    --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini
    --dns-cloudflare-propagation-seconds 30
    --non-interactive --agree-tos
    -m {{ letsencrypt_email }}
    -d {{ rabbitmq_domain }}
  args:
    creates: /etc/letsencrypt/live/{{ rabbitmq_domain }}/fullchain.pem

- name: Deploy nginx configuration
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/rabbitmq
    mode: "0644"
  notify: Reload nginx

- name: Enable nginx site
  file:
    src: /etc/nginx/sites-available/rabbitmq
    dest: /etc/nginx/sites-enabled/rabbitmq
    state: link
  notify: Reload nginx

- name: Remove nginx default site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Enable and start nginx
  systemd:
    name: nginx
    enabled: true
    state: started

- name: Deploy certbot renewal hook
  template:
    src: restart-nginx.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/restart-nginx.sh
    mode: "0755"

# Repairs a certificate that already exists, which `certbot certonly` above cannot: it is
# guarded on the file being there. Runs after the deploy hook, so a renewal reloads the
# service.
- name: Renew and verify the certificate
  ansible.builtin.import_tasks: ../../../_shared/certbot-renew.yml
  vars:
    certbot_domain: "{{ rabbitmq_domain }}"
