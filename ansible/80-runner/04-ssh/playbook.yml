---
- name: Configure runner SSH access
  hosts: all
  gather_facts: false
  become: true
  vars:
    operator_public_key: "{{ lookup('ansible.builtin.env', 'OPERATOR_PUBLIC_KEY') }}"
  pre_tasks:
    - name: Read this component’s connection credentials
      ansible.builtin.import_tasks: ../../shared/connection.yml
    - name: Check required inputs
      ansible.builtin.assert:
        that:
          - operator_public_key | length > 0
        fail_msg: Set SSH_PRIVATE_KEY (base64) in this component’s .env or your shell.
  tasks:
    - name: Authorize the operator key for root and ubuntu
      ansible.posix.authorized_key:
        user: "{{ item }}"
        key: "{{ operator_public_key }}"
      loop: [root, ubuntu]
    - name: Apply the shared sshd policy
      ansible.builtin.import_tasks: ../../shared/tasks/enable-root-ssh.yml
