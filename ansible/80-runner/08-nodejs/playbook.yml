---
- name: Install Node.js
  hosts: all
  gather_facts: false
  become: true
  pre_tasks:
    - name: Read this component’s connection credentials
      ansible.builtin.import_tasks: ../../shared/connection.yml
  tasks:
    - name: Add NodeSource apt keyring
      ansible.builtin.shell:
        cmd: curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
      args:
        creates: /usr/share/keyrings/nodesource.gpg
    - name: Add NodeSource apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/nodesource.list
        content: |
          deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main
        mode: '0644'
    - name: Install nodejs
      ansible.builtin.apt:
        name:
          - nodejs
        state: present
        update_cache: true
