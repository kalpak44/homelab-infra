# Shared task file — imported early by every service playbook and by
# 90-maintenance/ssh-access.yml. Root logs in with the operator key only; a host
# sets `ssh_password_login: true` in the inventory to keep password login for people
# who have no key (mihal-lxc).
#
# On Ubuntu cloud images, cloud-init drops
# /etc/ssh/sshd_config.d/60-cloudimg-settings.conf and can regenerate it on boot.
# sshd_config drop-ins are read in filename order and *first match wins per keyword*,
# so `00-homelab.conf` decides regardless of what sorts after it.

- name: Install openssh-server
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Ensure sshd_config.d directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Drop homelab sshd override (first-wins over cloud-init drop-ins)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-homelab.conf
    content: |
      # Managed by ansible/shared/tasks/enable-root-ssh.yml
      # sshd applies first match per keyword; this file sorts before every other drop-in.
      {% if ssh_password_login | default(false) %}
      PermitRootLogin yes
      PasswordAuthentication yes
      {% else %}
      PermitRootLogin prohibit-password
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      {% endif %}
      PubkeyAuthentication yes
    owner: root
    group: root
    mode: "0644"
  register: _ssh_config_dropin

# On a bad config this fails with the old daemon still serving the current session.
- name: Validate the resulting sshd config
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Ensure SSH is running and restart if drop-in changed
  ansible.builtin.systemd:
    name: ssh
    state: "{{ 'restarted' if _ssh_config_dropin.changed else 'started' }}"
    enabled: true
