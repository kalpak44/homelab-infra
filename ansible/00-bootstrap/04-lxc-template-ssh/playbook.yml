---
- name: Make the LXC template accept key-only root SSH
  hosts: all
  gather_facts: false
  vars:
    lxc_template: "{{ lookup('ansible.builtin.env', 'LXC_TEMPLATE') | default('ubuntu-24.04-standard_24.04-2_amd64.tar.zst', true) }}"
  pre_tasks:
    - name: Read this component’s connection credentials
      ansible.builtin.import_tasks: ../../shared/connection.yml
  tasks:
    - name: Check whether the template already carries the key-only drop-in
      ansible.builtin.shell: |
        listing="$(tar -I zstd -tf /var/lib/vz/template/cache/{{ lxc_template }})"
        grep -qF "etc/ssh/sshd_config.d/00-homelab.conf" <<<"$listing" \
          && ! grep -qF "etc/ssh/sshd_config.d/99-password-login.conf" <<<"$listing"
      args:
        executable: /bin/bash
      register: lxc_template_patched
      changed_when: false
      failed_when: false
    - name: Patch LXC template – key-only root SSH
      when: lxc_template_patched.rc != 0
      block:
        - name: Create temp dir for template extraction
          ansible.builtin.tempfile:
            state: directory
            suffix: lxc-patch
          register: lxc_patch_dir
        - name: Extract LXC template
          ansible.builtin.command:
            cmd: "tar -I zstd -xf /var/lib/vz/template/cache/{{ lxc_template }} -C {{ lxc_patch_dir.path }}"
        - name: Ensure sshd_config.d exists in extracted rootfs
          ansible.builtin.file:
            path: "{{ lxc_patch_dir.path }}/etc/ssh/sshd_config.d"
            state: directory
            mode: '0755'
        # Same file and content as ansible/shared/tasks/enable-root-ssh.yml writes, so a
        # new container is key-only before its first Ansible run.
        - name: Write the key-only sshd drop-in
          ansible.builtin.copy:
            dest: "{{ lxc_patch_dir.path }}/etc/ssh/sshd_config.d/00-homelab.conf"
            content: |
              PermitRootLogin prohibit-password
              PasswordAuthentication no
              KbdInteractiveAuthentication no
            mode: '0644'
        - name: Remove the password-login drop-in
          ansible.builtin.file:
            path: "{{ lxc_patch_dir.path }}/etc/ssh/sshd_config.d/99-password-login.conf"
            state: absent
        - name: Repack LXC template
          ansible.builtin.command:
            cmd: "tar -I zstd -cf /var/lib/vz/template/cache/{{ lxc_template }} --numeric-owner -C {{ lxc_patch_dir.path }} ."
      always:
        - name: Remove temp extraction dir
          ansible.builtin.file:
            path: "{{ lxc_patch_dir.path }}"
            state: absent
          when: lxc_patch_dir.path is defined
