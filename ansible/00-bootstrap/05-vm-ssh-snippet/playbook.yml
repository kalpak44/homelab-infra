---
- name: Create the VM SSH cloud-init snippet
  hosts: all
  gather_facts: false
  pre_tasks:
    - name: Read this component’s connection credentials
      ansible.builtin.import_tasks: ../../shared/connection.yml
  tasks:
    - name: Create VM vendor-data snippet for SSH password auth
      ansible.builtin.copy:
        dest: /var/lib/vz/snippets/vm-ssh-password.yaml
        content: |
          #cloud-config
          write_files:
            - path: /etc/ssh/sshd_config.d/00-password-login.conf
              content: |
                PermitRootLogin yes
                PasswordAuthentication yes
                UsePAM yes
              permissions: '0644'
          runcmd:
            - systemctl restart ssh
        mode: '0644'
