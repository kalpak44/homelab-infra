---
nfs_export_path: /srv/nfs/k8s
# A reboot can make the root disk sdb, which then aliases the data disk.
nfs_data_disk: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
# The k3s nodes. The export keeps no_root_squash, so any other host allowed to mount
# it would have root over every volume; the nftables guard enforces the same list.
nfs_clients:
  - 192.168.1.110
  - 192.168.1.111
# The kernel maximum; larger than any rsize/wsize a client negotiates on its own.
nfs_max_block_size: 1048576
