name: AWS - Deploy

on:
  workflow_dispatch:
    inputs:
      resource:
        description: Which AWS account concern under terraform/aws/ to apply
        required: true
        type: choice
        options:
          - personal/account

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-${{ inputs.resource }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: terraform
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      AWS_TERRAFORM_ROLE_ARN: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Require the configured Terraform role
        run: test -n "$AWS_TERRAFORM_ROLE_ARN"
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: eu-central-1
          allowed-account-ids: '039959484327'
          unset-current-credentials: true
      - run: just deploy aws "${{ inputs.resource }}"
