name: AI Security Agent

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate traffic-based rule proposals without publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: infra-agents
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: self-hosted
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      HOST_PASSWORD: ${{ secrets.HOST_PASSWORD }}
      VAULT_ADDR: https://vault.internal.pavel-usanli.online:8200
      VAULT_USERNAME: ${{ secrets.VAULT_USERNAME }}
      VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
      DEEPSEEK_APIKEY: ${{ secrets.DEEPSEEK_APIKEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      K3S_SERVER: ${{ vars.K3S_SERVER || '192.168.1.110' }}
      PROXMOX_SSH_HOST: ${{ vars.PROXMOX_SSH_HOST || '192.168.1.50' }}
      PROMETHEUS_URL: ${{ vars.PROMETHEUS_URL || 'https://prometheus.internal.pavel-usanli.online:9090' }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GH_ADMIN_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/infra-agent
        env:
          AGENT_DIRECTORY: ${{ runner.temp }}/infra-agent-security-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          kind: security
