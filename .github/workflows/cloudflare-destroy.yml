name: Cloudflare - Destroy

on:
  workflow_dispatch:
    inputs:
      resource:
        description: Which resource under terraform/cloudflare/ to destroy
        required: true
        type: choice
        options:
          - tunnels/homelab
          - tunnels/mihal
          - zones/pavel-usanli.online/edge
          - zones/pavel-usanli.online/email
          - zones/pavel-usanli.online/internal
          - zones/proklinator.online/edge
          - zones/workspaced.online/edge

jobs:
  destroy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: terraform
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MJ_APIKEY_PUBLIC: ${{ secrets.MJ_APIKEY_PUBLIC }}
      MJ_APIKEY_PRIVATE: ${{ secrets.MJ_APIKEY_PRIVATE }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just destroy cloudflare "${{ inputs.resource }}"
