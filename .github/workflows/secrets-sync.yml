name: Secrets - Sync from Vault

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ansible
    env:
      VAULT_ADDR: https://vault.internal.pavel-usanli.online:8200
      VAULT_USERNAME: ${{ secrets.VAULT_USERNAME }}
      VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just secrets-sync
