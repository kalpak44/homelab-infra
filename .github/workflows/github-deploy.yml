name: GitHub - Deploy

on:
  workflow_dispatch:
    inputs:
      resource:
        description: Which repo under terraform/github/ to apply
        required: true
        type: choice
        options:
          - bunker-party
          - code-viewer-bot
          - kalpak44
          - mac-calendar-mcp
          - mite-assistant-mcp
          - plugin-noco-tools

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: terraform
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      GH_ADMIN_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      GH_OWNER: ${{ secrets.GH_OWNER }}
      DEEPSEEK_APIKEY: ${{ secrets.DEEPSEEK_APIKEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just deploy github "${{ inputs.resource }}"