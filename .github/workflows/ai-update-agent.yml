name: AI Update Agent

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate proposed updates and report without publishing
        type: boolean
        default: false

permissions:
  contents: read

# Both agents share the checkout-to-push lane, so security never races version updates.
concurrency:
  group: infra-agents
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: self-hosted
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      HOST_PASSWORD: ${{ secrets.HOST_PASSWORD }}
      DEEPSEEK_APIKEY: ${{ secrets.DEEPSEEK_APIKEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      K3S_SERVER: ${{ vars.K3S_SERVER || '192.168.1.110' }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GH_ADMIN_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ./.github/actions/infra-agent
        env:
          AGENT_DIRECTORY: ${{ runner.temp }}/infra-agent-update-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          kind: update
