name: Daily infrastructure agent
description: Run Codex directly with shared and task-specific Markdown instructions
inputs:
  kind:
    description: update or security
    required: true
runs:
  using: composite
  steps:
    - name: Install current stable Helm for migration rendering
      uses: azure/setup-helm@v5
      with:
        version: latest
        latest-fallback: 'false'
        checksum-policy: required
    - name: Check runner prerequisites
      shell: bash
      run: |
        set -euo pipefail
        for tool in python3 kubectl ssh ssh-agent git gh curl npm just ansible-playbook terraform helm; do
          command -v "$tool" >/dev/null || { echo "Missing runner tool: $tool" >&2; exit 1; }
        done
        python3 -c 'import yaml'
        test -n "$DEEPSEEK_APIKEY"
        test -n "$GH_TOKEN"
        test -n "$VAULT_USERNAME"
        test -n "$VAULT_PASSWORD"
        mkdir -p "$AGENT_DIRECTORY"
        chmod 700 "$AGENT_DIRECTORY"
    # Every guest accepts only the operator key. The agent keeps it in ssh-agent, so plain
    # ssh needs no key argument; SSH_PRIVATE_KEY stays set for the just recipes.
    - name: Load the operator SSH key from Vault
      shell: bash
      run: |
        set -euo pipefail
        keyfile="$AGENT_DIRECTORY/operator-key"
        trap 'rm -f "$keyfile"' EXIT
        python3 .github/scripts/load_operator_key.py "$keyfile"
        eval "$(ssh-agent -s)" >/dev/null
        echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
        echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
        ssh-add -q "$keyfile"
    # The security agent gets a token for its own read-only account, so the API server, not
    # the prompt, refuses a write. It used to fetch the k3s admin kubeconfig itself, and ran a
    # pod with it. Four hours outlasts the agent's working budget.
    - name: Mint a read-only kubeconfig for the security agent
      if: inputs.kind == 'security'
      shell: bash
      run: |
        set -euo pipefail
        ssh_k3s() { ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 "root@$K3S_SERVER" "$@"; }
        token="$(ssh_k3s k3s kubectl -n crowdsec create token security-agent --duration=4h)"
        echo "::add-mask::$token"
        ca="$(ssh_k3s "k3s kubectl config view --raw -o 'jsonpath={.clusters[0].cluster.certificate-authority-data}'")"
        kubeconfig="$AGENT_DIRECTORY/kubeconfig"
        umask 077
        cat > "$kubeconfig" <<EOF
        apiVersion: v1
        kind: Config
        clusters:
          - name: k3s
            cluster:
              server: https://$K3S_SERVER:6443
              certificate-authority-data: $ca
        users:
          - name: security-agent
            user:
              token: $token
        contexts:
          - name: security-agent
            context: {cluster: k3s, user: security-agent}
        current-context: security-agent
        EOF
        KUBECONFIG="$kubeconfig" kubectl auth can-i list pods --all-namespaces >/dev/null
        echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
    - name: Install pinned Codex CLI in temporary directory
      shell: bash
      run: |
        set -euo pipefail
        npm install --prefix "$AGENT_DIRECTORY/tools" --ignore-scripts --no-audit --no-fund @openai/codex@0.171.0
        echo "$AGENT_DIRECTORY/tools/node_modules/.bin" >> "$GITHUB_PATH"
    - name: Run Codex maintenance from Markdown instructions
      shell: bash
      env:
        AGENT_KIND: ${{ inputs.kind }}
      run: python3 .github/scripts/run_agent.py "$AGENT_KIND" "$AGENT_DIRECTORY"
    - name: Publish daily report
      if: always()
      shell: bash
      run: |
        if [ -f "$AGENT_DIRECTORY/summary.md" ]; then
          cat "$AGENT_DIRECTORY/summary.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Agent did not complete. Inspect the failed phase; no successful deployment is implied." >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Keep the sanitized report and progress log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: infra-agent-report
        path: |
          ${{ env.AGENT_DIRECTORY }}/summary.md
          ${{ env.AGENT_DIRECTORY }}/progress.log
        if-no-files-found: ignore
        retention-days: 14
    - name: Discard transient credentials and evidence
      if: always()
      shell: bash
      # Go writes its module cache read-only, which rm -rf alone cannot delete.
      run: |
        if [ -n "${SSH_AGENT_PID:-}" ]; then ssh-agent -k >/dev/null 2>&1 || true; fi
        chmod -R u+w -- "$AGENT_DIRECTORY" 2>/dev/null || true
        rm -rf -- "$AGENT_DIRECTORY"
