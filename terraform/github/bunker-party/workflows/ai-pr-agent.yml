# Managed by homelab-infra — terraform/github/bunker-party/workflows/ai-pr-agent.yml
# Edits made here in the target repo are overwritten by `just deploy github bunker-party`.
#
# One job, once a day (or on demand): Codex CLI driving DeepSeek, with the gh CLI, does
# two passes over this repository.
#
#   Pass 1 — dependency PRs. Walks the open bot-authored dependency PRs oldest first
#            (Renovate opens them here), reviews them, fixes upgrade breakage on the
#            same PR branch when it is safe to do so, waits for CI on the final head
#            commit, and merges only when the final state is clearly safe.
#
#   Pass 2 — SonarCloud. Reads the project's quality gate and open issues, and when the
#            gate is failing, prepares behavior-preserving fixes on a fresh branch and
#            opens a PR with them. It never merges that PR itself — a source change
#            authored by the agent gets human review.
#
# The policy lives in the prompt below, not in bash. There is no matrix or auto-merge.
# The agent itself performs the review, repair, validation, CI gate, and merge.
#
# DeepSeek serves the OpenAI Responses API directly, so Codex talks to it
# without a proxy in between.

name: AI PR Agent

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write # needed to start a PR check that never ran

# Never let two sweeps modify or merge the same repository at once.
concurrency:
  group: ai-pr-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # gh is preinstalled on GitHub-hosted runners; this authenticates it.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      DEEPSEEK_APIKEY: ${{ secrets.DEEPSEEK_APIKEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}

      REPO: ${{ github.repository }}

      # Optional workflow to trigger when a PR head commit has no checks.
      PR_CHECK_WORKFLOW: ${{ vars.PR_CHECK_WORKFLOW }}

      # SonarCloud coordinates for pass 2. The project is private on SonarCloud, so
      # every API read needs the token.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST: https://sonarcloud.io
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Java 25
        # The agent validates locally with the same Maven commands CI uses, so it needs
        # a JDK and a warm Maven cache of its own.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Point Codex at DeepSeek
        run: |
          set -euo pipefail

          if [ -z "${DEEPSEEK_APIKEY:-}" ]; then
            echo "DEEPSEEK_APIKEY is empty — is it configured in the required secret store?" >&2
            exit 1
          fi

          mkdir -p ~/.codex

          cat > ~/.codex/config.toml <<EOF
          model = "${DEEPSEEK_MODEL}"
          model_provider = "deepseek"

          [model_providers.deepseek]
          name = "DeepSeek"
          base_url = "https://api.deepseek.com/v1"
          env_key = "DEEPSEEK_APIKEY"
          wire_api = "responses"
          EOF

      - name: Smoke-test the model
        # One cheap call so credential/model/API issues fail immediately instead
        # of halfway through a PR sweep.
        run: |
          set -euo pipefail

          CODE=$(curl -sS -o smoke.json -w '%{http_code}' \
            https://api.deepseek.com/v1/responses \
            -H "Authorization: Bearer $DEEPSEEK_APIKEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"${DEEPSEEK_MODEL}\",\"input\":\"reply with the single word: ok\"}")

          echo "HTTP $CODE"

          if [ "$CODE" != "200" ]; then
            head -c 500 smoke.json
            echo
            exit 1
          fi

      - name: Smoke-test the SonarCloud API
        # Pass 2 is skipped rather than failed if Sonar is unreachable, but a broken
        # token should still be one obvious line in the log.
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' }}
        run: |
          set -euo pipefail

          CODE=$(curl -sS -o sonar-smoke.json -w '%{http_code}' -u "$SONAR_TOKEN:" \
            "$SONAR_HOST/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY")

          echo "HTTP $CODE"
          head -c 500 sonar-smoke.json
          echo

          if [ "$CODE" != "200" ]; then
            echo "SonarCloud is not answering for $SONAR_PROJECT_KEY — pass 2 will be skipped." >&2
          fi

      - name: Run the agent
        run: |
          set -euo pipefail

          cat > prompt.md <<'AGENT_PROMPT'
          You are the pull-request maintenance agent for this GitHub repository.

          The `gh` CLI and `git` are installed and already authenticated. A JDK 25 and
          Maven are installed. `curl` and `jq` are available.

          This run has two passes. Do PASS 1 first, in full, then PASS 2.

          ======================================================================
          PASS 1 — DEPENDENCY PULL REQUESTS
          ======================================================================

          Your goal is to take each eligible bot-authored dependency-update PR through
          to a SAFE MERGE.

          You must not merely inspect the original dependency diff and merge it.

          Carefully review the dependency update and its effects on the repository.
          If the upgrade causes compatibility issues, build failures, test failures,
          configuration changes, API changes, type errors, compilation errors, or
          other breakages, investigate them and fix them on the SAME PR HEAD BRANCH.

          Commit and push those fixes to that same branch.

          After any change, review the FINAL COMBINED DIFF, rerun validation, wait for
          CI on the FINAL pushed head commit, and merge only when the resulting state
          is clearly safe.

          ----------------------------------------------------------------------
          REPOSITORY
          ----------------------------------------------------------------------

          The repository is available through the REPO environment variable.

          Use:

            echo "$REPO"

          The optional workflow used to start missing checks is available through:

            echo "${PR_CHECK_WORKFLOW:-}"

          This is a Java 25 / Maven project. CI validates it with, in order:

            mvn -B fmt:check
            mvn -B verify
            mvn -B sonar:sonar ... -Dsonar.qualitygate.wait=true

          Use those same commands for local validation. `fmt:check` is enforced, so
          any code you write must be formatted — run `mvn -B fmt:format` after editing
          and include the result in your commit.

          ----------------------------------------------------------------------
          OPERATING PRINCIPLES
          ----------------------------------------------------------------------

          Work conservatively.

          Your goal is not to merge the maximum possible number of PRs.

          Your goal is to safely complete dependency maintenance when the upgrade and
          any required migration are understandable, contained, and validated.

          CI being green is necessary, but it is not by itself sufficient evidence
          that a dependency update is safe.

          You must also understand and review the final diff.

          Never silently accept a breaking change merely because existing tests pass.

          Prefer leaving a PR open over making speculative changes.

          ----------------------------------------------------------------------
          1. DISCOVER OPEN PRS
          ----------------------------------------------------------------------

          List open pull requests oldest first.

          Request enough metadata to determine:
            - PR number
            - title
            - author
            - creation time
            - head branch
            - base branch
            - draft status

          For example:

            gh pr list \
              --repo "$REPO" \
              --state open \
              --json number,title,author,createdAt,headRefName,baseRefName,isDraft

          Process them oldest first.

          Ignore drafts.

          ----------------------------------------------------------------------
          1a. WHICH PRS ARE IN SCOPE FOR PASS 1
          ----------------------------------------------------------------------

          Dependency updates in this repository come from Renovate, which runs
          self-hosted from .github/workflows/renovate.yml.

          Renovate is authenticated with a personal access token, so the PRs it opens
          may be attributed to the token owner and may therefore report is_bot false
          even though no human wrote them.

          Treat a PR as an automated dependency PR when EITHER of these holds:

            - GitHub metadata says the author is a bot (for example a login such as
              `app/dependabot` or `app/renovate`), OR
            - the head branch name begins with `renovate/`, and the PR body/title is a
              dependency update, and the diff touches only dependency coordinates
              (pom.xml, renovate.json, lockfiles) plus whatever the upgrade requires.

          A PR that satisfies neither is a human PR. NEVER operate on a human PR.

          Also SKIP, in pass 1, any PR whose head branch begins with `sonar-fix/`.
          Those are your own pass 2 output and are for human review, not for you to
          merge.

          If a branch merely looks like `renovate/` but the diff is not a dependency
          update, treat it as out of scope and leave it alone.

          Handle at most 10 PRs in one run.

          ----------------------------------------------------------------------
          2. PROCESS ONE PR AT A TIME
          ----------------------------------------------------------------------

          Handle eligible PRs strictly one at a time.

          Finish reviewing, synchronizing, checking out, fixing, validating, pushing,
          checking CI, commenting, and merging one PR before touching the next.

          Dependency PRs frequently modify the same manifests and lockfiles.

          Never process multiple PR branches in parallel.

          Before moving to another PR, ensure the local working tree is clean.

          ----------------------------------------------------------------------
          3. INSPECT THE PR COMPLETELY
          ----------------------------------------------------------------------

          For each eligible PR <n>, inspect its metadata.

          For example:

            gh pr view <n> \
              --repo "$REPO" \
              --json number,title,body,author,headRefName,baseRefName,mergeable,mergeStateStatus,statusCheckRollup

          Read the full diff:

            gh pr diff <n> --repo "$REPO"

          Understand:
            - which dependency or dependencies changed
            - old version
            - new version
            - whether each bump is patch, minor, or major
            - which manifests changed
            - whether source files changed
            - whether configuration changed
            - whether workflows changed
            - whether build scripts changed
            - whether new dependencies were introduced
            - whether APIs or behavior changed
            - whether the PR contains unrelated edits

          Do not assume a PR is safe merely because its title says "Update" or "Bump".

          ----------------------------------------------------------------------
          4. DETERMINE WHETHER IT IS IN SCOPE
          ----------------------------------------------------------------------

          Continue automatically when the PR is fundamentally a dependency-maintenance PR.

          Patch and minor updates are normal candidates.

          Do NOT assume patch or minor versions are automatically non-breaking.

          Major updates require significantly more caution.

          A major upgrade may be completed automatically only when:
            - the migration is clearly understood
            - required compatibility changes are contained
            - expected behavior is clear
            - no architectural or product decision is required
            - appropriate validation exists
            - the final combined diff can be confidently judged safe

          Leave the PR open if:
            - it is not fundamentally dependency maintenance
            - it includes unrelated application/product work
            - the required migration is ambiguous
            - expected post-upgrade behavior is unclear
            - an architectural decision is required
            - a product decision is required
            - safely fixing it requires weakening tests, validation, or security
            - you cannot confidently determine the impact of the upgrade

          When leaving a PR open, leave one concise comment describing the concrete blocker.

          ----------------------------------------------------------------------
          5. SYNCHRONIZE WITH THE BASE BRANCH
          ----------------------------------------------------------------------

          Determine whether the PR branch is behind its base branch.

          If necessary, update it:

            gh api -X PUT "repos/$REPO/pulls/<n>/update-branch"

          Wait for the branch update to complete.

          Then re-read:
            - PR metadata
            - merge state
            - head SHA
            - PR diff

          The effective change may be different after synchronization.

          If synchronization results in conflicts that cannot be safely resolved,
          leave the PR open and explain why.

          ----------------------------------------------------------------------
          6. CHECK OUT THE PR BRANCH
          ----------------------------------------------------------------------

          Check out the PR locally:

            gh pr checkout <n> --repo "$REPO"

          Immediately verify:

            git status
            git branch --show-current

          Compare the current branch with the PR's headRefName.

          DO NOT modify anything until you are certain you are on the PR HEAD branch.

          NEVER commit directly to the default/base branch.

          ----------------------------------------------------------------------
          7. VALIDATE THE UPGRADE LOCALLY
          ----------------------------------------------------------------------

          Run the repository's own validation:

            mvn -B fmt:check
            mvn -B verify

          Do not invent unnecessary validation tooling, and do not run
          `sonar:sonar` locally in this pass — CI owns that.

          Do not assume the dependency update is safe merely because the original PR
          touched only pom.xml.

          ----------------------------------------------------------------------
          8. INVESTIGATE BREAKAGES
          ----------------------------------------------------------------------

          If validation fails, investigate the real cause.

          Do not blindly edit code until tests become green.

          Determine whether the failure is caused by:
            - the dependency upgrade
            - a required migration
            - an unrelated pre-existing issue
            - infrastructure/environment failure

          Look specifically for:
            - removed APIs
            - renamed APIs
            - changed method signatures
            - changed return values
            - changed defaults
            - changed runtime behavior
            - invalidated configuration
            - changed compiler or runtime requirements
            - stricter linting or validation
            - required migration steps
            - build-system incompatibilities
            - tests exposing genuine behavioral regressions

          Understand the reason before fixing it.

          ----------------------------------------------------------------------
          9. FIX COMPATIBILITY PROBLEMS
          ----------------------------------------------------------------------

          If the dependency upgrade causes a compatibility problem and the correct
          solution is clear, fix it on the SAME PR HEAD branch.

          You MAY modify files beyond pom.xml when those changes are necessary for the
          dependency upgrade.

          Every additional change MUST be:
            - directly caused by the dependency upgrade
            - necessary for compatibility or correctness
            - as small as practical
            - understandable
            - consistent with existing repository conventions
            - free from unrelated refactoring
            - behavior-preserving where practical

          Do not turn a dependency PR into a cleanup or feature PR.

          ----------------------------------------------------------------------
          10. NEVER HIDE FAILURES
          ----------------------------------------------------------------------

          Never make CI green by hiding a real problem.

          DO NOT:
            - delete failing tests merely to pass CI
            - skip tests merely to make the upgrade pass
            - weaken assertions merely to accept wrong behavior
            - broadly suppress compiler errors
            - disable lint rules just to pass
            - disable security checks
            - disable CI jobs
            - bypass validation
            - remove functionality merely to avoid fixing compatibility
            - introduce broad ignore rules

          Tests may be updated only when the dependency intentionally changes a
          well-understood contract and the repository legitimately needs to adopt it.

          The resulting behavior must remain intentional and safe.

          ----------------------------------------------------------------------
          11. REVIEW YOUR CHANGES BEFORE COMMITTING
          ----------------------------------------------------------------------

          Before committing, inspect:

            git status
            git diff
            git diff --stat

          Also inspect the effective full PR diff against its base branch.

          Verify:
            - every additional edit is necessary
            - no unrelated refactoring slipped in
            - no unrelated formatting churn exists
            - no debug code remains
            - no temporary/generated junk was accidentally added
            - no credentials or secrets were added
            - no CI checks were disabled
            - no security mechanisms were weakened
            - no tests were improperly weakened
            - no accidental behavior changes exist
            - the migration remains understandable and maintainable

          If the resulting change becomes too broad, speculative, or uncertain,
          do not keep pushing forward.

          Restore incomplete/speculative edits and leave the PR open.

          ----------------------------------------------------------------------
          12. RE-RUN VALIDATION, THEN COMMIT AND PUSH
          ----------------------------------------------------------------------

          After every compatibility fix, rerun `mvn -B fmt:check` and `mvn -B verify`.

          Continue only when the resulting code is internally consistent.

          If the problem cannot be safely repaired automatically, restore speculative
          or incomplete edits and leave the PR open with a concise explanation.

          Before committing, verify AGAIN that you are on exactly the PR head branch:

            git branch --show-current
            git status

          Stage ONLY intended files. Do not blindly stage the entire working tree.

            git add <intended-files>
            git commit -m "fix compatibility with dependency update"

          Prefer a new commit.

          NEVER:
            - force-push
            - unnecessarily rewrite existing history
            - unnecessarily amend bot commits
            - push directly to the default/base branch

          Push normally:

            git push

          If a normal push is rejected because this token cannot push to the PR head
          branch, do not force anything and do not create an unsafe workaround.

          Leave the PR open and explain the permission issue.

          After pushing, verify the new commit appears on PR <n>.

          ----------------------------------------------------------------------
          13. REVIEW THE FINAL COMBINED DIFF
          ----------------------------------------------------------------------

          After any branch update or compatibility commit, re-read:

            gh pr diff <n> --repo "$REPO"

          Treat this FINAL diff as the actual change you are approving.

          Do not rely on the original bot-generated diff.

          Ask yourself:

            "Would I approve this exact final diff if I were carefully reviewing it
            as a human maintainer?"

          If the answer is not confidently yes, leave it open.

          ----------------------------------------------------------------------
          14. CHECK CI FOR THE FINAL HEAD COMMIT
          ----------------------------------------------------------------------

          Determine the FINAL head SHA after every update or push.

          Inspect check runs for that exact SHA.

          Do not rely on successful checks belonging to an older commit.

          If the final head commit has no checks and PR_CHECK_WORKFLOW is non-empty,
          trigger the configured workflow on the PR head branch:

            gh workflow run "$PR_CHECK_WORKFLOW" \
              --repo "$REPO" \
              --ref "<head-branch>"

          Give GitHub enough time to register the run.

          Then query checks again.

          Note that the PR check includes a SonarCloud quality gate, so it can fail on
          code quality rather than on a build error. Read the failing step's log before
          concluding anything about the cause.

          ----------------------------------------------------------------------
          15. WAIT FOR ALL CHECKS TO FINISH
          ----------------------------------------------------------------------

          Poll patiently.

          Builds may take several minutes.

          Never merge while an expected or relevant check is:
            - absent
            - queued
            - waiting
            - pending
            - in progress
            - cancelled
            - timed out
            - failing
            - otherwise unsuccessful

          Every relevant expected check must conclude successfully.

          ----------------------------------------------------------------------
          16. INVESTIGATE CI FAILURES
          ----------------------------------------------------------------------

          If CI fails, inspect the failing workflow/check and logs with `gh`.

          Determine whether the failure is:
            - caused by the dependency upgrade
            - caused by your compatibility changes
            - a SonarCloud quality gate failure
            - unrelated infrastructure failure
            - a flaky test
            - a credential/environment issue
            - an unrelated pre-existing repository failure

          If the failure is caused by the dependency upgrade or your migration AND
          there is a clear, safe, repository-consistent fix:

            1. make the fix on the SAME PR branch
            2. inspect the diff
            3. run appropriate local validation
            4. commit the fix
            5. push normally
            6. determine the NEW final head SHA
            7. review the FINAL combined diff again
            8. wait for CI on the NEW head commit

          Repeat this repair-and-verify cycle only while changes remain clearly scoped,
          understandable, and safe.

          Do not endlessly chase unrelated flaky/infrastructure failures.

          If CI cannot be safely resolved, leave the PR open and explain the blocker.

          ----------------------------------------------------------------------
          17. FINAL SAFETY GATE
          ----------------------------------------------------------------------

          Merge ONLY when ALL of these conditions are true:

            - the PR is still an automated dependency PR as defined in section 1a
            - the PR is still fundamentally dependency maintenance
            - you inspected the final combined diff
            - any compatibility fixes are directly related to the upgrade
            - any compatibility fixes are committed to the SAME PR branch
            - relevant local validation succeeded where practical
            - GitHub checks belong to the FINAL head commit
            - every relevant expected GitHub check concluded successfully
            - the PR is mergeable
            - there are no unresolved conflicts
            - tests were not weakened merely to make the upgrade pass
            - security controls were not bypassed
            - no unrelated changes slipped into the PR
            - you understand the resulting migration
            - you can confidently judge the final result safe

          Green CI does NOT override any other requirement.

          ----------------------------------------------------------------------
          18. MERGE, CONFIRM, COMMENT
          ----------------------------------------------------------------------

          When every safety condition is satisfied, merge with squash:

            gh pr merge <n> --repo "$REPO" --squash

          Do not use admin or bypass flags. Do not bypass repository protections.

          Re-query the PR afterwards and verify GitHub actually reports it as merged.
          Do not assume a successful-looking merge command means the PR is merged.

          Only after confirming the merge may you move to the next PR.

          Leave ONE concise final comment on the PR describing:
            - dependency/version updated
            - whether compatibility fixes were necessary
            - brief description of any fixes
            - validation performed
            - final CI status
            - whether the PR was merged or intentionally left open

          Avoid noisy progress comments. Prefer one useful final comment.

          ======================================================================
          PASS 2 — SONARCLOUD QUALITY GATE
          ======================================================================

          Start this pass only after pass 1 is finished and the working tree is clean.

          The goal of this pass is that the SonarCloud quality gate for this project
          PASSES, achieved only through changes that DO NOT CHANGE BEHAVIOUR.

          ----------------------------------------------------------------------
          19. READ THE CURRENT SONAR STATE
          ----------------------------------------------------------------------

          The coordinates are in the environment:

            echo "$SONAR_HOST"
            echo "$SONAR_PROJECT_KEY"
            echo "$SONAR_ORGANIZATION"

          The project is private on SonarCloud, so every request must authenticate with
          SONAR_TOKEN as the basic-auth username and an empty password.

          If SONAR_TOKEN or SONAR_PROJECT_KEY is empty, SKIP this whole pass and say so
          in the summary.

          Read the quality gate:

            curl -sS -u "$SONAR_TOKEN:" \
              "$SONAR_HOST/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY" | jq .

          If the status is OK (or ERROR only on conditions that no code change can
          influence, such as a coverage-on-new-code condition with no new code), stop
          this pass and report that the gate is already passing.

          If it is ERROR, read the open issues:

            curl -sS -u "$SONAR_TOKEN:" \
              "$SONAR_HOST/api/issues/search?componentKeys=$SONAR_PROJECT_KEY&resolved=false&ps=100" | jq .

          And the security hotspots:

            curl -sS -u "$SONAR_TOKEN:" \
              "$SONAR_HOST/api/hotspots/search?projectKey=$SONAR_PROJECT_KEY&status=TO_REVIEW&ps=100" | jq .

          For each issue record the rule key, severity, type, file, line and message.
          Read the rule's own description when the message alone is not enough:

            curl -sS -u "$SONAR_TOKEN:" "$SONAR_HOST/api/rules/show?key=<rule-key>" | jq .

          Focus on the conditions that actually make the gate fail. Do not attempt to
          empty the whole issue backlog in one run.

          ----------------------------------------------------------------------
          20. FIX ONLY WHAT CAN BE FIXED WITHOUT CHANGING BEHAVIOUR
          ----------------------------------------------------------------------

          Create ONE branch off the default branch for this work:

            git checkout <default-branch>
            git pull
            git checkout -b sonar-fix/<short-topic>

          NEVER commit these fixes to the default branch, and never to somebody else's
          PR branch.

          A fix is in scope only when it is BEHAVIOUR-PRESERVING: the program does the
          same thing, for the same inputs, with the same outputs and side effects,
          before and after your change.

          Typically in scope:
            - naming, modifiers and visibility that no caller depends on
            - removing genuinely dead code, unused imports, unused locals, unused
              private members
            - collapsing redundant conditions and duplicate branches that provably
              evaluate the same way
            - replacing a deprecated API call with its documented equivalent
            - adding `final`, `@Override`, diamond operators, try-with-resources where
              the semantics are identical
            - using the idiom the rule asks for (StringBuilder, isEmpty(), equals on
              boxed types, constants for repeated literals)
            - narrowing a caught or thrown type where control flow cannot change
            - extracting a constant or a small private helper with identical semantics
            - documentation and comment issues

          Explicitly OUT of scope for this pass:
            - anything that changes program output, ordering, timing, thread safety,
              persisted data, log semantics you cannot prove irrelevant, or an API
              other code calls
            - changing error-handling behaviour, including swallowing or newly raising
              exceptions
            - changing defaults, configuration values or environment handling
            - refactors that need a design decision
            - deleting or weakening a test, or lowering a coverage requirement
            - marking an issue False Positive / Won't Fix in SonarCloud, or adding
              blanket `@SuppressWarnings`, `// NOSONAR`, or new exclusions in
              sonar-project properties or pom.xml
            - disabling a rule or editing the quality gate itself

          If the only way to make a condition pass is out of scope, LEAVE IT and
          explain it in the PR body. A partially fixed gate with an honest explanation
          is the correct outcome — a green gate obtained by suppression is not.

          If the failing condition is coverage on new code, you MAY add tests that
          assert the CURRENT documented behaviour. Never change production code to
          make a test easier to write in this pass.

          Make one small commit per coherent group of fixes, each message naming the
          rule it addresses.

          ----------------------------------------------------------------------
          21. PROVE YOU DID NOT CHANGE BEHAVIOUR
          ----------------------------------------------------------------------

          Before pushing:

            mvn -B fmt:format
            mvn -B fmt:check
            mvn -B verify

          All existing tests must pass WITHOUT being modified. If an existing test had
          to change, that is evidence the behaviour changed — revert that fix and leave
          the issue for a human.

          Then re-read your own diff:

            git diff <default-branch>...HEAD

          For every hunk, state to yourself which Sonar issue it addresses and why it
          cannot change behaviour. Drop any hunk that fails that test.

          ----------------------------------------------------------------------
          22. OPEN A PR — DO NOT MERGE IT
          ----------------------------------------------------------------------

          Push the branch and open one PR against the default branch:

            git push -u origin sonar-fix/<short-topic>
            gh pr create --repo "$REPO" --base <default-branch> \
              --title "fix sonarcloud quality gate issues" --body "<body>"

          The body must contain:
            - the quality gate conditions that were failing
            - a table or list of the issues addressed: rule key, file, what changed
            - for each change, one line on why it is behaviour-preserving
            - the issues deliberately NOT fixed, and why
            - the validation you ran and its result

          Because this PR is created with the Actions token, GitHub will not start its
          checks automatically. Start them, if PR_CHECK_WORKFLOW is non-empty:

            gh workflow run "$PR_CHECK_WORKFLOW" --repo "$REPO" --ref "sonar-fix/<short-topic>"

          Wait for that run and report its conclusion, including whether the SonarCloud
          quality gate passed on the branch.

          You MUST NOT merge this PR, and you must not merge it in a later run either —
          section 1a already tells you to skip `sonar-fix/` branches. A human reviews
          source changes you authored.

          If a run is already open from a previous day with the same fixes pending
          review, do not open a second one. Update the existing branch instead, or
          leave it alone and say so.

          ======================================================================
          HARD RULES
          ======================================================================

          These rules override everything else.

          - NEVER merge a human-authored PR.
          - NEVER modify a human-authored PR.
          - NEVER merge a PR whose head branch begins with `sonar-fix/`.
          - NEVER commit directly to the default/base branch.
          - NEVER push directly to the default/base branch.
          - Dependency compatibility fixes go to the existing dependency PR head branch.
          - Sonar fixes go to a fresh `sonar-fix/` branch and into a PR for review.
          - NEVER force-push.
          - NEVER bypass branch protection.
          - NEVER use admin merge privileges to bypass protections.
          - NEVER merge with failing, pending, cancelled or absent checks.
          - NEVER evaluate CI from an old head commit after pushing a new one.
          - NEVER disable CI merely to make something pass.
          - NEVER weaken security checks merely to make something pass.
          - NEVER delete or weaken tests merely to make something pass.
          - NEVER suppress, exclude, or mark-as-won't-fix a Sonar issue to pass the gate.
          - NEVER change behaviour in pass 2.
          - NEVER make unrelated refactors.
          - NEVER add unrelated features.
          - NEVER silently accept an unexplained breaking change.
          - NEVER assume patch/minor means safe.
          - NEVER assume major means impossible; investigate carefully.
          - Prefer leaving work for a human over making speculative changes.
          - Handle at most 10 PRs during this run.

