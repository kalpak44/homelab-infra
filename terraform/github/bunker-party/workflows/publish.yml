# Managed by homelab-infra — terraform/github/bunker-party/workflows/publish.yml
# Edits made here in the target repo are overwritten by `just deploy github bunker-party`.
#
# One pipeline for every trigger: format, build, test, coverage, SonarCloud. The GHCR
# publish and the cluster deploy are the only conditional parts — they run when the ref
# being built is main and never on a pull request, so a dependency bump is fully
# validated without pushing an image.
#
# This is also the workflow the AI PR agent gates on (PR_CHECK_WORKFLOW=publish.yml). It
# refuses to merge without a green check here, and it can dispatch this workflow on a PR
# branch whose head commit has no checks — hence workflow_dispatch.
#
# Renaming this file means renaming it in homelab-infra too, in three places: the `apps`
# list in gitops/Justfile, which finds the last successful run here to read a tag from,
# the PR_CHECK_WORKFLOW variable in terraform/github/bunker-party/main.tf, and the
# `publish_workflow` local in that same file, which is what pushes this copy. It was
# `build.yml` until 2026-09-08; `build` named the least of what it does — it also
# publishes the image and rolls the cluster — and a file called build.yml that deploys to
# production reads as safe when it is not.
#
# The action versions here are bumped by hand, in this file. `github-actions` is absent
# from dependabot.yml because a bump merged into a generated workflow is reverted by the
# next `just deploy github bunker-party`, and Dependabot cannot watch the copy in
# homelab-infra either — it only scans `.github/workflows/`. checkout and setup-java were
# left on v4 long enough to start warning that they run on a deprecated Node.js 20.
name: Build, Publish, Deploy

on:
  pull_request:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

# Superseding a pull request's run is free. Superseding a push to main is not: that run
# ends in a cluster deployment, and cancelling it halfway leaves the image published but
# the manifest still pointing at the previous tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; the job that needs to write a package widens it itself.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # push the image to ghcr.io

    env:
      # Job-level so the `if:` conditions below can test them. Secrets are not exposed
      # to pull_request runs from a fork, so on those the analysis step skips itself
      # rather than failing the check.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    outputs:
      tag: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout source
        # Full history: Sonar needs it for blame and new-code detection.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check formatting
        run: mvn -B fmt:check

      - name: Build, test, coverage
        run: mvn -B verify

      - name: SonarCloud analysis
        # qualitygate.wait makes the gate an actual gate: a failing gate fails this
        # check, so a PR cannot be merged past it.
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=kalpak44 \
            -Dsonar.projectKey=bunker-party \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

      - name: Log in to GHCR
        if: ${{ env.PUBLISH == 'true' }}
        # Pinned to the commit behind v4.6.0 — a tag can be moved, a SHA cannot.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Exactly seven characters, no prefix: homelab-infra's `just bump-images` rewrites
      # the manifest to "${sha:0:7}", so any other shape points the cluster at a tag that
      # does not exist and the Deployment lands in ImagePullBackOff.
      #
      # `${GITHUB_SHA:0:7}` and not `git rev-parse --short=7 HEAD`, which was here before:
      # `--short=N` is a MINIMUM, not a width. Git expands the abbreviation until it is
      # unique in the repository, so it returns eight characters once the object count
      # makes seven ambiguous — measured in this repo on 2026-09-08, `--short=1` returned
      # four. The tag would then be eight characters while the manifest still gets seven.
      # A slice of GITHUB_SHA cannot drift, because it never consults the object store.
      - name: Derive the image tag
        if: ${{ env.PUBLISH == 'true' }}
        id: vars
        run: echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build & push image to GHCR
        if: ${{ env.PUBLISH == 'true' }}
        # Contexts go through env, never interpolated into the script body.
        # The 7-char short SHA is the tag homelab-infra's `just bump-images` looks for
        # when it points the cluster at a newly published image.
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          mvn -B package jib:build \
            -Djib.to.image="$GHCR_IMAGE" \
            -Djib.to.tags="latest,$IMAGE_TAG"

  scan:
    name: Scan image
    # REPORT-ONLY, and must stay that way: no --fail-on, no threshold. Sonar above is the
    # blocking gate. A threshold here would deadlock on unfixable base-image CVEs.
    needs: build
    # Only a published image can be pulled, so a PR has nothing to scan.
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # Pinned: an unpinned scanner changes the report without the image changing.
      SYFT_VERSION: v1.51.1
      GRYPE_VERSION: v0.118.0
    steps:
      # The package is private; syft and grype read the config this writes.
      - name: Log in to GHCR
        # Pinned to a commit SHA, not a tag: a tag can be moved onto different code.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Installers are fetched from the release tag, not `main`, and their checksums are
      # verified before anything executes. Piping a moving script straight into a shell
      # gives an upstream compromise a direct path onto the runner. Bump the two SHA256
      # values whenever SYFT_VERSION or GRYPE_VERSION moves.
      - name: Install syft and grype
        env:
          SYFT_INSTALLER_SHA256: ea054f8b6754db17d34129482ecda1ab733cadab57c1c9202bbe98eb5fe18d24
          GRYPE_INSTALLER_SHA256: 8646f06a90b10ca64992c1809b4aa00c44e30b4f551f63c309b0b0ab66873556
        run: |
          set -euo pipefail

          fetch_verified() {
            url="$1"; want="$2"; out="$3"
            curl --proto '=https' --tlsv1.2 -fsSL "$url" -o "$out"
            echo "${want}  ${out}" | sha256sum -c -
          }

          fetch_verified \
            "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            "$SYFT_INSTALLER_SHA256" syft-install.sh
          fetch_verified \
            "https://raw.githubusercontent.com/anchore/grype/${GRYPE_VERSION}/install.sh" \
            "$GRYPE_INSTALLER_SHA256" grype-install.sh

          sh syft-install.sh -b /usr/local/bin "${SYFT_VERSION}"
          sh grype-install.sh -b /usr/local/bin "${GRYPE_VERSION}"

          syft version
          grype version

      # grype scans the SBOM, not the image again, so the report and the SBOM cannot
      # disagree. --platform is explicit so the result does not depend on the runner.
      - name: Generate the SBOM and scan it
        id: scan
        run: |
          set -euo pipefail

          # jib publishes without emitting a digest, so resolve it from the registry.
          # Still scanned by digest, never by tag: `latest` moves in this same run.
          digest=$(docker buildx imagetools inspect \
            "${IMAGE}:${{ needs.build.outputs.tag }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [ -z "$digest" ]; then
            echo "::error::could not resolve the digest for ${IMAGE}:${{ needs.build.outputs.tag }}"
            exit 1
          fi
          ref="${IMAGE}@${digest}"
          echo "Scanning ${ref} (linux/amd64)"

          syft --platform linux/amd64 "registry:${ref}" -o json > sbom.json
          syft --platform linux/amd64 "registry:${ref}" -o spdx-json > sbom.spdx.json

          grype "sbom:sbom.json" -o json > grype.json
          grype "sbom:sbom.json" -o table > grype.txt

          echo "packages=$(jq '.artifacts | length' sbom.json)" >> "$GITHUB_OUTPUT"

      # All counts come from one pass over grype.json, so the totals cannot disagree.
      - name: Report to the run summary
        if: always()
        run: |
          set -euo pipefail

          if [ ! -f grype.json ]; then
            echo "### Image scan — did not run" >> "$GITHUB_STEP_SUMMARY"
            echo "syft or grype failed before producing a report; see the step log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          jq '[.matches[]
               | {id:       .vulnerability.id,
                  severity: .vulnerability.severity,
                  package:  .artifact.name,
                  version:  .artifact.version,
                  type:     .artifact.type,
                  state:    (.vulnerability.fix.state // "unknown"),
                  fixed_in: (.vulnerability.fix.versions // [])}]
              | unique_by([.id, .package, .version])' grype.json > findings.json

          count() { jq --arg s "$1" '[.[] | select(.severity == $s)] | length' findings.json; }
          crit=$(count Critical); high=$(count High); med=$(count Medium)
          low=$(count Low); neg=$(count Negligible); unk=$(count Unknown)
          total=$(jq 'length' findings.json)
          fixable=$(jq '[.[] | select(.state == "fixed" and (.fixed_in | length) > 0)] | length' findings.json)

          {
            echo "### Image scan — report only 🔍"
            echo
            echo "\`${IMAGE}:${{ needs.build.outputs.tag }}\` · \`linux/amd64\` ·"
            echo "${{ steps.scan.outputs.packages }} packages · syft \`${SYFT_VERSION}\` · grype \`${GRYPE_VERSION}\`"
            echo
            echo "| Critical | High | Medium | Low | Negligible | Unknown | Total |"
            echo "| ---: | ---: | ---: | ---: | ---: | ---: | ---: |"
            echo "| ${crit} | ${high} | ${med} | ${low} | ${neg} | ${unk} | ${total} |"
            echo
            echo "${fixable} of ${total} have a fixed version published upstream. This job never"
            echo "blocks the rollout — it is a report."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Critical and High only: a table of hundreds of Low findings goes unread.
          if [ "$((crit + high))" -gt 0 ]; then
            {
              echo "#### Critical and High"
              echo
              echo "| Severity | Package | Version | Vulnerability | Fix |"
              echo "| :--- | :--- | :--- | :--- | :--- |"
              jq -r '[.[] | select(.severity == "Critical" or .severity == "High")]
                     | sort_by(.severity, .package, .id)[]
                     | "| \(.severity) | \(.package) | \(.version) | \(.id) | "
                       + (if .state == "fixed" and (.fixed_in | length) > 0
                          then (.fixed_in | join(", "))
                          else "_none upstream_" end)
                       + " |"' findings.json
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Critical or High findings." >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi

      # The summary is capped at 1 MB and unparseable; triage needs the files.
      - name: Upload the SBOM and scan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-scan-${{ needs.build.outputs.tag }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            sbom.json
            sbom.spdx.json
            grype.json
            grype.txt

  deploy:
    name: Deploy to cluster
    # `scan` is listed for ordering only — a scanner outage must not strand an image
    # that published cleanly.
    needs: [build, scan]
    # `tag` is set by a step that only runs when PUBLISH is true, so an empty tag means
    # no image was pushed. Keying the deploy off the artifact rather than repeating the
    # event/ref test means the two conditions cannot drift apart.
    if: always() && needs.build.result == 'success' && needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The image is in GHCR — point the cluster at it. Both inputs are required: this
      # workflow's own run is still in_progress here, so homelab-infra's "last successful
      # publish" query would resolve to the previous commit and deploy a stale image.
      #
      # `app` is the gitops directory name, which is not this repo's name — it is
      # bunker-game-app. It must match the `apps` list in homelab-infra's gitops/Justfile,
      # or the dispatch fails with "no app named ... is tracked".
      #
      # A PAT, not GITHUB_TOKEN: the job's own token is scoped to this repository and
      # cannot dispatch a workflow in another one.
      - name: Trigger cluster deploy
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh workflow run gitops-bump-images.yml \
            --repo kalpak44/homelab-infra \
            -f app=bunker-game-app \
            -f sha="${GITHUB_SHA}"
          echo "Dispatched \`gitops-bump-images\` for \`bunker-game-app\` @ \`${TAG}\`." >> "$GITHUB_STEP_SUMMARY"
