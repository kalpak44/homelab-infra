# Managed by homelab-infra — terraform/github/bunker-party/dependabot.yml
# Edits made here in the target repo are overwritten by `just deploy github bunker-party`.
#
# Opens the dependency PRs that ai-pr-agent.yml then reviews, repairs and merges. The
# agent sweeps daily at 06:00 UTC, so this runs at 05:00 to give it something to find on
# the same morning.
#
# This replaced self-hosted Renovate, which had been silently dead: measured on the run
# of 2026-09-08, it extracted ten pending updates (jib, jacoco, junit, mockito, logback,
# gson, and the compiler, enforcer and sonar plugins) and failed to push every single
# branch with `Permission to kalpak44/bunker-party.git denied to kalpak44` — a 403 on a
# RENOVATE_TOKEN that had expired. It reported the job as successful each night and had
# opened no PR since February. Dependabot needs no token at all, which is why the
# credential is gone rather than reissued.
#
# One entry per manifest actually in the tree — a `directory` that holds no manifest is
# not an error Dependabot reports anywhere; it just silently never opens a PR. Here that
# is `/` and pom.xml alone: the image is built by jib-maven-plugin straight from the pom,
# so there is no Dockerfile for a `docker` entry to watch.
#
# `github-actions` is deliberately absent. Every workflow this repo has is generated by
# homelab-infra (terraform/github/bunker-party/workflows/), so an action bump merged here
# is reverted by the next `just deploy github bunker-party` and then re-opened by
# Dependabot on the following run. Action versions in those files are bumped in
# homelab-infra instead. Dependabot cannot watch them there either: it only scans
# `.github/workflows/`, and in homelab-infra these are ordinary files under `terraform/`.
version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    # The agent has no per-run limit of its own, so this is sized to not withhold
    # proposals. It throttles how many sit open at once, not how many exist.
    open-pull-requests-limit: 10
    # Dependabot proposes only DIRECT dependencies unless told otherwise. Maven's
    # transitive tree is where the convergence problems live, and the pom's enforcer runs
    # a dependency-convergence rule that fails the build on exactly those, so proposing
    # indirect updates is worth the noise.
    allow:
      - dependency-type: all
    # Minor and patch bumps arrive as one PR. Majors are deliberately NOT in this group:
    # they arrive as one PR each, which is what makes a break attributable to a single
    # package. They are still proposed — do not add `major` here to "enable majors";
    # that only batches them.
    groups:
      maven-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
