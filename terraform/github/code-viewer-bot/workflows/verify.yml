# Managed by homelab-infra — terraform/github/code-viewer-bot/workflows/verify.yml
# Edits made here in the target repo are overwritten by `just deploy github code-viewer-bot`.
#
# The action versions here are bumped by hand. Dependabot cannot watch this file: it only
# scans `.github/workflows/`, and in homelab-infra this is an ordinary file under
# `terraform/`, so `github-actions` is deliberately absent from dependabot.yml.
#
# This is the repo's PR check (PR_CHECK_WORKFLOW). publish-marketplace.yml cannot be one:
# it is workflow_dispatch only and takes a human-chosen version, so there is nothing the
# agent could start on a pull request branch.
name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The agent starts this for a pull request whose head commit has no checks — a branch
  # opened before the check existed never gets one retroactively.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, test and scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Job-level so the `if:` below can test them; a fork PR gets no secrets and skips.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout repository
        # Full history: Sonar needs it for blame and new-code detection.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # --ignore-scripts skips robotjs's node-gyp build, which needs X11 headers and does
      # not build on Node 24. Nothing verified here loads the native module: the gates
      # cover the modules that require neither `vscode` nor `robotjs`.
      - name: Install from lockfile
        run: npm ci --ignore-scripts

      # Blocking: the agent merges with no human review, so nothing else catches drift.
      # It clears these itself with `npm run format` and `npm run lint:fix`.
      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      # The per-path coverage floors live in jest.config.js, so no step here can drop
      # them. Writes coverage/lcov.info, which Sonar uploads — must run before Sonar.
      - name: Run tests with coverage
        run: npm test

      # qualitygate.wait is what makes this block a merge. A missing project key skips
      # rather than fails, so check the step ran. SONAR_TOKEN must be in the Dependabot
      # store too, or it skips on exactly the PRs the gate exists for.
      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src
            -Dsonar.tests=test
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
