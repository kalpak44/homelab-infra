# Managed by homelab-infra — terraform/github/code-viewer-bot/workflows/release.yml
# Edits made here in the target repo are overwritten by `just deploy github code-viewer-bot`.
#
# The action versions here are bumped by hand. Dependabot cannot watch this file: it only
# scans `.github/workflows/`, and in homelab-infra this is an ordinary file under
# `terraform/`, so `github-actions` is deliberately absent from dependabot.yml.
#
# One of the repo's two workflows, and its PR check (PR_CHECK_WORKFLOW). It verifies on
# every pull request and every push to main, and builds, releases and publishes only for a
# `v*` tag. The agent cuts that tag once per sweep, so a batch of ten merges produces one
# release rather than ten. Keying the release on the tag is also what keeps the version
# commit from starting another release: it lands on main, and main does not release.
name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  # The agent starts this for a pull request whose head commit has no checks — a branch
  # opened before the check existed never gets one retroactively.
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, test and scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Job-level so the `if:` below can test them; a fork PR gets no secrets and skips.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout repository
        # Full history: Sonar needs it for blame and new-code detection.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      # --ignore-scripts skips robotjs's node-gyp build, which needs X11 headers and does
      # not build on Node 24. Nothing verified here loads the native module.
      - name: Install from lockfile
        run: npm ci --ignore-scripts

      # Blocking: the agent merges with no human review, so nothing else catches drift.
      # It clears these itself with `npm run format` and `npm run lint:fix`.
      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      # The per-path coverage floors live in jest.config.js, so no step here can drop
      # them. Writes coverage/lcov.info, which Sonar uploads — must run before Sonar.
      - name: Run tests with coverage
        run: npm test

      - name: Build extension bundle
        run: npm run build

      # qualitygate.wait is what makes this block a merge. A missing project key skips
      # rather than fails, so check the step ran. SONAR_TOKEN must be in the Dependabot
      # store too, or it skips on exactly the PRs the gate exists for.
      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src
            -Dsonar.tests=test
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            asset_name: code-viewer-bot-linux-x64.vsix
          - os: macos-latest
            target: darwin-arm64
            asset_name: code-viewer-bot-darwin-arm64.vsix
          - os: macos-15-intel
            target: darwin-x64
            asset_name: code-viewer-bot-darwin-x64.vsix
          - os: windows-latest
            target: win32-x64
            asset_name: code-viewer-bot-win32-x64.vsix

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install @vscode/vsce
        run: npm install -g @vscode/vsce

      # robotjs builds from source here, unlike in verify: the packaged VSIX ships the
      # native binding, so the headers have to be present on Linux.
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libx11-dev libxi-dev libxtst-dev libpng++-dev pkg-config

      - name: Install dependencies
        run: npm ci
        env:
          SKIP_ROBOTJS_REBUILD: "1"

      - name: Build extension bundle
        run: npm run build

      - name: Rebuild robotjs
        run: npm rebuild robotjs || true

      - name: Package VSIX
        run: vsce package --target ${{ matrix.target }} --out ${{ matrix.asset_name }}

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # The tag is the source of the version, not package.json: they are written in the
      # same commit, and reading the tag means a mismatch cannot ship silently.
      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r .version package.json)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v${tag} does not match package.json ${pkg}"
            exit 1
          fi

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: code-viewer-bot-*.vsix
          path: dist
          merge-multiple: true

      # A partial platform set is worse than no release: the Marketplace would serve some
      # platforms the new version and leave the rest on the old one.
      - name: Verify the full platform set is present
        run: |
          set -euo pipefail
          missing=0
          for target in linux-x64 darwin-arm64 darwin-x64 win32-x64; do
            if [ ! -f "dist/code-viewer-bot-${target}.vsix" ]; then
              echo "::error::missing artifact for ${target}"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: code-viewer-bot ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.vsix

  marketplace:
    name: Publish to the VS Code Marketplace
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install @vscode/vsce
        run: npm install -g @vscode/vsce

      - name: Download VSIX artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: code-viewer-bot-*.vsix
          path: dist
          merge-multiple: true

      # --skip-duplicate so re-running a release that already published one platform does
      # not fail the whole job on that platform.
      - name: Publish every platform VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          for file in dist/code-viewer-bot-*.vsix; do
            echo "Publishing ${file}"
            vsce publish --packagePath "$file" --skip-duplicate
          done
