# Managed by homelab-infra — terraform/github/noco-google-connector-web-page/workflows/publish.yml
# Edits made here in the target repo are overwritten by `just deploy github noco-google-connector-web-page`.
#
# The action versions here are bumped by hand. Dependabot cannot watch this file: it only
# scans `.github/workflows/`, and the copy it would bump is overwritten on the next apply.
#
# The actions are pinned to commit SHAs, not tags, so a retagged release cannot change
# this build under us (CWE-829).
name: Build, Publish, Deploy

# This is also the workflow the AI maintenance agent gates on (PR_CHECK_WORKFLOW), and it
# dispatches it for a pull request whose head commit has no checks, so `workflow_dispatch`
# is load-bearing.
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/publish.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch: {}

permissions:
  contents: read

# One deployment at a time, and never cancel one halfway: a killed deployment leaves the
# site serving a half-uploaded artifact.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      # Malformed markup fails here, so a broken privacy policy or terms page never
      # reaches the URL Google's OAuth verification points at.
      - name: Validate HTML
        working-directory: site
        run: npx --yes html-validate@11.23.0 "public/*.html"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # The agent dispatches this workflow on pull request branches too, and the
    # github-pages environment only accepts deployments from main.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
