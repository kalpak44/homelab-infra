# Managed by homelab-infra — terraform/github/noco-google-connector-web-page/workflows/publish.yml
# Edits made here in the target repo are overwritten by `just deploy github noco-google-connector-web-page`.
#
# The action versions here are bumped by hand. Dependabot cannot watch this file: it only
# scans `.github/workflows/`, and in homelab-infra this is an ordinary file under
# `terraform/`, so `github-actions` is deliberately absent from dependabot.yml.
#
# The `site/**` path filter is not the repository name in another spelling: the website
# lives in that subdirectory, and a push outside it builds nothing.
#
# The four actions below are pinned to commit SHAs, not tags, so a retagged release
# cannot change this build under us (CWE-829). That pin used to be maintained by the
# `github-actions` Dependabot entry; now that this file is generated here, the SHAs are
# bumped by hand in homelab-infra — see the note in dependabot.yml.
name: Build, Publish, Deploy

# This is also the workflow the AI maintenance agent gates on
# (PR_CHECK_WORKFLOW=publish.yml). It refuses to merge without a green check, and it
# dispatches this workflow for a PR whose head commit has no checks — so
# `workflow_dispatch` is load-bearing.
#
# The `pull_request` trigger is what makes that gate real. Before it, PR_CHECK_WORKFLOW
# named `build.yml`, a file this repo has never had, and nothing here ran on a pull
# request at all — so a dependency PR never got a check and the agent could not merge it.
# Every Dependabot PR between 2026-08-20 and 2026-09-08 was closed rather than merged.
# The paths match the push trigger because the only manifest Dependabot watches here is
# site/Dockerfile, which is under site/**.
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/publish.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  # Pinned: an unpinned scanner changes the report without the image changing.
  SYFT_VERSION: v1.52.0
  GRYPE_VERSION: v0.119.0
  IMAGE: ghcr.io/${{ github.repository_owner }}/noco-google-connector-web-page

jobs:
  docker:
    name: Publish site image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      short-sha: ${{ steps.sha.outputs.short }}
      digest:    ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # `push` is false on a pull request, so the image is still built — which is the
      # actual check, a broken Dockerfile fails here — but nothing reaches the registry
      # from an unmerged branch.
      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: site
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:latest
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Image report
        run: |
          {
            echo "## Site image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Image** | \`${{ env.IMAGE }}\` |"
            echo "| **Tag** | \`${{ steps.sha.outputs.short }}\` |"
            echo "| **Also tagged** | \`latest\` |"
            echo "| **Digest** | \`${{ steps.push.outputs.digest }}\` |"
            echo "| **Commit** | [\`${{ steps.sha.outputs.short }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |"
            echo "| **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "### Pull"
            echo '```'
            echo "docker pull ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}"
            echo '```'
            echo ""
            echo "### Run locally"
            echo '```'
            echo "docker run --rm -p 8080:80 ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Scan image
    # REPORT-ONLY, and must stay that way: no --fail-on, no threshold. Sonar above is the
    # blocking gate. A threshold here would deadlock on unfixable base-image CVEs.
    needs: docker
    # Only a published image can be pulled, so a PR has nothing to scan.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      # The package is private; syft and grype read the config this writes.
      - name: Log in to GHCR
        # Pinned to a commit SHA, not a tag: a tag can be moved onto different code.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Installers are fetched from the release tag, not `main`, and their checksums are
      # verified before anything executes. Piping a moving script straight into a shell
      # gives an upstream compromise a direct path onto the runner. The version and both
      # checksums are rewritten together by the weekly sweep that moves these pins.
      - name: Install syft and grype
        env:
          SYFT_INSTALLER_SHA256: ea054f8b6754db17d34129482ecda1ab733cadab57c1c9202bbe98eb5fe18d24
          GRYPE_INSTALLER_SHA256: 8646f06a90b10ca64992c1809b4aa00c44e30b4f551f63c309b0b0ab66873556
        run: |
          set -euo pipefail

          fetch_verified() {
            url="$1"; want="$2"; out="$3"
            curl --proto '=https' --tlsv1.2 -fsSL "$url" -o "$out"
            echo "${want}  ${out}" | sha256sum -c -
          }

          fetch_verified \
            "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            "$SYFT_INSTALLER_SHA256" syft-install.sh
          fetch_verified \
            "https://raw.githubusercontent.com/anchore/grype/${GRYPE_VERSION}/install.sh" \
            "$GRYPE_INSTALLER_SHA256" grype-install.sh

          sh syft-install.sh -b /usr/local/bin "${SYFT_VERSION}"
          sh grype-install.sh -b /usr/local/bin "${GRYPE_VERSION}"

          syft version
          grype version

      # grype scans the SBOM, not the image again, so the report and the SBOM cannot
      # disagree. --platform is explicit so the result does not depend on the runner.
      - name: Generate the SBOM and scan it
        id: scan
        run: |
          set -euo pipefail

          ref="${IMAGE}@${{ needs.docker.outputs.digest }}"
          echo "Scanning ${ref} (linux/amd64)"

          syft --platform linux/amd64 "registry:${ref}" -o json > sbom.json
          syft --platform linux/amd64 "registry:${ref}" -o spdx-json > sbom.spdx.json

          grype "sbom:sbom.json" -o json > grype.json
          grype "sbom:sbom.json" -o table > grype.txt

          echo "packages=$(jq '.artifacts | length' sbom.json)" >> "$GITHUB_OUTPUT"

      # All counts come from one pass over grype.json, so the totals cannot disagree.
      - name: Report to the run summary
        if: always()
        run: |
          set -euo pipefail

          if [ ! -f grype.json ]; then
            echo "### Image scan — did not run" >> "$GITHUB_STEP_SUMMARY"
            echo "syft or grype failed before producing a report; see the step log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          jq '[.matches[]
               | {id:       .vulnerability.id,
                  severity: .vulnerability.severity,
                  package:  .artifact.name,
                  version:  .artifact.version,
                  type:     .artifact.type,
                  state:    (.vulnerability.fix.state // "unknown"),
                  fixed_in: (.vulnerability.fix.versions // [])}]
              | unique_by([.id, .package, .version])' grype.json > findings.json

          count() { jq --arg s "$1" '[.[] | select(.severity == $s)] | length' findings.json; }
          crit=$(count Critical); high=$(count High); med=$(count Medium)
          low=$(count Low); neg=$(count Negligible); unk=$(count Unknown)
          total=$(jq 'length' findings.json)
          fixable=$(jq '[.[] | select(.state == "fixed" and (.fixed_in | length) > 0)] | length' findings.json)

          {
            echo "### Image scan — report only 🔍"
            echo
            echo "\`${IMAGE}:${{ needs.docker.outputs.short-sha }}\` · \`linux/amd64\` ·"
            echo "${{ steps.scan.outputs.packages }} packages · syft \`${SYFT_VERSION}\` · grype \`${GRYPE_VERSION}\`"
            echo
            echo "| Critical | High | Medium | Low | Negligible | Unknown | Total |"
            echo "| ---: | ---: | ---: | ---: | ---: | ---: | ---: |"
            echo "| ${crit} | ${high} | ${med} | ${low} | ${neg} | ${unk} | ${total} |"
            echo
            echo "${fixable} of ${total} have a fixed version published upstream. This job never"
            echo "blocks the rollout — it is a report."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Critical and High only: a table of hundreds of Low findings goes unread.
          if [ "$((crit + high))" -gt 0 ]; then
            {
              echo "#### Critical and High"
              echo
              echo "| Severity | Package | Version | Vulnerability | Fix |"
              echo "| :--- | :--- | :--- | :--- | :--- |"
              jq -r '[.[] | select(.severity == "Critical" or .severity == "High")]
                     | sort_by(.severity, .package, .id)[]
                     | "| \(.severity) | \(.package) | \(.version) | \(.id) | "
                       + (if .state == "fixed" and (.fixed_in | length) > 0
                          then (.fixed_in | join(", "))
                          else "_none upstream_" end)
                       + " |"' findings.json
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Critical or High findings." >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi

      # The summary is capped at 1 MB and unparseable; triage needs the files.
      - name: Upload the SBOM and scan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-scan-${{ needs.docker.outputs.short-sha }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            sbom.json
            sbom.spdx.json
            grype.json
            grype.txt

  deploy:
    name: Deploy to cluster
    # Gated on the image existing. `docker` runs on a push to main touching site/** and on
    # dispatch; both produce a real image at GITHUB_SHA, so both are worth deploying — the
    # sha is passed explicitly rather than looked up, which is what makes dispatch work.
    needs: [docker, scan]
    if: always() && needs.docker.result == 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `app` names the deployment directory the cluster repo keys off. It matches this
      # repo and the image by convention, not by derivation — the deploy looks the name
      # up and fails with "no app named ... is tracked" if one of the three is renamed
      # without the others.
      - name: Trigger cluster deploy
        env:
          # A PAT, not GITHUB_TOKEN: the job's own token is scoped to this repo and
          # cannot dispatch a workflow in another one.
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          TAG: ${{ needs.docker.outputs.short-sha }}
        run: |
          gh workflow run gitops-bump-images.yml \
            --repo kalpak44/homelab-infra \
            -f app=noco-google-connector-web-page \
            -f sha="${GITHUB_SHA}"
          echo "Dispatched \`gitops-bump-images\` for \`noco-google-connector-web-page\` @ \`${TAG}\`." >> "$GITHUB_STEP_SUMMARY"
