# Managed by homelab-infra — terraform/github/proklinator-app/dependabot.yml
# Edits made here in the target repo are overwritten by `just deploy github proklinator-app`.
#
# Opens the dependency PRs that ai-pr-agent.yml then reviews, repairs and merges. Daily
# at 05:00 UTC, an hour before that agent's daily sweep, so a proposal never waits more
# than an hour to be picked up. Until this file existed the repo had no dependency updater
# at all, so the sweep ran every morning over an empty queue.
#
# Daily rather than weekly is a deliberate trade: majors and fresh advisories arrive
# within a day instead of up to seven, at the cost of a build on any morning something
# moved. The minor/patch grouping below is what keeps that from being one PR per package.
#
# One entry per manifest actually in the tree — a `directory` that holds no manifest is
# not an error Dependabot reports anywhere; it just silently never opens a PR:
#
#   / package.json + package-lock.json, the site
#   /backend package.json + package-lock.json, the API
#   /docker Dockerfile + Dockerfile.api
#
# `github-actions` is deliberately absent. Every workflow this repo has is generated by
# homelab-infra (terraform/github/proklinator-app/workflows/), so an action bump merged
# here is reverted by the next `just deploy github proklinator-app` and then re-opened by
# Dependabot on the following run. Action versions in those files are bumped in
# homelab-infra instead. Dependabot cannot watch them there either: it only scans
# `.github/workflows/`, and in homelab-infra they are ordinary files under `terraform/`.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Etc/UTC
    # The agent has no per-run limit of its own, so this is sized to not withhold
    # proposals. It throttles how many sit open at once, not how many exist.
    open-pull-requests-limit: 10
    # Dependabot proposes only DIRECT dependencies unless told otherwise; a transitive
    # package would otherwise move only when an advisory forced it. `all` includes
    # indirect ones, which for npm are lockfile-only changes and fold into the group
    # below rather than arriving as separate PRs.
    allow:
      - dependency-type: all
    # Minor and patch bumps arrive as one PR, so the lockfile is resolved at once. Majors
    # are deliberately NOT in this group: they arrive as one PR each, which is what makes
    # a break attributable to a single package. They are still proposed — do not add
    # `major` here to "enable majors"; that only batches them.
    groups:
      site-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Separate from the site: the two package.json files are unrelated trees with their own
  # lockfiles, and publish.yml builds them into two different images. Grouping them
  # together would put an API bump and a site bump in one PR, so a failure could not be
  # attributed to either image.
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: daily
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    allow:
      - dependency-type: all
    groups:
      api-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: daily
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    ignore:
      # Node 24 is the LTS the whole repo is pinned to, in six places: both Dockerfiles
      # build on `node:24-slim`, publish.yml's verify job runs `node-version: '24'`, and
      # all three agents (ai-pr-agent, ai-pr-review, ai-issue-agent) set up the same major
      # so they validate on what actually ships. Dependabot treats the tag as the version
      # and will propose 26; on kalpak44 it did, and the agent merged it, which left the
      # bundle built on a runtime CI never exercised. Held here — the pin moves by hand,
      # in all six.
      - dependency-name: node
      # nginx is deliberately NOT held. It only serves the built bundle, its tag floats on
      # minor and patch, and a stale patch there is an unpatched web server rather than a
      # build-time tool. Note it appears only in docker/Dockerfile; Dockerfile.api pins
      # nothing but node, so the docker entry's real coverage is the nginx tag either way.
