# Managed by homelab-infra — terraform/github/mite-assistant-mcp/dependabot.yml
# Edits made here in the target repo are overwritten by `just deploy github mite-assistant-mcp`.
#
# Opens the PRs ai-pr-agent.yml reviews and merges, at 05:00 Europe/Sofia. The zone is
# named so the hour does not slide over EET/EEST.
#
# One entry per manifest in the tree: a `directory` with no manifest silently never opens
# a PR rather than erroring.
#
# `github-actions` is absent on purpose: the workflows here are generated, so a bump
# merged into one is reverted the next time they are synced.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Sofia
    # Throttles how many sit open at once, not how many exist.
    open-pull-requests-limit: 10
    # Without this, a transitive package moves only when an advisory forces it.
    allow:
      - dependency-type: all
    # Majors are deliberately outside this group so each arrives as its own PR and a
    # break stays attributable. Do not add `major` here — that only batches them.
    # It matters most for eslint, prettier and jest: they are the quality gate.
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Sofia
    open-pull-requests-limit: 10
    ignore:
      # The Node major is pinned in the Dockerfile, publish.yml and package.json engines.
      # Dependabot bumps only the tag, shipping an image built on a major the check never
      # validates — it proposed 26 in PR #14 on 2026-09-08.
      #
      # Not "never upgrade": Node 20 sat EOL for four months behind a green pipeline.
      # Review this whenever the image scan reports fixable findings against `node`.
      - dependency-name: node
