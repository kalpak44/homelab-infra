# Managed by homelab-infra — terraform/github/mite-assistant-mcp/dependabot.yml
# Edits made here in the target repo are overwritten by `just deploy github mite-assistant-mcp`.
#
# Opens the dependency PRs that ai-pr-agent.yml then reviews, repairs and merges. Daily at
# 05:00 Europe/Sofia, the working day the maintainer keeps. The zone is named rather than
# offset so the hour does not slide by one over EET/EEST — Dependabot handles the
# transition, GitHub's `schedule:` cron cannot, which is why the agent that picks these up
# runs at a fixed 04:00 UTC and is late rather than early in both halves of the year.
#
# One entry per manifest actually in the tree — a `directory` that holds no manifest is
# not an error Dependabot reports anywhere; it just silently never opens a PR:
#
#   / package.json + package-lock.json
#   / Dockerfile
#
# `github-actions` is deliberately absent. Every workflow this repo has is generated by
# homelab-infra (terraform/github/mite-assistant-mcp/workflows/), so an action bump merged
# here is reverted by the next `just deploy github mite-assistant-mcp` and then re-opened
# by Dependabot on the following run. Action versions in those files are bumped in
# homelab-infra instead. Dependabot cannot watch them there either: it only scans
# `.github/workflows/`, and in homelab-infra they are ordinary files under `terraform/`.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Sofia
    # The agent has no per-run limit of its own, so this is sized to not withhold
    # proposals. It throttles how many sit open at once, not how many exist.
    open-pull-requests-limit: 10
    # Dependabot proposes only DIRECT dependencies unless told otherwise; a transitive
    # package would otherwise move only when an advisory forced it. For npm the indirect
    # ones are lockfile-only changes and fold into the group below.
    allow:
      - dependency-type: all
    # Minor and patch bumps arrive as one PR, so the lockfile is resolved at once. Majors
    # are deliberately NOT in this group: they arrive as one PR each, which is what makes
    # a break attributable to a single package. They are still proposed — do not add
    # `major` here to "enable majors"; that only batches them.
    #
    # eslint, prettier and jest are in scope here as devDependencies, and they are the
    # repo's quality gate: an eslint major that adds a rule, a prettier major that changes
    # a default, or a jest major that changes coverage accounting breaks publish.yml's
    # `lint`, `format:check` or `test` on its own PR rather than on someone else's. That
    # is the point of keeping them out of the grouped PR — and ai-pr-agent.yml's section
    # 7B is what makes the agent repair the fallout instead of parking the PR.
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Sofia
    open-pull-requests-limit: 10
    ignore:
      # Node 20 is pinned in three places at once: the Dockerfile's `node:20-bookworm-slim`,
      # publish.yml's `node-version: "20"`, and package.json's `engines: ">=20.0.0"`.
      # Dependabot treats the whole tag as the version and proposed a jump to 26 within
      # minutes of this file landing (PR #14 on 2026-09-08). Merging that ships an image
      # built on Node 26 while the check still validates on 20, so the runtime that
      # actually runs is never exercised — the same thing that happened on kalpak44, where
      # the agent merged it. `engines` would not catch it either: `>=20.0.0` admits 26.
      # Held here; the pin moves by hand, in all three places together.
      - dependency-name: node
