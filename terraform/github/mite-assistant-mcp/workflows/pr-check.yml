# Managed by homelab-infra — terraform/github/mite-assistant-mcp/workflows/pr-check.yml
# Edits made here in the target repo are overwritten by `just deploy github mite-assistant-mcp`.
#
# This is the check ai-pr-agent.yml gates on (PR_CHECK_WORKFLOW=pr-check.yml). It refuses
# to merge without a green run here, and it dispatches this workflow for a PR whose head
# commit has no checks — so the `workflow_dispatch` trigger is load-bearing.
# Managed by homelab-infra — terraform/github/mite-assistant-mcp/workflows/pr-check.yml
# Edits made here in the target repo are overwritten by `just deploy github mite-assistant-mcp`.
#
# The gate the branch ruleset requires. `npm ci` fails on a broken or inconsistent
# lockfile and `docker build` fails on a dependency the image can no longer install —
# between them that is the signal that actually matters for a dependency bump.
# The check name reported to the ruleset is the job id: `build`.
name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Lets the AI PR agent start this check on a PR branch that never got one —
  # e.g. a PR opened before this workflow existed.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install from lockfile
        run: npm ci

      - name: Build image (no push)
        # Tagged from the SHA, not the PR number — there is no PR context on dispatch.
        run: docker build -t "mite-assistant-mcp:${GITHUB_SHA::7}" .