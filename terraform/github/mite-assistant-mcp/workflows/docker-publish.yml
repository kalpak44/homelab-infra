# Managed by homelab-infra — terraform/github/mite-assistant-mcp/workflows/docker-publish.yml
# Edits made here in the target repo are overwritten by `just deploy github mite-assistant-mcp`.
#
# Builds and publishes this repo's image, then tells the cluster to roll it out.
#
# Renaming this file means renaming it in homelab-infra too, in two places: the `apps`
# list in gitops/Justfile, which finds the last successful run here to read a tag from,
# and the `publish_workflow` local in terraform/github/mite-assistant-mcp/main.tf.
#
# The action versions here are bumped by hand. Dependabot cannot watch this file: it only
# scans `.github/workflows/`, and in homelab-infra this is an ordinary file under
# `terraform/`, so `github-actions` is deliberately absent from dependabot.yml.
name: Build, Publish, Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  docker:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 7
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build report
        run: |
          echo "### Docker Image Build Report 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "Successfully built and pushed a multi-platform image to GHCR." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Platforms:** \`linux/amd64\`, \`linux/arm64\`, \`linux/arm/v7\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- |" >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r tag; do
            [ -n "$tag" ] && echo "| \`$tag\` |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "${{ steps.meta.outputs.tags }}"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to cluster
    # Gated on the image existing. `docker` runs on a push to main and on dispatch, and
    # both produce a real image at GITHUB_SHA, so both are worth deploying — the sha is
    # passed explicitly rather than looked up, which is what makes the dispatch case work.
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Until this job existed, publishing here reached the cluster only through
      # homelab-infra's nightly sweep, so an image could sit unrolled for up to a day.
      # Both inputs are required: this workflow's own run is still in_progress here, so
      # the sweep's "last successful publish" query would resolve to the previous commit.
      #
      # `app` must match the `apps` list in homelab-infra's gitops/Justfile, or the
      # dispatch fails with "no app named ... is tracked". A PAT, not GITHUB_TOKEN: the
      # job's own token is scoped to this repo and cannot dispatch a workflow in another.
      - name: Trigger cluster deploy
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          gh workflow run gitops-bump-images.yml \
            --repo kalpak44/homelab-infra \
            -f app=mite-assistant-mcp \
            -f sha="${GITHUB_SHA}"
          echo "Dispatched \`gitops-bump-images\` for \`mite-assistant-mcp\` @ \`${GITHUB_SHA:0:7}\`." >> "$GITHUB_STEP_SUMMARY"
