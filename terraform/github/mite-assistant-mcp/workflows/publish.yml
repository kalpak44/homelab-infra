# Managed by homelab-infra — terraform/github/mite-assistant-mcp/workflows/publish.yml
# Edits made here in the target repo are overwritten by `just deploy github mite-assistant-mcp`.
#
# Four jobs, in order: verify the code, build the image, report on the image, roll it out.
#
#   verify format, lint, tests at 80% coverage, SonarCloud with the gate waited on
#   image build, and push to GHCR only when the ref is main
#   scan syft + grype into the run summary, report-only
#   deploy dispatch homelab-infra's gitops-bump-images
#
# The split exists so the code gate fails in about a minute instead of behind a
# three-platform build under emulation, and so the graph says which half failed. Only the
# GHCR push and the rollout are conditional, so a dependency bump is fully validated —
# Dockerfile included — without publishing anything.
#
# This is also the check ai-pr-agent.yml gates on (PR_CHECK_WORKFLOW=publish.yml). It
# refuses to merge without a green run, and it dispatches this workflow for a PR whose
# head commit has no checks — so `workflow_dispatch` is load-bearing.
#
# Renaming this file means renaming it in homelab-infra too, in two places: the `apps`
# list in gitops/Justfile, which finds the last successful run here to read a tag from,
# and the `publish_workflow` local in terraform/github/mite-assistant-mcp/main.tf.
#
# The action versions here are bumped by hand. Dependabot cannot watch this file: it only
# scans `.github/workflows/`, and in homelab-infra this is an ordinary file under
# `terraform/`, so `github-actions` is deliberately absent from dependabot.yml.
name: Verify, Publish, Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Superseding a pull request's run is free. Superseding a push to main is not: that run
# ends in a cluster rollout, and cancelling it halfway leaves the image published but the
# manifests still pointing at the previous tag. The agent's closing dispatch shares this
# group with the merge that preceded it and therefore queues behind it rather than racing
# it — which is what lets the dispatch assume the image is already in GHCR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  # Pinned rather than floating: an unpinned installer would change what the report says
  # from one run to the next with no commit to attribute it to. Bumped by hand here, like
  # the actions — Dependabot cannot see this file.
  SYFT_VERSION: v1.51.1
  GRYPE_VERSION: v0.118.0

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Job-level so the `if:` conditions below can test them. A fork's pull request gets
      # no secrets, so the analysis step skips itself there instead of failing the check.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      # The ref test is not redundant with the event test. The agent starts this workflow
      # by `workflow_dispatch` on a PR head branch when that branch's head commit carries
      # no checks; without the ref test such a run would log in to GHCR, push a sha tag
      # for an unmerged branch, and dispatch a rollout of it.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    # Resolved once, here, and read by every job downstream. Repeating the event/ref test
    # per job would let the publish, scan and rollout conditions drift apart.
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      tag: ${{ steps.gate.outputs.tag }}

    steps:
      # Seven characters, no prefix: homelab-infra's `just bump-images` rewrites the
      # manifest to "${sha:0:7}", so any other shape points the cluster at a tag that does
      # not exist and the Deployment lands in ImagePullBackOff. Derived here rather than
      # read from metadata-action's `version` output, which resolves to `latest` on main —
      # the scan report named a mutable tag and every run collided on the artifact name
      # `image-scan-latest`. Measured on run 34326858891.
      - name: Resolve the publish gate and the image tag
        id: gate
        run: |
          set -euo pipefail

          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        # Full history: Sonar needs it for blame and new-code detection.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node 20 is pinned in three places at once: this line, the Dockerfile's
          # `node:20-bookworm-slim`, and package.json's `engines`, with dependabot.yml
          # holding the `node` bump. Moving one alone means the runtime that ships is
          # never the one tested.
          node-version: "20"
          cache: npm

      # Fails on a broken or inconsistent lockfile, which is the signal that matters most
      # for a dependency bump. Not covered by the image build: the Dockerfile runs
      # `npm ci --omit=dev`, so a devDependency that cannot install would go unnoticed —
      # and eslint, prettier and jest are devDependencies, so the gates below need it.
      - name: Install from lockfile
        run: npm ci

      # Blocking, not advisory. The agent merges dependency PRs with no human review, so
      # style drift committed by its own compatibility fixes has nothing else to catch it.
      # It can clear both of these itself with `npm run format` and `npm run lint:fix`.
      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      # `npm test` is `jest --coverage`, and jest.config.js sets an 80% threshold on
      # statements, branches, functions and lines, so the coverage gate is enforced by the
      # test run itself rather than by a separate step here that could be dropped without
      # anything noticing. Verified to fail by raising the threshold on 2026-09-09.
      #
      # It writes coverage/lcov.info, which the analysis below uploads — so this step has
      # to come before Sonar, not after.
      - name: Run tests with coverage
        run: npm test

      # qualitygate.wait makes the gate an actual gate: a failing gate fails this check,
      # so the agent cannot merge past it. Guarded on the coordinates rather than on the
      # event, so the repo still verifies before its SonarCloud project exists.
      #
      # SONAR_TOKEN has to live in the Dependabot secret store as well as the Actions one.
      # GitHub withholds Actions secrets from Dependabot-triggered runs, so without the
      # mirror this step skips itself on exactly the pull requests the gate exists for.
      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src
            -Dsonar.tests=test
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

  image:
    name: Build and publish image
    # Named for both halves because it does both: it builds on every trigger, and pushes
    # only when the ref is main. A pull request still exercises the Dockerfile — a
    # dependency the image can no longer install fails here — which is why the build is
    # not gated behind the push.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    env:
      # Taken from verify rather than recomputed, so there is one publish condition in
      # this workflow and not four.
      PUBLISH: ${{ needs.verify.outputs.publish }}

    # Passed through so scan and deploy need only `needs: image` and still see the gate.
    outputs:
      publish: ${{ needs.verify.outputs.publish }}
      tag: ${{ needs.verify.outputs.tag }}
      # The scan job addresses the image by digest, not by tag: a tag can be overwritten
      # between the push and the scan, and then the report would describe an image that is
      # not the one being deployed.
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Only the multi-arch build needs emulation, and an unpublished ref builds one
      # platform.
      - name: Set up QEMU
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        # A Dependabot-triggered run gets a read-only GITHUB_TOKEN and would fail here on
        # exactly the PRs the check exists for. Nothing is pushed from such a run anyway.
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 7
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          platforms: ${{ env.PUBLISH == 'true' && 'linux/amd64,linux/arm64,linux/arm/v7' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build report
        run: |
          set -euo pipefail

          if [ "${PUBLISH}" = "true" ]; then
            echo "### Image published 🚀" >> "$GITHUB_STEP_SUMMARY"
            echo "Platforms: \`linux/amd64\`, \`linux/arm64\`, \`linux/arm/v7\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Verified, not published ✅" >> "$GITHUB_STEP_SUMMARY"
            echo "Built \`linux/amd64\` only; nothing was pushed to GHCR." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- |" >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r tag; do
            [ -n "$tag" ] && echo "| \`$tag\` |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "${{ steps.meta.outputs.tags }}"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Scan image
    # Between publish and deploy so the report describes the exact image about to roll
    # out. It is REPORT-ONLY and must stay that way: no --fail-on, no threshold, and the
    # deploy job below is wired to ignore this job's result. The blocking security gate
    # for this repo is Sonar in the job above; this is here to be read, not to stop a
    # release, and turning it into a gate would deadlock on findings Debian has not
    # packaged a fix for.
    needs: image
    # Only a published image can be pulled by digest. A pull request builds without
    # pushing, so there is nothing in the registry to scan — the tradeoff is that the
    # report arrives at deploy time rather than at review time.
    if: needs.image.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      # The package is private, so an anonymous pull fails. syft and grype both read
      # ~/.docker/config.json, which this writes.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install syft and grype
        run: |
          set -euo pipefail

          curl -fsSL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          curl -fsSL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin "${GRYPE_VERSION}"

          syft version
          grype version

      # grype scans the SBOM rather than the image a second time, so the packages it
      # matches against advisories are exactly the ones syft reported — two independent
      # catalogings would let the report and the SBOM disagree.
      #
      # --platform is explicit because the digest is a manifest list of three platforms
      # and the default would be whatever the runner happens to be. The report says which.
      - name: Generate the SBOM and scan it
        id: scan
        run: |
          set -euo pipefail

          ref="${IMAGE_NAME}@${{ needs.image.outputs.digest }}"
          echo "Scanning ${ref} (linux/amd64)"

          syft --platform linux/amd64 "registry:${ref}" -o json > sbom.json
          syft --platform linux/amd64 "registry:${ref}" -o spdx-json > sbom.spdx.json

          grype "sbom:sbom.json" -o json > grype.json
          grype "sbom:sbom.json" -o table > grype.txt

          echo "packages=$(jq '.artifacts | length' sbom.json)" >> "$GITHUB_OUTPUT"

      # Every count comes out of grype.json here rather than being parsed twice in the
      # step below, so the totals in the summary and the table can never disagree.
      - name: Report to the run summary
        if: always()
        run: |
          set -euo pipefail

          if [ ! -f grype.json ]; then
            echo "### Image scan — did not run" >> "$GITHUB_STEP_SUMMARY"
            echo "syft or grype failed before producing a report; see the step log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          jq '[.matches[]
               | {id:       .vulnerability.id,
                  severity: .vulnerability.severity,
                  package:  .artifact.name,
                  version:  .artifact.version,
                  type:     .artifact.type,
                  state:    (.vulnerability.fix.state // "unknown"),
                  fixed_in: (.vulnerability.fix.versions // [])}]
              | unique_by([.id, .package, .version])' grype.json > findings.json

          count() { jq --arg s "$1" '[.[] | select(.severity == $s)] | length' findings.json; }
          crit=$(count Critical); high=$(count High); med=$(count Medium)
          low=$(count Low); neg=$(count Negligible); unk=$(count Unknown)
          total=$(jq 'length' findings.json)
          fixable=$(jq '[.[] | select(.state == "fixed" and (.fixed_in | length) > 0)] | length' findings.json)

          {
            echo "### Image scan — report only 🔍"
            echo
            echo "\`${IMAGE_NAME}:${{ needs.image.outputs.tag }}\` · \`linux/amd64\` ·"
            echo "${{ steps.scan.outputs.packages }} packages · syft \`${SYFT_VERSION}\` · grype \`${GRYPE_VERSION}\`"
            echo
            echo "| Critical | High | Medium | Low | Negligible | Unknown | Total |"
            echo "| ---: | ---: | ---: | ---: | ---: | ---: | ---: |"
            echo "| ${crit} | ${high} | ${med} | ${low} | ${neg} | ${unk} | ${total} |"
            echo
            echo "${fixable} of ${total} have a fixed version published upstream. This job never"
            echo "blocks the rollout — it is a report."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Only Critical and High are tabulated. A Debian base image routinely carries
          # hundreds of Low/Negligible findings and a summary listing them all is one
          # nobody reads, which is the same as no report at all.
          if [ "$((crit + high))" -gt 0 ]; then
            {
              echo "#### Critical and High"
              echo
              echo "| Severity | Package | Version | Vulnerability | Fix |"
              echo "| :--- | :--- | :--- | :--- | :--- |"
              jq -r '[.[] | select(.severity == "Critical" or .severity == "High")]
                     | sort_by(.severity, .package, .id)[]
                     | "| \(.severity) | \(.package) | \(.version) | \(.id) | "
                       + (if .state == "fixed" and (.fixed_in | length) > 0
                          then (.fixed_in | join(", "))
                          else "_none upstream_" end)
                       + " |"' findings.json
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Critical or High findings." >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi

      # The summary is truncated at 1 MB and is not machine-readable. The artifact is what
      # a later triage actually needs, and the SPDX copy is the interchange format.
      - name: Upload the SBOM and scan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-scan-${{ needs.image.outputs.tag }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            sbom.json
            sbom.spdx.json
            grype.json
            grype.txt

  deploy:
    name: Deploy to cluster
    # Gated on the image existing. `image` publishes on a push to main and on a dispatch
    # of main. Both produce a real image at GITHUB_SHA, so both are worth deploying —
    # the sha is passed explicitly rather than looked up, which is what makes the dispatch
    # case work.
    # `needs` the scan only for ordering, so the report is in the summary before the
    # rollout starts. `always()` plus an explicit image check is what keeps it ordering
    # and nothing more: a scanner outage, a registry timeout or a findings table nobody
    # likes must not strand a published image, while a failed build still blocks.
    needs: [image, scan]
    if: always() && needs.image.result == 'success' && needs.image.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A PAT, not GITHUB_TOKEN: this job's own token is scoped to this repo and cannot
      # dispatch a workflow in homelab-infra, nor read another repo's pull requests.
      GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
    steps:
      # A morning sweep merges up to ten dependency PRs one after another. Rolling the
      # cluster once per merge means ten rollouts of intermediate commits that nobody
      # asked to run, so a merge of a bot-authored PR publishes its image and stops here;
      # ai-pr-agent.yml dispatches this workflow once when its batch is finished, and that
      # dispatch run is what rolls out the combined result.
      #
      # Every main commit still gets its own image, which the hold does not change and
      # must not: homelab-infra's nightly `just bump-images` reads the tag from the last
      # successful *push* run of this workflow, so a main commit with no image behind it
      # would leave the Deployment in ImagePullBackOff.
      #
      # A bot PR merged by hand instead of by the agent is therefore held with no dispatch
      # to follow. That case degrades to the nightly sweep rather than to a stuck rollout,
      # which is what the sweep is for.
      - name: Hold the rollout while the agent is mid-batch
        id: hold
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          # The commit's associated pull requests, not its author. A squash merge lists
          # the bot as author only while the bot is the sole author, and the agent commits
          # its compatibility fixes to the same branch — which silently makes the merger
          # the author and would read as a human commit.
          author_type=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq 'map(select(.merged_at != null)) | .[0].user.type // ""')

          if [ "$author_type" = "Bot" ]; then
            echo "held=true" >> "$GITHUB_OUTPUT"
            echo "Rollout held — bot PR merge, the AI PR agent deploys the batch." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Both inputs are required: this workflow's own run is still in_progress here, so
      # the sweep's "last successful publish" query would resolve to the previous commit.
      #
      # `app` must match the `apps` list in homelab-infra's gitops/Justfile, or the
      # dispatch fails with "no app named ... is tracked".
      - name: Trigger cluster deploy
        if: steps.hold.outputs.held != 'true'
        run: |
          set -euo pipefail

          gh workflow run gitops-bump-images.yml \
            --repo kalpak44/homelab-infra \
            -f app=mite-assistant-mcp \
            -f sha="${GITHUB_SHA}"
          echo "Dispatched \`gitops-bump-images\` for \`mite-assistant-mcp\` @ \`${GITHUB_SHA:0:7}\`." >> "$GITHUB_STEP_SUMMARY"
