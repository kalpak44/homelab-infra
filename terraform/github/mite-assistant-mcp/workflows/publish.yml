# Managed by homelab-infra — terraform/github/mite-assistant-mcp/workflows/publish.yml
# Edits made here in the target repo are overwritten by `just deploy github mite-assistant-mcp`.
#
# verify -> image -> scan -> deploy. Only the GHCR push and the rollout are conditional,
# so a dependency PR is fully validated, Dockerfile included, without publishing.
#
# ai-pr-agent.yml gates on this file (PR_CHECK_WORKFLOW) and dispatches it for a PR with
# no checks, so `workflow_dispatch` is load-bearing.
#
# Renaming this file breaks the deploy that looks it up by name. Action versions are
# bumped by hand, because Dependabot does not scan a generated file.
name: Verify, Publish, Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Cancelling a push to main would leave the image published and the manifests on the old
# tag. The agent's closing dispatch queues behind the merge instead of racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  # Pinned so the report cannot change without a commit to attribute it to.
  SYFT_VERSION: v1.51.1
  GRYPE_VERSION: v0.118.0

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Job-level so the `if:` below can test them; a fork PR gets no secrets and skips.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      # The ref test is not redundant: the agent dispatches this on PR head branches, and
      # without it such a run would publish and roll out an unmerged branch.
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    # Resolved once and read downstream, so the four jobs cannot disagree.
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      tag: ${{ steps.gate.outputs.tag }}

    steps:
      # Seven characters, no prefix: `just bump-images` writes "${sha:0:7}" and any other
      # shape lands the Deployment in ImagePullBackOff. Not metadata-action's `version`,
      # which resolves to `latest` on main.
      - name: Resolve the publish gate and the image tag
        id: gate
        run: |
          set -euo pipefail

          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        # Full history: Sonar needs it for blame and new-code detection.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Pinned here, in the Dockerfile, and in package.json engines. Move all three
          # together, or the runtime that ships is not the one tested.
          node-version: "24"
          cache: npm

      # Catches a broken lockfile, and installs the devDependencies the gates below need.
      # The image build cannot: it runs `npm ci --omit=dev`.
      - name: Install from lockfile
        run: npm ci

      # Blocking: the agent merges with no human review, so nothing else catches drift.
      # It clears these itself with `npm run format` and `npm run lint:fix`.
      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      # The 80% coverage gate lives in jest.config.js, so no step here can drop it.
      # Writes coverage/lcov.info, which Sonar uploads — must run before Sonar.
      - name: Run tests with coverage
        run: npm test

      # qualitygate.wait is what makes this block a merge. A missing project key skips
      # rather than fails, so check the step ran. SONAR_TOKEN must be in the Dependabot
      # store too, or it skips on exactly the PRs the gate exists for.
      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src
            -Dsonar.tests=test
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

  image:
    name: Build and publish image
    # Builds on every trigger, pushes only on main. Never gate the build behind the push:
    # a PR must still exercise the Dockerfile.
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    env:
      # From verify, not recomputed: one publish condition, not four.
      PUBLISH: ${{ needs.verify.outputs.publish }}

    # Passed through so scan and deploy need only `needs: image`.
    outputs:
      publish: ${{ needs.verify.outputs.publish }}
      tag: ${{ needs.verify.outputs.tag }}
      # By digest, not tag: a tag can be overwritten between the push and the scan.
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        # A Dependabot run gets a read-only GITHUB_TOKEN and would fail here.
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 7
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          # amd64 alone: the cluster is x86, and arm/v7 does not exist past Node 22.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build report
        run: |
          set -euo pipefail

          if [ "${PUBLISH}" = "true" ]; then
            echo "### Image published 🚀" >> "$GITHUB_STEP_SUMMARY"
            echo "Platform: \`linux/amd64\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Verified, not published ✅" >> "$GITHUB_STEP_SUMMARY"
            echo "Built \`linux/amd64\`; nothing was pushed to GHCR." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- |" >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r tag; do
            [ -n "$tag" ] && echo "| \`$tag\` |" >> "$GITHUB_STEP_SUMMARY"
          done <<< "${{ steps.meta.outputs.tags }}"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ steps.push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Scan image
    # REPORT-ONLY, and must stay that way: no --fail-on, no threshold. Sonar above is the
    # blocking gate. A threshold here would deadlock on unfixable base-image CVEs.
    needs: image
    # Only a published image can be pulled, so a PR has nothing to scan.
    if: needs.image.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      # The package is private; syft and grype read the config this writes.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install syft and grype
        run: |
          set -euo pipefail

          curl -fsSL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          curl -fsSL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin "${GRYPE_VERSION}"

          syft version
          grype version

      # grype scans the SBOM, not the image again, so the report and the SBOM cannot
      # disagree. --platform is explicit so the result does not depend on the runner.
      - name: Generate the SBOM and scan it
        id: scan
        run: |
          set -euo pipefail

          ref="${IMAGE_NAME}@${{ needs.image.outputs.digest }}"
          echo "Scanning ${ref} (linux/amd64)"

          syft --platform linux/amd64 "registry:${ref}" -o json > sbom.json
          syft --platform linux/amd64 "registry:${ref}" -o spdx-json > sbom.spdx.json

          grype "sbom:sbom.json" -o json > grype.json
          grype "sbom:sbom.json" -o table > grype.txt

          echo "packages=$(jq '.artifacts | length' sbom.json)" >> "$GITHUB_OUTPUT"

      # All counts come from one pass over grype.json, so the totals cannot disagree.
      - name: Report to the run summary
        if: always()
        run: |
          set -euo pipefail

          if [ ! -f grype.json ]; then
            echo "### Image scan — did not run" >> "$GITHUB_STEP_SUMMARY"
            echo "syft or grype failed before producing a report; see the step log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          jq '[.matches[]
               | {id:       .vulnerability.id,
                  severity: .vulnerability.severity,
                  package:  .artifact.name,
                  version:  .artifact.version,
                  type:     .artifact.type,
                  state:    (.vulnerability.fix.state // "unknown"),
                  fixed_in: (.vulnerability.fix.versions // [])}]
              | unique_by([.id, .package, .version])' grype.json > findings.json

          count() { jq --arg s "$1" '[.[] | select(.severity == $s)] | length' findings.json; }
          crit=$(count Critical); high=$(count High); med=$(count Medium)
          low=$(count Low); neg=$(count Negligible); unk=$(count Unknown)
          total=$(jq 'length' findings.json)
          fixable=$(jq '[.[] | select(.state == "fixed" and (.fixed_in | length) > 0)] | length' findings.json)

          {
            echo "### Image scan — report only 🔍"
            echo
            echo "\`${IMAGE_NAME}:${{ needs.image.outputs.tag }}\` · \`linux/amd64\` ·"
            echo "${{ steps.scan.outputs.packages }} packages · syft \`${SYFT_VERSION}\` · grype \`${GRYPE_VERSION}\`"
            echo
            echo "| Critical | High | Medium | Low | Negligible | Unknown | Total |"
            echo "| ---: | ---: | ---: | ---: | ---: | ---: | ---: |"
            echo "| ${crit} | ${high} | ${med} | ${low} | ${neg} | ${unk} | ${total} |"
            echo
            echo "${fixable} of ${total} have a fixed version published upstream. This job never"
            echo "blocks the rollout — it is a report."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Critical and High only: a table of hundreds of Low findings goes unread.
          if [ "$((crit + high))" -gt 0 ]; then
            {
              echo "#### Critical and High"
              echo
              echo "| Severity | Package | Version | Vulnerability | Fix |"
              echo "| :--- | :--- | :--- | :--- | :--- |"
              jq -r '[.[] | select(.severity == "Critical" or .severity == "High")]
                     | sort_by(.severity, .package, .id)[]
                     | "| \(.severity) | \(.package) | \(.version) | \(.id) | "
                       + (if .state == "fixed" and (.fixed_in | length) > 0
                          then (.fixed_in | join(", "))
                          else "_none upstream_" end)
                       + " |"' findings.json
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Critical or High findings." >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi

      # The summary is capped at 1 MB and unparseable; triage needs the files.
      - name: Upload the SBOM and scan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-scan-${{ needs.image.outputs.tag }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            sbom.json
            sbom.spdx.json
            grype.json
            grype.txt

  deploy:
    name: Deploy to cluster
    # `needs` the scan for ordering only. `always()` plus the explicit image check means a
    # scanner outage cannot strand a published image, while a failed build still blocks.
    needs: [image, scan]
    if: always() && needs.image.result == 'success' && needs.image.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A PAT: this job's token cannot dispatch a workflow in another repo.
      GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
    steps:
      # A bot-PR merge publishes its image but holds the rollout; ai-pr-agent.yml
      # dispatches one rollout when its sweep ends, so ten merges roll out once.
      # Never hold the publish as well: the scheduled deploy reads the tag from the last
      # successful push run, so every commit on main needs an image behind it.
      - name: Hold the rollout while the agent is mid-batch
        id: hold
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          # The commit's PRs, not its author: the agent's own fix commits make the merger
          # the author of the squash, which would read as human.
          author_type=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq 'map(select(.merged_at != null)) | .[0].user.type // ""')

          if [ "$author_type" = "Bot" ]; then
            echo "held=true" >> "$GITHUB_OUTPUT"
            echo "Rollout held — bot PR merge, the AI PR agent deploys the batch." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Both inputs are required: this run is still in_progress, so a lookup would
      # resolve to the previous commit. `app` must match the name the deploy tracks.
      - name: Trigger cluster deploy
        if: steps.hold.outputs.held != 'true'
        run: |
          set -euo pipefail

          gh workflow run gitops-bump-images.yml \
            --repo kalpak44/homelab-infra \
            -f app=mite-assistant-mcp \
            -f sha="${GITHUB_SHA}"
          echo "Dispatched \`gitops-bump-images\` for \`mite-assistant-mcp\` @ \`${GITHUB_SHA:0:7}\`." >> "$GITHUB_STEP_SUMMARY"
