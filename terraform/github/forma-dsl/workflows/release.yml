# Managed by homelab-infra — terraform/github/forma-dsl/workflows/release.yml
# Edits made here in the target repo are overwritten by `just deploy github forma-dsl`.
#
# The action versions here are bumped by hand. Dependabot cannot watch this file: it only
# scans `.github/workflows/`, and in homelab-infra this is an ordinary file under
# `terraform/`, so `github-actions` is deliberately absent from dependabot.yml.
#
# One of the repo's three workflows, and its PR check (PR_CHECK_WORKFLOW). It verifies on
# every pull request and every push to main, and publishes to npm only for a `v*` tag. The
# agent cuts that tag once per sweep, so a batch of ten merges produces one release rather
# than ten. Keying the release on the tag is also what keeps the version commit from
# starting another release: it lands on main, and main does not publish.
name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # One tag per published package, `<name>@<version>`, so each gets its own entry on the
    # releases page. Adding a package means adding its pattern here.
    tags: ["forma-dsl@*", "forma-dsl-mcp@*"]
  # The agent starts this for a pull request whose head commit has no checks — a branch
  # opened before the check existed never gets one retroactively.
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The runner label is pinned rather than `ubuntu-latest`: `ubuntu-latest` migrates to
  # Ubuntu 26 on 19 October 2026, and a toolchain changing under a release is not
  # something a pipeline should discover for itself.
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The floor is the oldest runtime a consumer may still be on: Node 20 reached end
        # of life in April 2026, and ESLint rules out 22.0–22.12. It is also what the
        # published `engines` declare — the library ships source, so the runtime that
        # consumes it is the consumer's.
        node: ["22.13", "24.x"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install from lockfile
        run: npm ci

      # Blocking: the agent merges with no human review, so nothing else catches drift.
      # It clears these itself with `npm run lint -- --fix`.
      - name: Run linter
        run: npm run lint

      - name: Check the published type declarations
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  quality:
    name: Coverage, package contents and Sonar
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      # Job-level so the `if:` below can test them; a fork PR gets no secrets and skips.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout repository
        # Full history: Sonar needs it for blame and new-code detection.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install from lockfile
        run: npm ci

      # The thresholds live in the `test:coverage` script, so no step here can drop them.
      # Writes coverage/lcov.info, which Sonar uploads — must run before Sonar.
      - name: Test with coverage
        run: npm run test:coverage

      # The published tarball must carry the library and nothing else. A stray app/ or
      # test/ here means `files` in packages/forma-dsl/package.json drifted.
      - name: Inspect the publishable tarball
        run: npm run check:package

      # qualitygate.wait is what makes this block a merge. A missing project key skips
      # rather than fails, so check the step ran. SONAR_TOKEN must be in the Dependabot
      # store too, or it skips on exactly the PRs the gate exists for.
      #
      # Never on a tag. The scanner takes its branch name from the ref, so a tag run asks
      # SonarCloud about a branch called `v1.2.3` that has never existed, and the gate
      # lookup answers "Not authorized or project not found" — which reads as a bad token
      # and is not. The tag points at a commit main analysed moments earlier, so there is
      # nothing to re-analyse; without this the release job never runs.
      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && github.ref_type != 'tag' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=packages/forma-dsl/src,packages/forma-dsl-mcp/src,apps/landing/src,apps/editor/src,apps/docs/build.mjs
            -Dsonar.tests=packages/forma-dsl/test,packages/forma-dsl-mcp/test,apps/landing/test,apps/editor/test
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

  release:
    name: Publish ${{ github.ref_name }}
    needs: [verify, quality]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: write
      # npm authenticates this job by its OIDC identity — no token. npm signs the
      # provenance attestation from the same identity, which is what ties the published
      # tarball to this repository and this commit.
      id-token: write

    steps:
      # Checked out at the tag, which is the commit the version number describes.
      - uses: actions/checkout@v7

      # Node 24 is what carries npm 11.5.1, the floor for trusted publishing; an older
      # npm falls back to looking for a token and fails as if none were configured.
      # `registry-url` is what writes the .npmrc that names the registry to publish to.
      # The dependency cache is deliberately off: a release must resolve from the
      # lockfile alone, never from whatever a previous run left behind.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # The tag names the package and the version, and the manifest has to agree: they are
      # written in the same commit, so a mismatch is a tag cut against something other than
      # what is in the tree, and publishing from it would ship a number nobody chose.
      - name: Resolve the package this tag releases
        id: package
        run: |
          set -euo pipefail
          name="${GITHUB_REF_NAME%@*}"
          version="${GITHUB_REF_NAME##*@}"

          manifest="packages/${name}/package.json"
          if [ ! -f "$manifest" ] || [ "$(jq -r .name "$manifest")" != "$name" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} names no package in this repository"
            exit 1
          fi

          declared="$(jq -r .version "$manifest")"
          if [ "$declared" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match ${manifest} ${declared}"
            exit 1
          fi

          # npm attaches a trusted publisher only to a package that already exists, so the
          # first version of each one goes up by hand and everything after it through OIDC.
          # Checked before the build, so the failure names the missing registration rather
          # than surfacing as an authentication error ten minutes later.
          if ! npm view "$name" version >/dev/null 2>&1; then
            echo "::error::${name} has never been published — publish the first version by hand, then register this workflow as its trusted publisher"
            exit 1
          fi

          {
            echo "name=${name}"
            echo "version=${version}"
            echo "manifest=${manifest}"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build

      # Publishing is the one place where skipping the gate to save ninety seconds is
      # least defensible, and the tag is not necessarily the commit main last verified.
      - name: Check
        run: npm run check

      # Each package releases on its own tag, so two of them cut together publish in
      # parallel. A package that depends on another one from this repository would then be
      # installable for a minute or two before the version it names exists, which npm
      # reports as a missing version rather than as a race. Waiting here costs nothing when
      # the dependency is already up, which is the usual case.
      - name: Wait for the versions this package depends on
        env:
          MANIFEST: ${{ steps.package.outputs.manifest }}
        run: |
          set -euo pipefail
          for dependency in packages/*/package.json; do
            other="$(jq -r .name "$dependency")"
            if [ "$other" = "${{ steps.package.outputs.name }}" ]; then continue; fi

            wanted="$(jq -r --arg n "$other" '.dependencies[$n] // empty' "$MANIFEST" | tr -d '^~')"
            if [ -z "$wanted" ]; then continue; fi

            echo "waiting for ${other}@${wanted}"
            for attempt in $(seq 1 30); do
              if npm view "${other}@${wanted}" version >/dev/null 2>&1; then
                echo "${other}@${wanted} is on the registry"
                break
              fi
              if [ "$attempt" = 30 ]; then
                echo "::error::${other}@${wanted} never appeared on the registry"
                exit 1
              fi
              sleep 10
            done
          done

      # No NODE_AUTH_TOKEN and no `--provenance`: npm trusts this workflow by name, so the
      # credential is the run's OIDC identity and the attestation is automatic. Renaming
      # this file breaks publishing until the trusted publisher is recreated — npm matches
      # it exactly, its configurations cannot be edited in place, and each package carries
      # its own registration.
      # Skipped when that exact version is already on the registry, so a run that
      # published and then failed on a later step can be re-run: the tag names the commit
      # and cannot be moved, so a re-run is the only way to finish it.
      - name: Publish
        env:
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::${NAME}@${VERSION} is already on the registry"
            exit 0
          fi
          npm publish -w "$NAME" --access public

      # One release per package, titled for the package rather than for the repository, so
      # the releases page says which of them a version belongs to.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.package.outputs.name }} ${{ steps.package.outputs.version }}
          generate_release_notes: true

      - name: Summarise
        env:
          NAME: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          {
            echo "## Published \`${NAME}@${VERSION}\`"
            echo
            echo "- [npm](https://www.npmjs.com/package/${NAME}/v/${VERSION})"
            echo "- \`npm install ${NAME}@${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
