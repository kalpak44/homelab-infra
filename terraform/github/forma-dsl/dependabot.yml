# Managed by homelab-infra — terraform/github/forma-dsl/dependabot.yml
# Edits made here in the target repo are overwritten by `just deploy github forma-dsl`.
#
# Opens the dependency PRs that ai-maintenance-agent.yml then reviews, repairs and merges.
# Daily, finishing an hour before that agent's sweep, so a proposal never waits more than
# an hour to be picked up.
#
# One entry per project rather than one at the workspace root, so a bump that breaks
# something names which project it belongs to. They are staggered by six minutes because
# npm workspaces resolve into a single root lockfile: every entry here writes that one
# file, and two updaters starting together race for it.
#
# `github-actions` is deliberately absent. Every workflow this repo has is generated by
# homelab-infra (terraform/github/forma-dsl/workflows/), so an action bump merged here is
# reverted by the next `just deploy github forma-dsl` and then re-opened by Dependabot on
# the following run. Action versions in those files are bumped in homelab-infra instead,
# and Dependabot cannot watch them there either: it only scans `.github/workflows/`, and
# in homelab-infra they are ordinary files under `terraform/`.
version: 2

updates:
  # The workspace root, which holds the lint and type toolchain every project is checked
  # with and nothing that ships.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "04:30"
      timezone: Etc/UTC
    # The agent has no per-run limit of its own, so this is sized to not withhold
    # proposals. It throttles how many sit open at once, not how many exist.
    open-pull-requests-limit: 10
    # The updater invokes npm with a 3-day minimum release age whether or not this is
    # set. Without it the checker still picks a younger version, which npm then refuses
    # to write, and the run fails with "No files were updated!".
    cooldown:
      default-days: 3
    # Dependabot proposes only DIRECT dependencies unless told otherwise; for npm the
    # indirect ones are lockfile-only changes and fold into the group below.
    allow:
      - dependency-type: all
    # Minor and patch bumps arrive as one PR per project, so the single lockfile is
    # resolved once. Majors are deliberately NOT in this group: they arrive as one PR
    # each, which keeps a break attributable and is the signal release.yml bumps the
    # minor rather than the patch on.
    groups:
      toolchain-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The published library.
  - package-ecosystem: npm
    directory: /packages/forma-dsl
    schedule:
      interval: daily
      time: "04:36"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    allow:
      - dependency-type: all
    groups:
      library-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The published MCP server.
  - package-ecosystem: npm
    directory: /packages/forma-dsl-mcp
    schedule:
      interval: daily
      time: "04:42"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    allow:
      - dependency-type: all
    # `forma-dsl` is excluded: the release that cuts a version writes this dependency
    # itself, so a proposal here would either duplicate that or undo it.
    ignore:
      - dependency-name: forma-dsl
    groups:
      mcp-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The browser editor.
  - package-ecosystem: npm
    directory: /apps/editor
    schedule:
      interval: daily
      time: "04:48"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    allow:
      - dependency-type: all
    groups:
      editor-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The landing page.
  - package-ecosystem: npm
    directory: /apps/landing
    schedule:
      interval: daily
      time: "04:54"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    allow:
      - dependency-type: all
    groups:
      landing-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # The reference manual and the builder that renders it.
  - package-ecosystem: npm
    directory: /apps/docs
    schedule:
      interval: daily
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    allow:
      - dependency-type: all
    groups:
      docs-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
