# Managed by homelab-infra — terraform/github/forma-dsl/dependabot.yml
# Edits made here in the target repo are overwritten by `just deploy github forma-dsl`.
#
# Opens the dependency PRs that ai-maintenance-agent.yml then reviews, repairs and merges.
# Daily at 05:00 UTC, an hour before that agent's daily sweep, so a proposal never waits
# more than an hour to be picked up.
#
# One entry, at the workspace root, and the groups below are what make a bump attributable
# to a project. Do not split this into one entry per workspace directory — it was tried and
# reverted. npm workspaces resolve into a single root lockfile, and an entry pointing at a
# member directory finds no lockfile beside its manifest, so Dependabot proposes the
# manifest edit alone and every such PR fails `npm ci` with "package.json and
# package-lock.json are not in sync" — blocking the whole queue rather than one project.
#
# `github-actions` is deliberately absent. Every workflow this repo has is generated by
# homelab-infra (terraform/github/forma-dsl/workflows/), so an action bump merged here is
# reverted by the next `just deploy github forma-dsl` and then re-opened by Dependabot on
# the following run. Action versions in those files are bumped in homelab-infra instead,
# and Dependabot cannot watch them there either: it only scans `.github/workflows/`, and
# in homelab-infra they are ordinary files under `terraform/`.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Etc/UTC
    # The agent has no per-run limit of its own, so this is sized to not withhold
    # proposals. It throttles how many sit open at once, not how many exist.
    open-pull-requests-limit: 10
    # The updater invokes npm with a 3-day minimum release age whether or not this is
    # set. Without it the checker still picks a younger version, which npm then refuses
    # to write, and the run fails with "No files were updated!".
    cooldown:
      default-days: 3
    # Dependabot proposes only DIRECT dependencies unless told otherwise; for npm the
    # indirect ones are lockfile-only changes and fold into the groups below.
    allow:
      - dependency-type: all
    # `forma-dsl` is excluded: the release that cuts a version writes that dependency into
    # the MCP server's manifest itself, so a proposal here would either duplicate it or
    # undo it.
    ignore:
      - dependency-name: forma-dsl
    # One group per project, so a PR title names what broke when one fails. Minor and
    # patch bumps arrive grouped; majors are deliberately NOT in any group, so they come
    # one PR each — which keeps a break attributable and is the signal release.yml bumps
    # the minor rather than the patch on. A dependency matching no group also arrives
    # alone, which is visible rather than silent.
    groups:
      library:
        patterns: ["manifold-3d", "typescript"]
        update-types: [minor, patch]
      mcp:
        patterns: ["@modelcontextprotocol/*", "zod"]
        update-types: [minor, patch]
      editor:
        patterns: ["@codemirror/*", "@lezer/*", "codemirror"]
        update-types: [minor, patch]
      # three and vite are shared by the editor and the landing page, and jsdom is what
      # the landing page's tests run in. One group, because a bump to any of them has to
      # be resolved in the one lockfile anyway.
      web:
        patterns: ["three", "vite", "jsdom"]
        update-types: [minor, patch]
      docs:
        patterns: ["marked"]
        update-types: [minor, patch]
      lint:
        patterns: ["eslint", "eslint-*", "@eslint/*", "globals", "typescript-eslint"]
        update-types: [minor, patch]
