# Managed by homelab-infra — terraform/github/mac-calendar-mcp/workflows/release.yml
# Edits made here in the target repo are overwritten by `just deploy github mac-calendar-mcp`.
#
# The action versions here are bumped by hand. Dependabot cannot watch this file: it only
# scans `.github/workflows/`, and in homelab-infra this is an ordinary file under
# `terraform/`, so `github-actions` is deliberately absent from dependabot.yml.
#
# One of the repo's two workflows, and its PR check (PR_CHECK_WORKFLOW). It verifies on
# every pull request and every push to main, and releases only for a `v*` tag. The agent
# cuts that tag once per sweep, so a batch of ten merges produces one release rather than
# ten. Keying the release on the tag is also what keeps the version commit from starting
# another release: it lands on main, and main does not release.
name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  # The agent starts this for a pull request whose head commit has no checks — a branch
  # opened before the check existed never gets one retroactively.
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, test and scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Job-level so the `if:` below can test them; a fork PR gets no secrets and skips.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

    steps:
      - name: Checkout repository
        # Full history: Sonar needs it for blame and new-code detection.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Pinned here and in package.json engines. Move both together, or the runtime
          # that ships is not the one tested.
          node-version: "24"
          cache: npm

      - name: Install from lockfile
        run: npm ci

      # Blocking: the agent merges with no human review, so nothing else catches drift.
      # It clears these itself with `npm run format` and `npm run lint:fix`.
      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      # The coverage threshold lives in jest.config.js, so no step here can drop it.
      # Writes coverage/lcov.info, which Sonar uploads — must run before Sonar.
      - name: Run tests with coverage
        run: npm test

      - name: Build
        run: npm run build

      # qualitygate.wait is what makes this block a merge. A missing project key skips
      # rather than fails, so check the step ran. SONAR_TOKEN must be in the Dependabot
      # store too, or it skips on exactly the PRs the gate exists for.
      #
      # Never on a tag. The scanner takes its branch name from the ref, so a tag run asks
      # SonarCloud about a branch called `v1.2.3` that has never existed, and the gate
      # lookup answers "Not authorized or project not found" — which reads as a bad token
      # and is not. The tag points at a commit main analysed moments earlier, so there is
      # nothing to re-analyse; without this the release job never runs.
      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_PROJECT_KEY != '' && github.ref_type != 'tag' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.sources=src
            -Dsonar.tests=test
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

  release:
    name: Publish the release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      # Checked out at the tag, which is the commit the version number describes.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # The tag is the source of the version, not package.json: they are written in the
      # same commit, and reading the tag means a mismatch cannot ship silently.
      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r .version package.json)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v${tag} does not match package.json ${pkg}"
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: mac-calendar-mcp ${{ github.ref_name }}
          generate_release_notes: true
          files: release/mac-calendar-mcp.zip
