# Managed by homelab-infra — terraform/github/jacred-tv-client/workflows/release.yml
# Edits made here in the target repo are overwritten by `just deploy github jacred-tv-client`.
#
# The action versions here are bumped by hand. Dependabot cannot watch this file: it only
# scans `.github/workflows/`, and in homelab-infra this is an ordinary file under
# `terraform/`, so `github-actions` is deliberately absent from dependabot.yml.
#
# One of the repo's two workflows, and its PR check (PR_CHECK_WORKFLOW). It verifies on
# every pull request and every push to main, and releases only for a `v*` tag. The agent
# cuts that tag once per sweep, so a batch of ten merges produces one release rather than
# ten. Keying the release on the tag is also what keeps the version commit from starting
# another release: it lands on main, and main does not release.
name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  # The agent starts this for a pull request whose head commit has no checks — a branch
  # opened before the check existed never gets one retroactively.
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        # The Android plugin refuses to start on an older JDK, and the module compiles
        # with source/target 17. The runner image already carries the Android SDK.
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The wrapper jar is committed, so confirm it is an official Gradle release before
      # this job executes it.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # From v6 the build cache is a separate component under Gradle's own terms of use
      # rather than the action's MIT licence; it loads only while caching is enabled.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Blocking, and the whole gate: the agent merges with no human review, and lint is
      # configured with abortOnError so it fails the build rather than filing a report
      # nobody opens. The app resolves no third-party artifacts, so there is nothing to
      # install first.
      - name: Assemble debug and release
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      # Not a release artifact — this is the build a reviewer can sideload onto the Mi Box
      # to check a pull request on a real screen before merging it.
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: jacred-tv-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Publish the release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      # Checked out at the tag, which is the commit the version number describes.
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/wrapper-validation@v6

      - uses: gradle/actions/setup-gradle@v6

      # The tag is the source of the version, not app/build.gradle: they are written in
      # the same commit, and reading the tag means a mismatch cannot ship silently.
      - name: Check the tag matches app/build.gradle
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -oE 'versionName +"[0-9]+\.[0-9]+\.[0-9]+"' app/build.gradle \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag v${tag} does not match versionName ${declared}"
            exit 1
          fi

      # Android replaces an installed app only when the new APK carries the same
      # signature, so every release has to be signed by one key that outlives the run.
      # A keystore generated here would be a new key each time and no release could
      # ever update another. The password and alias are in the clear because the
      # keystore file is the credential; a password beside it protects nothing.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty — apply the repo from homelab-infra"
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"

      - name: Assemble the signed release APK
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.store.file="${RUNNER_TEMP}/release.jks" \
            -Pandroid.injected.signing.store.password=jacred-tv \
            -Pandroid.injected.signing.key.alias=jacred \
            -Pandroid.injected.signing.key.password=jacred-tv

      # A gate that cannot fail is not a gate. Injected signing silently falls back to an
      # unsigned output if the properties do not apply, and an unsigned APK on a release
      # page looks identical until someone tries to install it.
      - name: Verify the APK is signed
        id: apk
        run: |
          set -euo pipefail
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::no APK was produced"
            exit 1
          fi
          case "$apk" in
            *unsigned*)
              echo "::error::release build produced an unsigned APK: ${apk}"
              exit 1
              ;;
          esac

          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "${build_tools}/apksigner" verify --print-certs "$apk"

          named="jacred-tv-${GITHUB_REF_NAME}.apk"
          mv "$apk" "$named"
          echo "path=${named}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: jacred-tv-client ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            Install it with:

            ```sh
            adb install -r ${{ steps.apk.outputs.path }}
            ```

            Settings has a **Check for updates** button, and the home screen offers
            later releases on its own — this file is the fallback for the first
            install.
