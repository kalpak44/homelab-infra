# Managed by homelab-infra — terraform/github/jacred-tv-client/dependabot.yml
# Edits made here in the target repo are overwritten by `just deploy github jacred-tv-client`.
#
# Opens the dependency PRs that ai-maintenance-agent.yml then reviews, repairs and merges.
# Daily at 05:00 UTC, an hour before that agent's daily sweep, so a proposal never waits
# more than an hour to be picked up.
#
# `github-actions` is deliberately absent. Every workflow this repo has is generated by
# homelab-infra (terraform/github/jacred-tv-client/workflows/), so an action bump merged
# here is reverted by the next `just deploy github jacred-tv-client` and then re-opened by
# Dependabot on the following run. Action versions in those files are bumped in
# homelab-infra instead, and Dependabot cannot watch them there either: it only scans
# `.github/workflows/`, and in homelab-infra they are ordinary files under `terraform/`.
#
# One entry, and it has very little to propose: the app declares no third-party
# dependencies, so the Android Gradle plugin in the root build.gradle is effectively the
# only thing here that has a version to move. That is reason to keep this file rather than
# drop it — a plugin major is exactly the change nobody notices going stale.
version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: daily
      time: "05:00"
      timezone: Etc/UTC
    # The agent has no per-run limit of its own, so this is sized to not withhold
    # proposals. It throttles how many sit open at once, not how many exist.
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    # A plugin major can change a default that fails lint or the build, and the agent is
    # expected to repair that on the PR branch. Keeping majors out of the group is what
    # makes such a break attributable to one bump, and is the signal the release step
    # bumps the minor rather than the patch on.
    groups:
      gradle-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
