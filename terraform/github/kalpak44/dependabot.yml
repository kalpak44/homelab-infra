# Managed by homelab-infra — terraform/github/kalpak44/dependabot.yml
# Edits made here in the target repo are overwritten by `just deploy github kalpak44`.
#
# Opens the dependency PRs that ai-pr-agent.yml then reviews, repairs and merges. The
# agent sweeps daily at 06:00 UTC, so these run at 05:00 to give it something to find on
# the same morning.
#
# One entry per manifest actually in the tree — a `directory` that holds no manifest is
# not an error Dependabot reports anywhere, it just silently never opens a PR:
#
#   /web-page-app          package.json + package-lock.json
#   /cv-pdf-generator      pom.xml
#   /web-page-app/docker   Dockerfile
#
# `github-actions` is deliberately absent. This repo's workflows are generated by
# homelab-infra (terraform/github/kalpak44/workflows/), so an action bump merged here is
# reverted by the next `just deploy github kalpak44` and then re-opened by Dependabot on
# the following run. Action versions in those files are bumped in homelab-infra instead.
# Dependabot cannot watch them there either: it only scans `.github/workflows/`, and in
# homelab-infra these are ordinary files under `terraform/`.
version: 2

updates:
  - package-ecosystem: npm
    directory: /web-page-app
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    # The agent merges sequentially — it waits for checks, merges one PR, confirms it
    # landed, then starts the next. A high limit here just lengthens that queue.
    open-pull-requests-limit: 5
    # Minor and patch bumps arrive as one PR per ecosystem, so the lockfile is resolved
    # once. Majors stay separate: they are the ones that actually break the build, and
    # the agent's review is worth more when it is looking at one of them at a time.
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: maven
    directory: /cv-pdf-generator
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /web-page-app/docker
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
