# Managed by homelab-infra — terraform/github/kalpak44/workflows/publish.yml
# Edits made here in the target repo are overwritten by `just deploy github kalpak44`.
#
# Builds and publishes this repo's site image, then tells the cluster to roll it out.
# Both of this repo's workflows are generated from that one directory, so it is the only
# place either is edited.
#
# Renaming this file means renaming it in homelab-infra too, in three places: the `apps`
# list in gitops/Justfile, which finds the last successful run here to read a tag from,
# the PR_CHECK_WORKFLOW variable in terraform/github/kalpak44, which the PR agent
# dispatches when a pull request has no checks, and the `paths` filters below.
#
# The repo holds two independent things, and the jobs below follow that split rather than
# interleaving them:
#
#   verify-pdf cv-pdf-generator Java 25 / Maven — renders the CV, runs the tests
#   verify-web web-page-app Node / Vite — formatting, lint, site build
#   publish-image needs both; the Dockerfile rebuilds from source
#   deployment need the image; hands off to the cluster
#
# verify-pdf and verify-web share nothing and run in parallel. The image build is the
# authoritative producer of what ships — its Dockerfile compiles the Java, runs the same
# tests and renders the same PDF from scratch, so the two verified jobs exist for fast,
# separately attributable failure signals, not because the image trusts their output.
name: Build, Publish, Deploy

on:
  push:
    branches:
      - main
    paths:
      - "cv-pdf-generator/**"
      - "web-page-app/**"
      - ".gitignore"
      - ".dockerignore"
      - ".github/workflows/publish.yml"
  pull_request:
    branches:
      - main
    paths:
      - "cv-pdf-generator/**"
      - "web-page-app/**"
      - ".gitignore"
      - ".dockerignore"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

# Least privilege by default; the one job that needs to write a package widens it itself.
permissions:
  contents: read

# Superseding a pull request's run is free. Superseding a push to main is not: that run
# ends in a cluster deployment, and cancelling it halfway leaves the image published but the
# manifest unbumped.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-pdf:
    name: Verify CV generator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cv-pdf-generator
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # java-version must stay >= the pom's maven.compiler.release, which the enforcer
      # checks — a lower JDK fails at `validate` with an explicit message rather than an
      # obscure compiler error. `cache: maven` caches the default ~/.m2, which is why no
      # -Dmaven.repo.local is passed here: the local npm script and the Dockerfile each
      # use their own repository path, and none of the three need to agree.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Enforcer (JDK floor, dependency convergence) plus the unit and integration tests.
      - name: Verify
        run: mvn -B --no-transfer-progress verify

      - name: Render the CV
        env:
          RESUME_DATA_DIR: data
        run: |
          mvn -B --no-transfer-progress exec:java \
            -Dexec.mainClass=online.pavelusanli.resume.ResumeApp \
            -Dexec.args="build target/resume.pdf"

      # A zero-byte or non-PDF output is the failure this guards: every step above can
      # succeed and still leave something unservable.
      - name: Check the rendered PDF
        run: |
          test -s target/resume.pdf
          head -c 5 target/resume.pdf | grep -q '^%PDF-'
          echo "Rendered $(wc -c < target/resume.pdf) bytes." >> "$GITHUB_STEP_SUMMARY"

      # Lets a reviewer open the actual rendered CV from the run, which is the only part
      # of this repo that a diff cannot show.
      - name: Upload the CV
        uses: actions/upload-artifact@v7
        with:
          name: resume-pdf
          path: cv-pdf-generator/target/resume.pdf
          if-no-files-found: error
          retention-days: 14

  verify-web:
    name: Verify web page
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-page-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-page-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      # Compiles and bundles the site. The CV is not built here on purpose — it is
      # verify-pdf's subject, and Vite copies public/ verbatim, so its absence changes
      # nothing this job is checking.
      - name: Build site
        run: npm run build

  publish-image:
    name: Publish image
    needs: [verify-pdf, verify-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.sha_short }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Exactly seven characters, no prefix: homelab-infra's `just bump-images` rewrites
      # the manifest to "${sha:0:7}", so any other shape points the cluster at a tag that
      # does not exist.
      - name: Derive the image tag
        id: vars
        run: echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.vars.outputs.sha_short }}

      # The Dockerfile rebuilds everything from source, so the layer cache is what keeps
      # that from being slow. Actions scopes type=gha to this repository.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web-page-app/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        run: |
          {
            echo "### Image published"
            echo
            echo "**Digest:** \`${{ steps.push.outputs.digest }}\`"
            echo "**Platforms:** \`linux/amd64\`"
            echo
            echo "| Tag |"
            echo "| :--- |"
            echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
              [ -n "$tag" ] && echo "| \`${tag}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: Scan image
    # REPORT-ONLY, and must stay that way: no --fail-on, no threshold. Sonar above is the
    # blocking gate. A threshold here would deadlock on unfixable base-image CVEs.
    needs: publish-image
    # Only a published image can be pulled, so a PR has nothing to scan.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # Pinned: an unpinned scanner changes the report without the image changing.
      SYFT_VERSION: v1.52.0
      GRYPE_VERSION: v0.119.0
    steps:
      # The package is private; syft and grype read the config this writes.
      - name: Log in to GHCR
        # Pinned to a commit SHA, not a tag: a tag can be moved onto different code.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Installers are fetched from the release tag, not `main`, and their checksums are
      # verified before anything executes. Piping a moving script straight into a shell
      # gives an upstream compromise a direct path onto the runner. The version and both
      # checksums are rewritten together by the weekly sweep that moves these pins.
      - name: Install syft and grype
        env:
          SYFT_INSTALLER_SHA256: ea054f8b6754db17d34129482ecda1ab733cadab57c1c9202bbe98eb5fe18d24
          GRYPE_INSTALLER_SHA256: 8646f06a90b10ca64992c1809b4aa00c44e30b4f551f63c309b0b0ab66873556
        run: |
          set -euo pipefail

          fetch_verified() {
            url="$1"; want="$2"; out="$3"
            curl --proto '=https' --tlsv1.2 -fsSL "$url" -o "$out"
            echo "${want}  ${out}" | sha256sum -c -
          }

          fetch_verified \
            "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            "$SYFT_INSTALLER_SHA256" syft-install.sh
          fetch_verified \
            "https://raw.githubusercontent.com/anchore/grype/${GRYPE_VERSION}/install.sh" \
            "$GRYPE_INSTALLER_SHA256" grype-install.sh

          sh syft-install.sh -b /usr/local/bin "${SYFT_VERSION}"
          sh grype-install.sh -b /usr/local/bin "${GRYPE_VERSION}"

          syft version
          grype version

      # grype scans the SBOM, not the image again, so the report and the SBOM cannot
      # disagree. --platform is explicit so the result does not depend on the runner.
      - name: Generate the SBOM and scan it
        id: scan
        run: |
          set -euo pipefail

          ref="${IMAGE}@${{ needs.publish-image.outputs.digest }}"
          echo "Scanning ${ref} (linux/amd64)"

          syft --platform linux/amd64 "registry:${ref}" -o json > sbom.json
          syft --platform linux/amd64 "registry:${ref}" -o spdx-json > sbom.spdx.json

          grype "sbom:sbom.json" -o json > grype.json
          grype "sbom:sbom.json" -o table > grype.txt

          echo "packages=$(jq '.artifacts | length' sbom.json)" >> "$GITHUB_OUTPUT"

      # All counts come from one pass over grype.json, so the totals cannot disagree.
      - name: Report to the run summary
        if: always()
        run: |
          set -euo pipefail

          if [ ! -f grype.json ]; then
            echo "### Image scan — did not run" >> "$GITHUB_STEP_SUMMARY"
            echo "syft or grype failed before producing a report; see the step log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          jq '[.matches[]
               | {id:       .vulnerability.id,
                  severity: .vulnerability.severity,
                  package:  .artifact.name,
                  version:  .artifact.version,
                  type:     .artifact.type,
                  state:    (.vulnerability.fix.state // "unknown"),
                  fixed_in: (.vulnerability.fix.versions // [])}]
              | unique_by([.id, .package, .version])' grype.json > findings.json

          count() { jq --arg s "$1" '[.[] | select(.severity == $s)] | length' findings.json; }
          crit=$(count Critical); high=$(count High); med=$(count Medium)
          low=$(count Low); neg=$(count Negligible); unk=$(count Unknown)
          total=$(jq 'length' findings.json)
          fixable=$(jq '[.[] | select(.state == "fixed" and (.fixed_in | length) > 0)] | length' findings.json)

          {
            echo "### Image scan — report only 🔍"
            echo
            echo "\`${IMAGE}:${{ needs.publish-image.outputs.tag }}\` · \`linux/amd64\` ·"
            echo "${{ steps.scan.outputs.packages }} packages · syft \`${SYFT_VERSION}\` · grype \`${GRYPE_VERSION}\`"
            echo
            echo "| Critical | High | Medium | Low | Negligible | Unknown | Total |"
            echo "| ---: | ---: | ---: | ---: | ---: | ---: | ---: |"
            echo "| ${crit} | ${high} | ${med} | ${low} | ${neg} | ${unk} | ${total} |"
            echo
            echo "${fixable} of ${total} have a fixed version published upstream. This job never"
            echo "blocks the rollout — it is a report."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Critical and High only: a table of hundreds of Low findings goes unread.
          if [ "$((crit + high))" -gt 0 ]; then
            {
              echo "#### Critical and High"
              echo
              echo "| Severity | Package | Version | Vulnerability | Fix |"
              echo "| :--- | :--- | :--- | :--- | :--- |"
              jq -r '[.[] | select(.severity == "Critical" or .severity == "High")]
                     | sort_by(.severity, .package, .id)[]
                     | "| \(.severity) | \(.package) | \(.version) | \(.id) | "
                       + (if .state == "fixed" and (.fixed_in | length) > 0
                          then (.fixed_in | join(", "))
                          else "_none upstream_" end)
                       + " |"' findings.json
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Critical or High findings." >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi

      # The summary is capped at 1 MB and unparseable; triage needs the files.
      - name: Upload the SBOM and scan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-scan-${{ needs.publish-image.outputs.tag }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            sbom.json
            sbom.spdx.json
            grype.json
            grype.txt

  deploy:
    name: Deploy to cluster
    # Gated on the image existing. publish-image is itself restricted to pushes on main,
    # so this inherits that restriction through `needs`. `scan` is listed for ordering
    # only — a scanner outage must not strand an image that published cleanly.
    needs: [publish-image, scan]
    if: always() && needs.publish-image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The image is in GHCR — point the cluster at it. Both inputs are required: this
      # workflow's own run is still in_progress here, so homelab-infra's "last successful
      # publish" query would resolve to the previous commit and deploy a stale image.
      #
      # `app` is the gitops directory name, which is not this repo's name — it is
      # personal-web-page. It must match the `apps` list in homelab-infra's
      # gitops/Justfile, or the dispatch fails with "no app named ... is tracked".
      - name: Trigger cluster deploy
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          TAG: ${{ needs.publish-image.outputs.tag }}
        run: |
          gh workflow run gitops-bump-images.yml \
            --repo kalpak44/homelab-infra \
            -f app=personal-web-page \
            -f sha="${GITHUB_SHA}"
          echo "Dispatched \`gitops-bump-images\` for \`personal-web-page\` @ \`${TAG}\`." >> "$GITHUB_STEP_SUMMARY"
