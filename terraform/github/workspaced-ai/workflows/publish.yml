# Managed by homelab-infra — terraform/github/workspaced-ai/workflows/publish.yml
# Edits made here in the target repo are overwritten by `just deploy github workspaced-ai`.
#
# One pipeline for every trigger: the API (format, build, test, coverage, SonarCloud), the
# web app (test, coverage, SonarCloud, type check, build) and the agent harness (build,
# smoke test) in parallel, then the images and the cluster rollout. Those last two are the
# only conditional parts — they run when the ref being built is main and never on a pull
# request, so a dependency bump is fully validated without pushing an image or touching
# the cluster.
#
# All three images are built on every run and share one tag, because the deploy points
# every image of this repository at the same tag and a missing one would never pull.
#
# This is also the workflow the AI maintenance agent gates on
# (PR_CHECK_WORKFLOW=publish.yml). It refuses to merge without a green check here, and it
# can dispatch this workflow on a PR branch whose head commit has no checks — hence
# workflow_dispatch.
#
# The `name:` below is matched verbatim by the agent workflow's `workflow_run.workflows`
# list, which takes no wildcard. Renaming this workflow without adding the new name there
# leaves the agent asleep through every failed pipeline.
#
# The action versions here are bumped by hand, in this file. `github-actions` is absent
# from dependabot.yml because a bump merged into a generated workflow is reverted by the
# next apply, and Dependabot cannot watch the generating copy either — it only scans
# `.github/workflows/`.
name: Verify, Publish, Scan

on:
  pull_request:
  push:
    branches: [ "main" ]
    # A sync of the generated agent files or a docs edit must not rebuild and redeploy.
    # On `push` only: a pull request whose check never runs is a pull request the agent
    # will not merge, because it requires a green one. publish.yml is deliberately absent
    # from the list, so a change to this file still builds and rescans.
    paths-ignore:
      - "README.md"
      - "docs/**"
      - ".github/dependabot.yml"
      - ".github/agent-prompts/**"
      - ".github/workflows/ai-maintenance-agent.yml"
  workflow_dispatch: {}

# Superseding a pull request's run is free. Superseding a push to main is not: that run
# ends in a cluster rollout, and cancelling it halfway leaves the image published but the
# manifest still pointing at the previous tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; the job that needs to write a package widens it itself.
permissions:
  contents: read

jobs:
  build:
    name: Build API
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # push the image to ghcr.io

    defaults:
      run:
        working-directory: apps/api

    env:
      # Job-level so the `if:` conditions below can test them. Secrets are not exposed
      # to pull_request runs from a fork, so on those the analysis step skips itself
      # rather than failing the check.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    outputs:
      tag: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout source
        # Full history: Sonar needs it for blame and new-code detection.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          # The pom is not at the repository root, where the cache looks by default.
          cache-dependency-path: apps/api/pom.xml

      # Maven comes with the runner image; the repository carries no wrapper.
      - name: Check formatting
        run: mvn -B fmt:check

      # The 80% line-coverage floor is a jacoco rule in the pom, so `verify` enforces it.
      - name: Build, test, coverage
        run: mvn -B verify

      - name: SonarCloud analysis
        # qualitygate.wait makes the gate an actual gate: a failing gate fails this
        # check, so a PR cannot be merged past it.
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=kalpak44 \
            -Dsonar.projectKey=workspaced-ai-api \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true

      - name: Log in to GHCR
        if: ${{ env.PUBLISH == 'true' }}
        # Pinned to the commit behind v4.6.0 — a tag can be moved, a SHA cannot.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `${GITHUB_SHA:0:7}` and not `git rev-parse --short=7 HEAD`: `--short=N` is a
      # minimum width, so git lengthens it once seven characters become ambiguous and the
      # tag shape would change under anything that looks an image up by it.
      - name: Derive the image tag
        if: ${{ env.PUBLISH == 'true' }}
        id: vars
        run: echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Buildpacks build the image from the jar `verify` produced; there is no Dockerfile.
      # `-no-fork` because a forked lifecycle would rerun the tests.
      - name: Build & push image to GHCR
        if: ${{ env.PUBLISH == 'true' }}
        # Contexts go through env, never interpolated into the script body.
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}-api
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          mvn -B -DskipTests package spring-boot:build-image-no-fork \
            -Dspring-boot.build-image.imageName="$GHCR_IMAGE:$IMAGE_TAG" \
            -Dspring-boot.build-image.tags="$GHCR_IMAGE:latest"
          docker push "$GHCR_IMAGE:$IMAGE_TAG"
          docker push "$GHCR_IMAGE:latest"

  web:
    name: Build web
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # push the image to ghcr.io

    defaults:
      run:
        working-directory: apps/web

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout source
        # Full history: Sonar needs it for blame and new-code detection.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          # The lockfile is not at the repository root, where the cache looks by default.
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The line floor is in vite.config.ts, so this step enforces it on its own.
      - name: Test, coverage
        run: npm test

      # A separate project from the API's, so a failing gate names which app broke.
      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: apps/web
          args: >
            -Dsonar.organization=kalpak44
            -Dsonar.projectKey=workspaced-ai-web
            -Dsonar.sources=src
            -Dsonar.tests=test
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

      # `tsc` runs before `vite build`, so a type error fails here and not in the browser.
      # The short SHA is the image tag too, so the version the UI shows names the image.
      - name: Type check and build
        run: VITE_APP_VERSION="${GITHUB_SHA:0:7}" npm run build

      - name: Log in to GHCR
        if: ${{ env.PUBLISH == 'true' }}
        # Pinned to the commit behind v4.6.0 — a tag can be moved, a SHA cannot.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same tag as the API image: the deploy moves both to it at once.
      - name: Build & push image to GHCR
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}-web
        run: |
          tag="${GITHUB_SHA:0:7}"
          docker build --platform linux/amd64 \
            -t "$GHCR_IMAGE:$tag" -t "$GHCR_IMAGE:latest" .
          docker push "$GHCR_IMAGE:$tag"
          docker push "$GHCR_IMAGE:latest"

  harness:
    name: Build harness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write # push the image to ghcr.io

    defaults:
      run:
        working-directory: apps/harness

    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --platform linux/amd64 -t harness:candidate .

      # Run as the workspace pod runs it: read-only root, a fresh home, no capabilities —
      # and no network, because a pod start must not depend on one. Each check is a
      # contract the API depends on, so a harness upgrade that breaks one fails here
      # rather than in a workspace. Every request is bounded, so a harness that stops
      # answering fails the step instead of holding the queue.
      - name: Smoke test
        timeout-minutes: 5
        run: |
          set -euo pipefail
          docker run -d --name harness --platform linux/amd64 --network none \
            --read-only --tmpfs /home/workspace:uid=1000,gid=1000 --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            -e OPENCODE_SERVER_PASSWORD=smoke \
            -e OPENROUTER_BASE_URL=https://openrouter.ai/api/v1 \
            harness:candidate

          # From inside the container: with no network there is no port to reach it on.
          api() { docker exec harness curl -sS --max-time 30 "$@"; }
          code() { api -o /dev/null -w '%{http_code}' "$@" || true; }

          echo "Waiting for the server"
          for _ in $(seq 1 30); do
            [ "$(code localhost:4096/session)" = 401 ] && break
            sleep 1
          done

          echo "Every route sits behind the password the API generates per workspace"
          test "$(code localhost:4096/session)" = 401

          echo "Only the workspace's own provider, so no reply silently runs elsewhere"
          providers=$(api -f -u opencode:smoke localhost:4096/config/providers \
            | jq -c '[.providers[].id]')
          test "$providers" = '["openrouter"]'

          echo "A session gets its directory on create and loses it on delete"
          dir=/home/workspace/sessions/smoke
          id=$(api -f -u opencode:smoke -X POST localhost:4096/session \
            -H "x-opencode-directory: $dir" -H 'Content-Type: application/json' -d '{}' \
            | jq -r .id)
          docker exec harness test -d "$dir"
          api -f -u opencode:smoke -X DELETE "localhost:4096/session/$id" \
            -H "x-opencode-directory: $dir"
          sleep 1
          if docker exec harness test -e "$dir"; then
            echo "::error::the session directory outlived its session"
            exit 1
          fi

      - name: Show the harness log
        if: failure()
        run: |
          docker logs harness || true
          docker exec harness cat /home/workspace/.local/share/opencode/log/opencode.log || true

      - name: Log in to GHCR
        if: ${{ env.PUBLISH == 'true' }}
        # Pinned to the commit behind v4.6.0 — a tag can be moved, a SHA cannot.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same tag as the API image: the deploy moves all three to it at once.
      - name: Push image to GHCR
        if: ${{ env.PUBLISH == 'true' }}
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}-harness
        run: |
          tag="${GITHUB_SHA:0:7}"
          docker tag harness:candidate "$GHCR_IMAGE:$tag"
          docker tag harness:candidate "$GHCR_IMAGE:latest"
          docker push "$GHCR_IMAGE:$tag"
          docker push "$GHCR_IMAGE:latest"

  scan:
    name: Scan image
    # REPORT-ONLY, and must stay that way: no --fail-on, no threshold. Sonar above is the
    # blocking gate. A threshold here would deadlock on unfixable base-image CVEs.
    needs: [build, web, harness]
    # Only a published image can be pulled, so a PR has nothing to scan.
    if: >-
      needs.build.outputs.tag != '' && needs.web.result == 'success' &&
      needs.harness.result == 'success'
    # One report per image; no scan waits on or fails another.
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, harness]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.app }}
      # Pinned: an unpinned scanner changes the report without the image changing.
      SYFT_VERSION: v1.55.0
      GRYPE_VERSION: v0.121.0
    steps:
      # The package is private; syft and grype read the config this writes.
      - name: Log in to GHCR
        # Pinned to a commit SHA, not a tag: a tag can be moved onto different code.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Installers are fetched from the release tag, not `main`, and their checksums are
      # verified before anything executes. Piping a moving script straight into a shell
      # gives an upstream compromise a direct path onto the runner. The version and both
      # checksums are rewritten together by the weekly sweep that moves these pins.
      - name: Install syft and grype
        env:
          SYFT_INSTALLER_SHA256: 787fe2aa12311f7dd8e1d9337dfc6e25f091396c958937293a2d3c0eca2ff8ce
          GRYPE_INSTALLER_SHA256: 4bc8e844d1ca0b74082cb51e1587d58c35150756954660db3d3078e57c81cbfd
        run: |
          set -euo pipefail

          fetch_verified() {
            url="$1"; want="$2"; out="$3"
            curl --proto '=https' --tlsv1.2 -fsSL "$url" -o "$out"
            echo "${want}  ${out}" | sha256sum -c -
          }

          fetch_verified \
            "https://raw.githubusercontent.com/anchore/syft/${SYFT_VERSION}/install.sh" \
            "$SYFT_INSTALLER_SHA256" syft-install.sh
          fetch_verified \
            "https://raw.githubusercontent.com/anchore/grype/${GRYPE_VERSION}/install.sh" \
            "$GRYPE_INSTALLER_SHA256" grype-install.sh

          sh syft-install.sh -b /usr/local/bin "${SYFT_VERSION}"
          sh grype-install.sh -b /usr/local/bin "${GRYPE_VERSION}"

          syft version
          grype version

      # grype scans the SBOM, not the image again, so the report and the SBOM cannot
      # disagree. --platform is explicit so the result does not depend on the runner.
      - name: Generate the SBOM and scan it
        id: scan
        run: |
          set -euo pipefail

          # Scanned by digest, never by tag: `latest` moves in this same run.
          digest=$(docker buildx imagetools inspect \
            "${IMAGE}:${{ needs.build.outputs.tag }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          if [ -z "$digest" ]; then
            echo "::error::could not resolve the digest for ${IMAGE}:${{ needs.build.outputs.tag }}"
            exit 1
          fi
          ref="${IMAGE}@${digest}"
          echo "Scanning ${ref} (linux/amd64)"

          syft --platform linux/amd64 "registry:${ref}" -o json > sbom.json
          syft --platform linux/amd64 "registry:${ref}" -o spdx-json > sbom.spdx.json

          grype "sbom:sbom.json" -o json > grype.json
          grype "sbom:sbom.json" -o table > grype.txt

          echo "packages=$(jq '.artifacts | length' sbom.json)" >> "$GITHUB_OUTPUT"

      # All counts come from one pass over grype.json, so the totals cannot disagree.
      - name: Report to the run summary
        if: always()
        run: |
          set -euo pipefail

          if [ ! -f grype.json ]; then
            echo "### Image scan — did not run" >> "$GITHUB_STEP_SUMMARY"
            echo "syft or grype failed before producing a report; see the step log." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          jq '[.matches[]
               | {id:       .vulnerability.id,
                  severity: .vulnerability.severity,
                  package:  .artifact.name,
                  version:  .artifact.version,
                  type:     .artifact.type,
                  state:    (.vulnerability.fix.state // "unknown"),
                  fixed_in: (.vulnerability.fix.versions // [])}]
              | unique_by([.id, .package, .version])' grype.json > findings.json

          count() { jq --arg s "$1" '[.[] | select(.severity == $s)] | length' findings.json; }
          crit=$(count Critical); high=$(count High); med=$(count Medium)
          low=$(count Low); neg=$(count Negligible); unk=$(count Unknown)
          total=$(jq 'length' findings.json)
          fixable=$(jq '[.[] | select(.state == "fixed" and (.fixed_in | length) > 0)] | length' findings.json)

          {
            echo "### Image scan — report only 🔍"
            echo
            echo "\`${IMAGE}:${{ needs.build.outputs.tag }}\` · \`linux/amd64\` ·"
            echo "${{ steps.scan.outputs.packages }} packages · syft \`${SYFT_VERSION}\` · grype \`${GRYPE_VERSION}\`"
            echo
            echo "| Critical | High | Medium | Low | Negligible | Unknown | Total |"
            echo "| ---: | ---: | ---: | ---: | ---: | ---: | ---: |"
            echo "| ${crit} | ${high} | ${med} | ${low} | ${neg} | ${unk} | ${total} |"
            echo
            echo "${fixable} of ${total} have a fixed version published upstream. This job never"
            echo "blocks the rollout — it is a report."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # Critical and High only: a table of hundreds of Low findings goes unread.
          if [ "$((crit + high))" -gt 0 ]; then
            {
              echo "#### Critical and High"
              echo
              echo "| Severity | Package | Version | Vulnerability | Fix |"
              echo "| :--- | :--- | :--- | :--- | :--- |"
              jq -r '[.[] | select(.severity == "Critical" or .severity == "High")]
                     | sort_by(.severity, .package, .id)[]
                     | "| \(.severity) | \(.package) | \(.version) | \(.id) | "
                       + (if .state == "fixed" and (.fixed_in | length) > 0
                          then (.fixed_in | join(", "))
                          else "_none upstream_" end)
                       + " |"' findings.json
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Critical or High findings." >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi

      # The summary is capped at 1 MB and unparseable; triage needs the files.
      - name: Upload the SBOM and scan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-scan-${{ matrix.app }}-${{ needs.build.outputs.tag }}
          if-no-files-found: ignore
          retention-days: 30
          path: |
            sbom.json
            sbom.spdx.json
            grype.json
            grype.txt

  deploy:
    name: Deploy to cluster
    # `scan` is listed for ordering only — a scanner outage must not strand an image
    # that published cleanly.
    needs: [build, web, harness, scan]
    # `tag` is set by a step that only runs when PUBLISH is true, so an empty tag means
    # no image was pushed. Keying the deploy off the artifact rather than repeating the
    # event/ref test means the two conditions cannot drift apart.
    if: >-
      always() && needs.build.result == 'success' && needs.web.result == 'success' &&
      needs.harness.result == 'success' && needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The image is in GHCR — point the cluster at it. Both inputs are required: this
      # workflow's own run is still in_progress here, so the deploy's "last successful
      # publish" query would resolve to the previous commit and roll out a stale image.
      #
      # `app` is the name the deploy looks this repository up by. It must match the list
      # that deploy keeps, or the dispatch fails with "no app named ... is tracked".
      #
      # A PAT, not GITHUB_TOKEN: the job's own token is scoped to this repository and
      # cannot dispatch a workflow in another one.
      - name: Trigger cluster deploy
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          gh workflow run gitops-bump-images.yml \
            --repo kalpak44/homelab-infra \
            -f app=workspaced-ai \
            -f sha="${GITHUB_SHA}"
          echo "Dispatched \`gitops-bump-images\` for \`workspaced-ai\` @ \`${TAG}\`." >> "$GITHUB_STEP_SUMMARY"
