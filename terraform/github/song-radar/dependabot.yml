# Managed by homelab-infra — terraform/github/song-radar/dependabot.yml
# Edits made here in the target repo are overwritten by `just deploy github song-radar`.
#
# Opens the dependency PRs that ai-maintenance-agent.yml then reviews, repairs and merges.
# The agent sweeps daily at 06:00 UTC, so this runs at 05:00 to give it something to find
# on the same morning.
#
# One entry per manifest actually in the tree — a `directory` that holds no manifest is
# not an error Dependabot reports anywhere; it just silently never opens a PR. Here that
# is `/` and its pom.xml and package.json. There is no `docker` entry because there is no
# Dockerfile: jib builds the image from the pom, so the base image is a Maven property and
# arrives through the maven entry.
#
# `github-actions` is deliberately absent. Every workflow this repo has is generated by
# homelab-infra (terraform/github/song-radar/workflows/), so an action bump merged here is
# reverted by the next `just deploy github song-radar` and then re-opened by Dependabot on
# the following run. Action versions in those files are bumped in homelab-infra instead.
# Dependabot cannot watch them there either: it only scans `.github/workflows/`, and in
# homelab-infra these are ordinary files under `terraform/`.
version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    # The agent has no per-run limit of its own, so this is sized to not withhold
    # proposals. It throttles how many sit open at once, not how many exist.
    open-pull-requests-limit: 10
    # Dependabot proposes only DIRECT dependencies unless told otherwise, and Maven's
    # transitive tree is where the convergence problems live. Spring Boot's BOM pins most
    # of that tree, so an indirect proposal here is usually something the BOM does not
    # manage — which is exactly the case worth seeing.
    allow:
      - dependency-type: all
    # Majors ARE proposed — `allow` above admits every update type, and nothing here
    # filters them out. What the group does is batch minor and patch into one PR; majors
    # stay one PR each, which is what makes a break attributable to a single package and
    # lets the agent repair it on that branch. Adding `major` to the group would not
    # "enable" anything, it would only merge them into the batch and lose that.
    groups:
      maven-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The Tailwind build. Separate from maven so a stylesheet bump that breaks the page is
  # attributable on its own, rather than arriving inside a ten-package Java PR.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Majors arrive on their own here too, for the same reason.
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
