# Managed by homelab-infra — terraform/github/plugin-noco-tools/workflows/publish.yml
# Edits made here in the target repo are overwritten by `just deploy github plugin-noco-tools`.
#
# The action versions here are bumped by hand. Dependabot cannot watch this file: it only
# scans `.github/workflows/`, and in homelab-infra this is an ordinary file under
# `terraform/`, so `github-actions` is deliberately absent from dependabot.yml.
#
# It was `site.yml` until 2026-09-08. That name distinguished the site from the plugin
# this repo also held, but commit 45b4977 on 2026-09-06 reduced the repo to the website
# alone, so the qualifier stopped distinguishing anything and the other publishing repos
# already call this `publish.yml`. The `site/**` path filter stays — the website itself
# still lives in that subdirectory.
#
# The four actions below are pinned to commit SHAs, not tags, so a retagged release
# cannot change this build under us (CWE-829). That pin used to be maintained by the
# `github-actions` Dependabot entry; now that this file is generated here, the SHAs are
# bumped by hand in homelab-infra — see the note in dependabot.yml.
name: Build, Publish, Deploy

# This is also the workflow the AI PR agent gates on (PR_CHECK_WORKFLOW=publish.yml). It
# refuses to merge without a green check, and it dispatches this workflow for a PR whose
# head commit has no checks — so `workflow_dispatch` is load-bearing.
#
# The `pull_request` trigger is what makes that gate real. Before it, PR_CHECK_WORKFLOW
# named `build.yml`, a file this repo has never had, and nothing here ran on a pull
# request at all — so a dependency PR never got a check and the agent could not merge it.
# Every Dependabot PR between 2026-08-20 and 2026-09-08 was closed rather than merged.
# The paths match the push trigger because the only manifest Dependabot watches here is
# site/Dockerfile, which is under site/**.
on:
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/publish.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/noco-tools-site

jobs:
  docker:
    name: Publish site image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      short-sha: ${{ steps.sha.outputs.short }}
      digest:    ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # `push` is false on a pull request, so the image is still built — which is the
      # actual check, a broken Dockerfile fails here — but nothing reaches the registry
      # from an unmerged branch.
      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: site
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:latest
          build-args: |
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Image report
        run: |
          {
            echo "## Site image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Image** | \`${{ env.IMAGE }}\` |"
            echo "| **Tag** | \`${{ steps.sha.outputs.short }}\` |"
            echo "| **Also tagged** | \`latest\` |"
            echo "| **Digest** | \`${{ steps.push.outputs.digest }}\` |"
            echo "| **Commit** | [\`${{ steps.sha.outputs.short }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) |"
            echo "| **Run** | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo ""
            echo "### Pull"
            echo '```'
            echo "docker pull ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}"
            echo '```'
            echo ""
            echo "### Run locally"
            echo '```'
            echo "docker run --rm -p 8080:80 ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to cluster
    # Gated on the image existing. `docker` runs on a push to main touching site/** and on
    # dispatch; both produce a real image at GITHUB_SHA, so both are worth deploying — the
    # sha is passed explicitly rather than looked up, which is what makes dispatch work.
    needs: docker
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Until this job existed the site image was published and then never rolled: the app
      # was not in homelab-infra's `apps` list at all, so neither the nightly sweep nor any
      # dispatch touched it, and its Deployment tag moved only by hand.
      #
      # `app` is the gitops directory name, which is neither this repo's name nor the
      # image's — it is noco-google-connector-site. It must match the `apps` list in
      # homelab-infra's gitops/Justfile, or the dispatch fails with "no app named ... is
      # tracked". A PAT, not GITHUB_TOKEN: the job's own token is scoped to this repo and
      # cannot dispatch a workflow in another one.
      - name: Trigger cluster deploy
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          TAG: ${{ needs.docker.outputs.short-sha }}
        run: |
          gh workflow run gitops-bump-images.yml \
            --repo kalpak44/homelab-infra \
            -f app=noco-google-connector-site \
            -f sha="${GITHUB_SHA}"
          echo "Dispatched \`gitops-bump-images\` for \`noco-google-connector-site\` @ \`${TAG}\`." >> "$GITHUB_STEP_SUMMARY"
