# Managed by homelab-infra — terraform/github/plugin-noco-tools/dependabot.yml
# Edits made here in the target repo are overwritten by `just deploy github plugin-noco-tools`.
#
# Opens the dependency PRs that ai-pr-agent.yml then reviews, repairs and merges. Daily
# at 05:00 UTC, an hour before that agent's daily sweep, so a proposal never waits more
# than an hour to be picked up.
#
# `github-actions` is deliberately absent. Every workflow this repo has is generated by
# homelab-infra (terraform/github/plugin-noco-tools/workflows/), so an action bump merged
# here is reverted by the next `just deploy github plugin-noco-tools` and then re-opened
# by Dependabot on the following run. Action versions in those files are bumped in
# homelab-infra instead, and Dependabot cannot watch them there either: it only scans
# `.github/workflows/`, and in homelab-infra they are ordinary files under `terraform/`.
#
# That absence has a cost worth naming here. site.yml pins its four actions to commit
# SHAs so a retagged release cannot change the build (CWE-829), and this file used to
# carry a `github-actions` entry precisely so those pins did not rot into unpatched
# dependencies. Now that site.yml and ai-pr-agent.yml are both generated in homelab-infra,
# that entry would propose a bump, the agent would merge it, and the next
# `just deploy github plugin-noco-tools` would revert it — then Dependabot would re-open
# it the next morning, for ever. The SHAs move by hand in homelab-infra instead.
#
# site/Dockerfile is the only other manifest in the tree; there is no package.json.
version: 2

updates:
  # site/Dockerfile builds the nginx image serving the public privacy policy and terms of
  # service. Those pages are a Google OAuth verification requirement, so the container
  # serving them stays maintained.
  - package-ecosystem: docker
    directory: /site
    schedule:
      interval: daily
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
