# Managed by homelab-infra — terraform/github/kubectl-awscli/workflows/release.yml
# Edits made here in the target repo are overwritten by `just deploy github kubectl-awscli`.
#
# One job, because every step needs the working tree the step before it produced, and
# because nothing may reach the registry until the whole chain has passed:
#
#   resolve upstream (AI)  ->  build  ->  smoke  ->  scan  ->  remediate  ->  rescan
#                                                                              |
#                            publish  <-  commit  <-  version  <-  policy  <---+
#
# Two entry points:
#
#   * weekly cron / manual dispatch — Codex CLI driving DeepSeek resolves the latest
#     upstream kubectl and Alpine releases and edits the pins in the Dockerfile.
#
#   * push to main — skips the agent; builds, scans, remediates and publishes.
#
# The build and the scan run on EVERY trigger, including quiet weeks where nothing
# moved. A week with no version change still refreshes the vulnerability report and
# the SARIF upload; it just does not publish.
#
# There is no version file. The Dockerfile IS the source of truth, and the release
# version is computed by this workflow (see SEMVER below) rather than chosen by the
# agent — the agent writes `## vNEXT` and step `version` resolves it.
#
# ---------------------------------------------------------------------------------
# SECURITY POLICY — when does an image get published?
# ---------------------------------------------------------------------------------
#
# Severities acted on: Critical and High. Everything else is reported only.
#
# A finding is FIXABLE when grype knows a fixed version exists (fix.state == fixed).
# It is UNFIXABLE when there is no upstream fix at all (not-fixed / wont-fix /
# unknown). A third case matters here and is reported separately: a fix exists
# upstream, but Alpine has not packaged it yet, so nothing this pipeline can do will
# reach it.
#
#   1. The candidate is built and NOT pushed. It must pass the compatibility contract
#      in `scripts/smoke` before anything else happens. A failing smoke test is a hard
#      stop — no publish, no remediation, no release.
#
#   2. If any Critical/High remains, remediation is attempted (see REMEDIATION). Each
#      attempt is built, smoke-tested and rescanned. An attempt is kept ONLY when it
#      leaves Criticals no higher AND Critical+High strictly lower, with every smoke
#      check still passing and no shipped tool's major version moved. Otherwise it is
#      reverted whole.
#
#   3. Publication is then decided against the image currently on :latest, rescanned
#      in this same run with this same grype database, so the comparison reflects the
#      change and not a week of database drift:
#
#        enforce (default) — BLOCK if the candidate has more Criticals, or more
#                            Critical+High, than the published image. Remaining
#                            findings that remediation could not reach do NOT block:
#                            refusing to publish would pin consumers to an older
#                            image carrying the same CVEs plus the ones already
#                            fixed, which is strictly worse.
#        strict            — additionally BLOCK while any FIXABLE Critical/High
#                            remains, whether or not it is reachable.
#        report-only       — never block. Break-glass, for shipping a rebuild while a
#                            scanner or feed problem is being sorted out.
#
#   4. Whatever remains is reported in the step summary, the release notes, the
#      uploaded SARIF and the `security-report` artifact, split into the three classes
#      above so "we could not fix this" is never confused with "we did not try".
#
# What is deliberately NOT done, because it trades a working image for a green
# scanner: pinning apk packages to exact versions, pulling from edge/testing, and
# pip-installing over the Python libraries that Alpine's aws-cli package owns. The
# three cryptography findings below are reachable only that last way, so they stay.
#
# ---------------------------------------------------------------------------------
# REMEDIATION — the levers, and what was measured
# ---------------------------------------------------------------------------------
#
# Measured on 2026-08-24 against the real images, amd64:
#
#   alpine 3.22 (then current)   8 Critical / 30 High
#   alpine 3.23                 10 Critical / 25 High   <- Criticals go UP
#   alpine 3.24                  2 Critical / 13 High   <- every smoke check passes
#
# Two things follow, and both are load-bearing:
#
#   * `apk upgrade --no-cache` is a NO-OP here and must not be re-added. The official
#     alpine:X.Y tag is rebuilt at the newest patch level and `apk add --no-cache`
#     already fetches current packages. It was measured: identical finding counts on
#     3.22 and on 3.24. It only adds a layer and an illusion of hardening.
#
#   * the base bump must NOT be a blind +1. Stepping 3.22 -> 3.23 makes the image
#     worse, and a remediation loop capped at one minor would propose it, measure the
#     regression, revert, and do the same thing again next week — stuck on 3.22 for
#     ever. So the search walks candidate tags NEWEST FIRST and takes the first one
#     that measurably improves. Jumping more than one release is safe here precisely
#     because every candidate is built, smoke-tested and rescanned before it is kept;
#     the evidence the one-step rule approximates is produced directly.
#
# The `check-versions` agent still climbs one minor per run — that is about deliberate,
# attributable tooling movement, and it is a different question from "this image has a
# Critical in it today".
#
# Levers, in the order the search, tries them:
#
#   1. kubectl -> the current stable release, when the pin is behind it
#   2. the Alpine tag -> the newest tag that improves, newest first
#   3. reverting an Alpine bump this very run made, if it made things worse and
#      nothing forward is better (never below the tag :latest was built from)
#   4. an AI round: Codex is shown what is left and may propose one more minimal
#      Dockerfile change, which goes through the identical accept-or-revert gate
#
# ---------------------------------------------------------------------------------
# SEMVER — how the version number is chosen
# ---------------------------------------------------------------------------------
#
# Computed in bash from what actually changed between the published image and the
# candidate, never from the agent's judgment:
#
#   BREAKING  a shipped tool's MAJOR moved, an apk package was dropped, or the
#             entrypoint / command / user / workdir changed
#   FEATURE   the Alpine minor moved, or a shipped tool's MINOR moved
#   FIX       anything else that changes the image — tool patch levels, package
#             revisions, or a security remediation
#
# Mapped to a component, honoring SemVer's pre-1.0 clause (§4: anything may change
# in 0.y.z, so a breaking change bumps the minor):
#
#            0.y.z      1.y.z and up
#   BREAKING minor      major
#   FEATURE  minor      minor
#   FIX      patch      patch
#
# Previous tool versions come from the io.homelab.tools.* labels the last release
# wrote onto :latest, so the comparison is against what was really published.
#
# NOTE: a push made with GITHUB_TOKEN does not trigger another workflow run, so the
# commit this job makes cannot be relied on to re-fire `on: push`. Everything,
# therefore, happens in this one run.
#
# DeepSeek serves the OpenAI Responses API directly, so Codex talks to it without a
# proxy in between.

name: Release

on:
  schedule:
    - cron: "0 5 * * 1" # 05:00 UTC every Monday
  workflow_dispatch:
    inputs:
      force_release:
        description: Build and publish even when no version changed
        type: boolean
        default: false
      security_policy:
        description: Publish policy for Critical/High findings
        type: choice
        default: enforce
        options:
          - enforce
          - strict
          - report-only
  push:
    branches: ["main"]

permissions:
  contents: write # commit the bump, create the release
  packages: write # push to GHCR
  security-events: write # upload the grype SARIF

# Never let two runs bump or publish the same repository at once.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/kalpak44/kubectl-awscli
  SYFT_VERSION: v1.29.1
  GRYPE_VERSION: v0.98.0
  # Each remediation attempt is a full build + smoke + scan. Four is enough to walk
  # from any supported Alpine tag to the newest one; the cap is reported when hit.
  REMEDIATION_MAX_ATTEMPTS: "4"

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEEPSEEK_APIKEY: ${{ secrets.DEEPSEEK_APIKEY }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
      SECURITY_POLICY: ${{ inputs.security_policy || 'enforce' }}
      REPO: ${{ github.repository }}

    steps:
      # =======================================================================
      # Setup
      # =======================================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # `main`, not github.sha — a scheduled run must see the tip of the branch.
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git identity
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record the starting commit
        # Everything downstream diffs against this. The agent only edits the working
        # tree, so HEAD stays put until the commit step nears the end.
        id: base
        run: |
          set -euo pipefail

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "alpine=$(grep -m1 -E '^FROM alpine:' Dockerfile | cut -d: -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          echo "kubectl=$(grep -m1 -E '^ARG KUBECTL_VERSION=' Dockerfile | cut -d= -f2 | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        # Early, because the policy step has to pull and rescan the image currently on
        # :latest. Nothing is pushed until the publication gate has passed.
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install syft and grype
        run: |
          set -euo pipefail

          curl -fsSL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          curl -fsSL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin "${GRYPE_VERSION}"

          syft version
          grype version

      - name: Write the scan helpers
        # Sourced by every step that scans, so "Critical/High" means one thing in this
        # workflow and the classification is written once.
        run: |
          set -euo pipefail

          mkdir -p /tmp/sec

          cat > /tmp/sec/lib.sh <<'LIB'
          # scan <image-ref> <prefix> — writes <prefix>.sbom.json, .grype.json,
          # .grype.sarif, .grype.txt and .ch.json (the normalised Critical/High set).
          scan() {
            syft "$1" -o json > "$2.sbom.json"
            grype "sbom:$2.sbom.json" \
              -o "json=$2.grype.json" \
              -o "sarif=$2.grype.sarif" \
              -o "table=$2.grype.txt"

            jq '[.matches[]
                 | select(.vulnerability.severity == "Critical"
                       or .vulnerability.severity == "High")
                 | {id:        .vulnerability.id,
                    severity:  .vulnerability.severity,
                    package:   .artifact.name,
                    version:   .artifact.version,
                    ecosystem: .artifact.type,
                    state:     (.vulnerability.fix.state // "unknown"),
                    fixed_in:  (.vulnerability.fix.versions // [])}]
                | unique_by([.id, .package, .version])
                | sort_by(.severity, .package, .id)' "$2.grype.json" > "$2.ch.json"
          }

          n_crit()    { jq '[.[] | select(.severity == "Critical")] | length' "$1"; }
          n_high()    { jq '[.[] | select(.severity == "High")]     | length' "$1"; }
          n_total()   { jq 'length' "$1"; }
          n_fixable() { jq '[.[] | select(.state == "fixed" and (.fixed_in | length) > 0)] | length' "$1"; }

          # A one-line score used for logging and for the accept/reject decision.
          score() { printf '%s Critical / %s High (%s fixable)' \
                      "$(n_crit "$1")" "$(n_high "$1")" "$(n_fixable "$1")"; }

          # Keep a remediation only if it does not trade Criticals for Highs.
          improves() { # $1 = candidate ch.json, $2 = incumbent ch.json
            local cc ch ic ih
            cc=$(n_crit "$1"); ch=$(n_high "$1")
            ic=$(n_crit "$2"); ih=$(n_high "$2")
            [ "$cc" -le "$ic" ] && [ $((cc + ch)) -lt $((ic + ih)) ]
          }

          # Markdown table of a ch.json, split by what can actually be done about it.
          md_findings() {
            jq -r '
              def cls:
                if .state == "fixed" and (.fixed_in | length) > 0
                then "fix available upstream"
                else "no upstream fix" end;
              if length == 0 then "_None._"
              else
                (["| severity | id | package | installed | fixed in | status |",
                  "|---|---|---|---|---|---|"] +
                 (map("| \(.severity) | \(.id) | \(.package) | \(.version) | "
                    + "\((.fixed_in | if length == 0 then ["—"] else . end) | join(", "))"
                    + " | \(cls) |"))) | .[]
              end' "$1"
          }

          # Findings that were in the published image and are gone from the candidate:
          # what this release actually fixed. Keyed on id+package, so the same CVE
          # against two packages counts once per package.
          resolved() { # $1 = published ch.json, $2 = candidate ch.json
            jq -n --slurpfile was "$1" --slurpfile now "$2" '
              ($now[0] | map("\(.id)@\(.package)")) as $n
              | $was[0] | map(select(("\(.id)@\(.package)") as $k | ($n | index($k)) | not))'
          }

          # One bullet per package, with the ids it no longer carries.
          md_resolved() {
            jq -r '
              if length == 0 then "_Nothing newly resolved._"
              else
                group_by(.package)
                | map("- **\(.[0].package)** \(.[0].version) — "
                    + (group_by(.severity) | map("\(length) \(.[0].severity)") | join(", "))
                    + ": " + (map(.id) | unique | join(", ")))
                | .[]
              end' "$1"
          }

          # The tooling inventory as a markdown table.
          md_tools() { # $1 = name<TAB>version file
            printf '| tool | version |\n|------|---------|\n'
            awk -F'\t' '{ printf "| %s | %s |\n", $1, ($2 == "" ? "—" : $2) }' "$1"
          }

          major() { printf '%s\n' "${1#v}" | cut -d. -f1; }
          minor() { printf '%s\n' "${1#v}" | cut -d. -f2; }
          LIB

          cat > /tmp/sec/probe.sh <<'PROBE'
          # probe <image> — prints the versions of every tool this image promises to
          # ship, as `name=version` lines. Used for the stability guard and for the
          # SemVer decision.
          probe() {
            local img="$1" k a
            k=$(docker run --rm --entrypoint sh "$img" -c 'kubectl version --client=true -o json' \
                | jq -r '.clientVersion.gitVersion')
            a=$(docker run --rm --entrypoint sh "$img" -c 'aws --version 2>&1' \
                | head -1 | awk '{print $1}' | cut -d/ -f2)
            printf 'kubectl=%s\nawscli=%s\n' "$k" "$a"
          }

          # inventory <image> — every tool this image ships and its version, as
          # `name<TAB>version` lines. Reported at release time so the changelog, the
          # release notes and the run summary all state what actually went out.
          inventory() {
            docker run --rm -i --entrypoint sh "$1" -s <<'INV'
          v() { printf '%s\t%s\n' "$1" "$2"; }
                    v alpine          "$(cat /etc/alpine-release 2>/dev/null)"
            v kubectl         "$(kubectl version --client=true -o json 2>/dev/null | grep -o '"gitVersion": *"[^"]*"' | head -1 | cut -d'"' -f4)"
            v aws-cli         "$(aws --version 2>&1 | head -1 | awk '{print $1}' | cut -d/ -f2)"
            v bash            "$(bash --version 2>/dev/null | head -1 | awk '{print $4}' | cut -d'(' -f1)"
            v curl            "$(curl --version 2>/dev/null | head -1 | awk '{print $2}')"
            v jq              "$(jq --version 2>/dev/null | sed 's/^jq-//')"
            v python3         "$(python3 --version 2>&1 | awk '{print $2}')"
          apkv() { apk list -I "$1" 2>/dev/null | head -1 | awk '{print $1}' | sed "s/^$1-//"; }
          v musl            "$(apkv musl)"
          v openssl         "$(apkv libssl3)"
          v ca-certificates "$(apkv ca-certificates)"
          INV
          }
          PROBE

      - name: Write the compatibility contract
        # The smoke suite. This is the definition of "did not break the utilities":
        # every remediation and every publish must leave all of it passing. It goes on
        # disk rather than inline so the remediation loop can re-run it per attempt.
        run: |
          set -euo pipefail

          cat > /tmp/sec/smoke.sh <<'SMOKE'
          #!/usr/bin/env bash
          set -uo pipefail

          IMG="${1:?usage: smoke.sh <image>}"
          FAILED=0

          pass() { printf '  ok    %-40s %s\n' "$1" "$(printf '%s' "${2-}" | head -1 | cut -c1-64)"; }
          fail() { printf '  FAIL  %-40s %s\n' "$1" "$(printf '%s' "${2-}" | head -3 | tr '\n' ' ' | cut -c1-160)"; FAILED=1; }

          # Output is captured before it is inspected: piping a command straight into
          # grep under `set -o pipefail` reports the command's status, not the match.
          check() {
            local what="$1"; shift
            local out status
            out=$("$@" 2>&1); status=$?
            if [ "$status" -eq 0 ]; then pass "$what" "$out"; else fail "$what" "$out"; fi
          }

          # The image's real ENTRYPOINT is ["/bin/bash", "-lc"], so passing a command
          # string exercises the entrypoint at the same time as the tool.
          run() { docker run --rm "$IMG" "$@"; }

          echo "smoke: $IMG"

          check "kubectl runs"              run 'kubectl version --client=true'
          check "aws runs"                  run 'aws --version'
          check "jq runs"                   run 'jq --version'
          check "curl runs"                 run 'curl --version'
          check "bash runs"                 run 'bash --version'
          check "default CMD works"         docker run --rm "$IMG"
          check "kubectl+jq pipeline"       run 'kubectl config view -o json | jq -e .kind >/dev/null && echo piped-ok'
          check "runs as uid 1000"          run '[ "$(id -u)" = 1000 ] && echo uid-1000'
          check "TLS trust store works"     run 'curl -fsS -o /dev/null https://dl.k8s.io/release/stable.txt && echo tls-ok'
          check "kubectl reports errors"    run 'kubectl get pods --context=nope 2>&1 | grep -q . && echo errors-ok'

          # aws-cli on Alpine is the Python build and vendors botocore inside the
          # `awscli` package rather than shipping it as a top-level module. Importing
          # the real names is what proves a package-level remediation did not quietly
          # gut the CLI, and compiling the JMESPath expression proves --query still
          # works, which is the thing py3-jmespath is actually needed for.
          out=$(docker run --rm -i --entrypoint python3 "$IMG" - <<'PY' 2>&1
          import awscli, awscli.botocore, jmespath, urllib3, cryptography
          jmespath.compile("reverse(sort_by(Contents || `[]`, &LastModified))[].Key")
          print("py-ok", awscli.__version__, "jmespath", jmespath.__version__)
          PY
          )
          if [ $? -eq 0 ]; then pass "aws python deps + JMESPath" "$out"; else fail "aws python deps + JMESPath" "$out"; fi

          exit "$FAILED"
          SMOKE

          chmod +x /tmp/sec/smoke.sh

      # =======================================================================
      # 1. Resolve upstream versions (AI), then gate what it did
      # =======================================================================

      - name: Setup Node.js
        if: github.event_name != 'push'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Codex CLI
        if: github.event_name != 'push'
        run: npm install -g @openai/codex

      - name: Point Codex at DeepSeek
        if: github.event_name != 'push'
        run: |
          set -euo pipefail

          if [ -z "${DEEPSEEK_APIKEY:-}" ]; then
            echo "DEEPSEEK_APIKEY is empty — is it configured in the required secret store?" >&2
            exit 1
          fi

          mkdir -p ~/.codex

          cat > ~/.codex/config.toml <<EOF
          model = "${DEEPSEEK_MODEL}"
          model_provider = "deepseek"

          [model_providers.deepseek]
          name = "DeepSeek"
          base_url = "https://api.deepseek.com/v1"
          env_key = "DEEPSEEK_APIKEY"
          wire_api = "responses"
          EOF

      - name: Smoke-test the model
        # One cheap call so credential/model/API issues fail immediately instead of
        # halfway through a bump.
        if: github.event_name != 'push'
        run: |
          set -euo pipefail

          CODE=$(curl -sS -o /tmp/smoke.json -w '%{http_code}' \
            https://api.deepseek.com/v1/responses \
            -H "Authorization: Bearer $DEEPSEEK_APIKEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"${DEEPSEEK_MODEL}\",\"input\":\"reply with the single word: ok\"}")

          echo "HTTP $CODE"

          if [ "$CODE" != "200" ]; then
            head -c 500 /tmp/smoke.json
            echo
            exit 1
          fi

      - name: Run the version agent
        if: github.event_name != 'push'
        run: |
          set -euo pipefail

          cat > /tmp/prompt.md <<'AGENT_PROMPT'
          You are the release agent for this container image repository.

          `git`, `docker`, `curl`, `jq` and the `gh` CLI are installed and authenticated.

          Your job is to decide whether this image should be rebuilt against newer
          upstream tooling and, if so, to make that change in the Dockerfile itself.

          You do NOT tag, push, publish or release anything, and you do NOT commit.
          Later steps in this same workflow run do all of that. You only edit files.

          You also do NOT choose the release version number. Later steps compute it
          from what actually changed. Write the literal placeholder `vNEXT` where the
          version goes and they will substitute it.

          ----------------------------------------------------------------------
          WHERE THE VERSIONS LIVE
          ----------------------------------------------------------------------

          There is no versions file. The Dockerfile is the source of truth. Read it
          before you do anything else:

            cat Dockerfile

          It contains exactly two pins:

            FROM alpine:<tag>              — the base image
            ARG KUBECTL_VERSION=<version>  — kubectl, fetched from dl.k8s.io at build

          aws-cli is installed from the Alpine package repository and is deliberately
          NOT pinned: an exact apk pin breaks the moment Alpine drops the old package.
          Its version follows the Alpine release. Do not add a pin for it.

          ----------------------------------------------------------------------
          THE ONE RULE THAT MATTERS: NEVER GUESS
          ----------------------------------------------------------------------

          Every version you write into the Dockerfile must come from a command you
          actually ran in this session and whose output you actually read.

          Not from memory. Not from what looks plausible. Not from a pattern like
          "the next minor after this one probably exists". Run the command, read the
          output, use that exact string.

          If a lookup fails, times out, or returns something you did not expect:
          change nothing, and report the failure. A skipped week is completely
          harmless. A wrong version is not.

          Later steps re-verify every pin you write against upstream and fail the run
          if it does not resolve. You cannot smuggle a guess past them, so do not try.

          ----------------------------------------------------------------------
          1. RESOLVE kubectl
          ----------------------------------------------------------------------

          The current stable release is published as plain text:

            curl -fsSL https://dl.k8s.io/release/stable.txt

          Use that value verbatim, including its leading `v`.

          Then confirm the binary for it actually exists before using it:

            curl -fsIL -o /dev/null -w '%{http_code}\n' \
              "https://dl.k8s.io/release/<VERSION>/bin/linux/amd64/kubectl"

          That must print 200.

          ----------------------------------------------------------------------
          2. RESOLVE ALPINE
          ----------------------------------------------------------------------

          List the available 3.x tags and take the highest:

            curl -fsSL 'https://hub.docker.com/v2/repositories/library/alpine/tags?page_size=100' \
              | jq -r '.results[].name' | grep -E '^3\.[0-9]+$' | sort -V | tail -1

          Then confirm the tag really exists in the registry:

            docker manifest inspect alpine:<TAG> > /dev/null && echo ok

          Move ALPINE forward by at most ONE minor release per run (3.20 to 3.21,
          never 3.20 straight to 3.24). Stepping one release at a time keeps any
          regression attributable to a single change, and next week's run continues
          the climb.

          Never move backwards. Never use `edge`, `latest`, or a release candidate.

          A later step in this run scans the built image for CVEs and is allowed to
          move the base further than you did if it measures that doing so removes
          Critical or High findings. That is deliberate and it is not your job. Do not
          try to pre-empt it, and do not reason about CVEs at all — resolve versions.

          ----------------------------------------------------------------------
          3. DECIDE WHETHER ANYTHING CHANGED
          ----------------------------------------------------------------------

          Compare each resolved version against what the Dockerfile currently pins.

          If NEITHER would change:

            - change NOTHING
            - do not touch the Dockerfile
            - do not touch CHANGELOG.md
            - report that the image is already current, and stop

          Leaving the files untouched is how you signal "no version bump". A later
          step detects it by diffing the working tree. The image is still rebuilt,
          scanned and reported on; it just is not republished.

          ----------------------------------------------------------------------
          4. EDIT THE DOCKERFILE
          ----------------------------------------------------------------------

          Change ONLY the pinned values. Do not reformat, reorder, restructure,
          "improve" or otherwise rewrite the Dockerfile. Do not add or remove
          packages, stages, users, entrypoints or commands. A reviewer reading your
          diff should see one or two changed values and nothing else.

          Never add `apk upgrade`. It has been measured on this image and does
          nothing: the official alpine:X.Y tag already carries the newest patch level
          and `apk add --no-cache` already fetches current packages.

          The single exception: if a version bump genuinely requires a corresponding
          Dockerfile change to keep building — an Alpine release renames a package,
          drops one, or moves it between repositories — then make that change too,
          keep it as small as possible, and explain it in the changelog prose.

          Do not assume such a change is needed. Find out. Check whether the packages
          the Dockerfile installs actually resolve in the new Alpine before deciding:

            docker run --rm alpine:<NEW_TAG> \
              sh -c 'apk add --no-cache --simulate bash ca-certificates curl jq aws-cli'

          Read what that prints. It also tells you which aws-cli version the new
          Alpine ships, which is useful for the changelog.

          ----------------------------------------------------------------------
          5. PROVE IT BUILDS
          ----------------------------------------------------------------------

          You must build the image yourself before you are done:

            docker build -t candidate:local .

          Then confirm the tools in it actually run:

            docker run --rm --entrypoint sh candidate:local \
              -c 'kubectl version --client=true && aws --version'

          If the build fails, or a tool does not run, do not leave the repository in
          a broken state. Either fix the cause — if the fix is small, obvious and
          clearly caused by the bump — or revert your edits with `git checkout --`
          and report that the bump is not currently viable.

          Never leave a state you have not built. A later step builds it again, runs a
          much larger compatibility suite against it, and will fail the run — but that
          is a backstop, not your excuse to skip this.

          ----------------------------------------------------------------------
          6. WRITE THE CHANGELOG ENTRY
          ----------------------------------------------------------------------

          Read the current newest version for context:

            head -20 CHANGELOG.md

          Prepend a new section directly beneath the file's `# Changelog` title and
          above the previous entry, in exactly this shape:

            ## vNEXT — <YYYY-MM-DD>

            | tool | from | to |
            |------|------|----|
            | kubectl | v1.36.4 | v1.36.5 |
            | alpine | 3.20 | 3.21 |

            <one short paragraph of prose>

          Write `vNEXT` literally. Do NOT invent a version number — the workflow
          computes it from what changed and substitutes it for you. A heading with a
          real number in it where `vNEXT` belongs will fail the run.

          Get the date from the environment — `date -u +%F` — never from memory.

          The table is the machine-readable part: one row per value you actually
          changed, and nothing else.

          The prose is the human part. In two to four sentences, say what moved and
          why someone pulling this image would care. Mention notable kubectl changes
          when the minor version moved, and note that aws-cli follows Alpine when the
          base image moved. Be concrete and factual.

          Do not pad it. Do not speculate about changes you have not verified. If you
          have nothing substantive to add beyond the table, one sentence is right.

          ----------------------------------------------------------------------
          HARD RULES
          ----------------------------------------------------------------------

          These override everything else.

          - NEVER write a version you did not obtain from a command you ran.
          - NEVER move a version backwards.
          - NEVER move Alpine more than one minor release in a single run.
          - NEVER write a release version number; the heading is `## vNEXT`.
          - NEVER add `apk upgrade` to the Dockerfile.
          - NEVER add a version number to an apk package name.
          - Edit ONLY Dockerfile and CHANGELOG.md.
          - NEVER edit anything under .github/ — that directory is managed by the
            homelab-infra repository and your changes there would be overwritten.
          - NEVER run git commit, git push, git tag, docker push, or gh release.
          - NEVER restructure the Dockerfile; change pinned values only.
          - NEVER leave the working tree in a state you have not successfully built.
          - If any upstream lookup fails, change nothing and report it.

          ----------------------------------------------------------------------
          FINAL OUTPUT
          ----------------------------------------------------------------------

          One line per tool you considered:

            <tool> — <old> -> <new> — <changed|already current>

          Then one final line:

            RESULT: <bumped|no change>
          AGENT_PROMPT

          codex exec \
            --skip-git-repo-check \
            --sandbox danger-full-access \
            --output-last-message /tmp/version-agent.md \
            "$(cat /tmp/prompt.md)"

      - name: Gate — the agent stayed in scope
        run: |
          set -euo pipefail

          # No exclusions on purpose: every scratch file this job writes goes to
          # /tmp, so anything showing up here came from the agent.
          CHANGED=$(git status --porcelain | awk '{print $NF}')

          if [ -z "$CHANGED" ]; then
            echo "No files changed."
            exit 0
          fi

          echo "Agent changed:"
          echo "$CHANGED"

          UNEXPECTED=$(echo "$CHANGED" | grep -vE '^(Dockerfile|CHANGELOG\.md)$' || true)

          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Agent modified files outside its allowed scope:"
            echo "$UNEXPECTED"
            exit 1
          fi

          if ! git diff --quiet -- Dockerfile; then
            if ! grep -qE '^## vNEXT' CHANGELOG.md; then
              echo "::error::Dockerfile changed but CHANGELOG.md has no '## vNEXT' heading."
              exit 1
            fi
          fi

      - name: Gate — every pin resolves upstream
        # The strongest guard against a hallucinated version: re-resolve each pin
        # independently of the agent and refuse anything that does not exist.
        run: |
          set -euo pipefail

          ALPINE=$(grep -m1 -E '^FROM alpine:' Dockerfile | cut -d: -f2 | tr -d '[:space:]')
          KUBECTL=$(grep -m1 -E '^ARG KUBECTL_VERSION=' Dockerfile | cut -d= -f2 | tr -d '[:space:]')

          echo "Dockerfile pins: alpine=${ALPINE} kubectl=${KUBECTL}"

          if [ -z "$ALPINE" ] || [ -z "$KUBECTL" ]; then
            echo "::error::Could not read both pins out of the Dockerfile."
            exit 1
          fi

          if ! echo "$ALPINE" | grep -qE '^3\.[0-9]+$'; then
            echo "::error::Refusing alpine tag '${ALPINE}' — expected a 3.x release tag."
            exit 1
          fi

          if ! echo "$KUBECTL" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing kubectl version '${KUBECTL}' — expected vX.Y.Z."
            exit 1
          fi

          if ! docker manifest inspect "alpine:${ALPINE}" > /dev/null 2>&1; then
            echo "::error::alpine:${ALPINE} does not exist in the registry."
            exit 1
          fi

          CODE=$(curl -fsIL -o /dev/null -w '%{http_code}' \
            "https://dl.k8s.io/release/${KUBECTL}/bin/linux/amd64/kubectl" || true)

          if [ "$CODE" != "200" ]; then
            echo "::error::kubectl ${KUBECTL} is not downloadable from dl.k8s.io (HTTP ${CODE})."
            exit 1
          fi

          # No apk package name may carry a version number. An `=version` pin breaks
          # the moment Alpine drops that package.
          if grep -nE '^[[:space:]]+[a-z0-9][a-z0-9._+-]*=[0-9]' Dockerfile; then
            echo "::error::An apk package is pinned to an exact version."
            exit 1
          fi

          # Neither pin may move backwards relative to where this run started.
          OLD_ALPINE="${{ steps.base.outputs.alpine }}"
          OLD_KUBECTL="${{ steps.base.outputs.kubectl }}"

          if [ "$(printf '%s\n%s\n' "$OLD_ALPINE" "$ALPINE" | sort -V | head -1)" != "$OLD_ALPINE" ]; then
            echo "::error::alpine moved backwards: ${OLD_ALPINE} -> ${ALPINE}"
            exit 1
          fi

          if [ "$(printf '%s\n%s\n' "$OLD_KUBECTL" "$KUBECTL" | sort -V | head -1)" != "$OLD_KUBECTL" ]; then
            echo "::error::kubectl moved backwards: ${OLD_KUBECTL} -> ${KUBECTL}"
            exit 1
          fi

          echo "Both pins verified."

      # =======================================================================
      # 2. Build the candidate — and do not publish it
      # =======================================================================

      - name: Build the candidate image
        # --no-cache so apk really re-resolves: a cached layer would hand the scanner
        # last week's packages and make the whole exercise meaningless. The gha cache
        # is written, not read, so the multi-arch push at the end reuses these exact
        # amd64 layers and publishes the bytes that were scanned.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          no-cache: true
          tags: candidate:local
          cache-to: type=gha,mode=max

      - name: Gate — the candidate honours the compatibility contract
        run: /tmp/sec/smoke.sh candidate:local

      - name: Scan the candidate
        id: scan
        run: |
          set -euo pipefail
          source /tmp/sec/lib.sh

          scan candidate:local /tmp/sec/candidate

          echo "candidate: $(score /tmp/sec/candidate.ch.json)"
          md_findings /tmp/sec/candidate.ch.json

          {
            echo "crit=$(n_crit /tmp/sec/candidate.ch.json)"
            echo "high=$(n_high /tmp/sec/candidate.ch.json)"
            echo "fixable=$(n_fixable /tmp/sec/candidate.ch.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Scan the image currently on :latest
        # Rescanned here, in this run, with this grype database. Comparing against a
        # count recorded a week ago would report database growth as a regression.
        id: published
        run: |
          set -euo pipefail
          source /tmp/sec/lib.sh

          if ! docker pull -q "${IMAGE}:latest" > /dev/null 2>&1; then
            echo "No published :latest yet — nothing to compare against."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          scan "${IMAGE}:latest" /tmp/sec/published

          echo "published: $(score /tmp/sec/published.ch.json)"

          {
            echo "exists=true"
            echo "crit=$(n_crit /tmp/sec/published.ch.json)"
            echo "high=$(n_high /tmp/sec/published.ch.json)"
            echo "fixable=$(n_fixable /tmp/sec/published.ch.json)"
          } >> "$GITHUB_OUTPUT"

          # The labels the previous release wrote are how the SemVer step knows what
          # was actually shipped last time.
          docker inspect --format '{{json .Config.Labels}}' "${IMAGE}:latest" \
            > /tmp/sec/published-labels.json || echo '{}' > /tmp/sec/published-labels.json

      # =======================================================================
      # 3. Remediate Critical/High — mechanically, then with one AI round
      # =======================================================================

      - name: Remediate Critical/High findings
        id: remediate
        run: |
          set -euo pipefail
          source /tmp/sec/lib.sh
          source /tmp/sec/probe.sh

          applied=false
          attempts=0
          truncated=false
          : > /tmp/sec/remediation-log.md

          note() { echo "$*" | tee -a /tmp/sec/remediation-log.md; }

          CUR_ALPINE=$(grep -m1 -E '^FROM alpine:' Dockerfile | cut -d: -f2 | tr -d '[:space:]')
          CUR_KUBECTL=$(grep -m1 -E '^ARG KUBECTL_VERSION=' Dockerfile | cut -d= -f2 | tr -d '[:space:]')
          BASE_ALPINE="${{ steps.base.outputs.alpine }}"

          if [ "$(n_total /tmp/sec/candidate.ch.json)" = "0" ]; then
            note "No Critical or High findings — nothing to remediate."
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The versions this run must not regress: a remediation that moves a tool's
          # major is a breaking upgrade, and shipping one to make a scanner green is
          # exactly what this workflow must not do.
          probe candidate:local > /tmp/sec/candidate-tools.env
          CUR_KUBECTL_MAJOR=$(major "$(grep '^kubectl=' /tmp/sec/candidate-tools.env | cut -d= -f2)")
          CUR_AWSCLI_MAJOR=$(major "$(grep '^awscli=' /tmp/sec/candidate-tools.env | cut -d= -f2)")

          # --- assemble the candidate list ------------------------------------
          # Each entry is `alpine|kubectl`. Newest Alpine first: a blind +1 step is
          # measurably worse on this image (see the header), and every entry is proven
          # by build + smoke + rescan before it is kept, so a longer jump is safe.
          STABLE=$(curl -fsSL https://dl.k8s.io/release/stable.txt || echo "$CUR_KUBECTL")

          TAGS=$(curl -fsSL 'https://hub.docker.com/v2/repositories/library/alpine/tags?page_size=100' \
                 | jq -r '.results[].name' | grep -E '^3\.[0-9]+$' | sort -Vr || true)

          # Built in a file rather than a shell variable: a multi-line string assembled
          # inside a YAML block scalar carries the block's indentation into every line
          # after the first, and `${entry%%|*}` would then hand back a padded tag.
          : > /tmp/sec/candidates.txt

          # Lever 1: kubectl to current stable, base unchanged.
          if [ -n "$STABLE" ] && [ "$STABLE" != "$CUR_KUBECTL" ]; then
            printf '%s|%s\n' "$CUR_ALPINE" "$STABLE" >> /tmp/sec/candidates.txt
          fi

          # Lever 2: newer Alpine tags, newest first, carrying whatever kubectl is
          # current at that point.
          for t in $TAGS; do
            if [ "$(printf '%s\n%s\n' "$CUR_ALPINE" "$t" | sort -V | head -1)" = "$CUR_ALPINE" ] \
               && [ "$t" != "$CUR_ALPINE" ]; then
              printf '%s|%s\n' "$t" "$STABLE" >> /tmp/sec/candidates.txt
            fi
          done

          # Lever 3: undo an Alpine bump made earlier in THIS run, if everything
          # forward is worse. Never below the tag :latest was built from.
          if [ "$BASE_ALPINE" != "$CUR_ALPINE" ]; then
            printf '%s|%s\n' "$BASE_ALPINE" "$CUR_KUBECTL" >> /tmp/sec/candidates.txt
          fi

          TOTAL=$(wc -l < /tmp/sec/candidates.txt | tr -d ' ')

          if [ "$TOTAL" -eq 0 ]; then
            note "Already on the newest base and the current stable kubectl — no mechanical lever available."
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          note "Incumbent: alpine ${CUR_ALPINE}, kubectl ${CUR_KUBECTL} — $(score /tmp/sec/candidate.ch.json)"
          note ""

          cp /tmp/sec/candidate.ch.json /tmp/sec/incumbent.ch.json

          # The state a rejected attempt is rolled back to. NOT `git checkout --`:
          # the version agent's edits are uncommitted, so checking out from HEAD would
          # silently throw away the base bump this run just made and validated.
          cp Dockerfile /tmp/sec/Dockerfile.incumbent

          # --- try them --------------------------------------------------------
          while IFS= read -r entry <&3; do
            [ -n "$entry" ] || continue

            if [ "$attempts" -ge "${REMEDIATION_MAX_ATTEMPTS}" ]; then
              truncated=true
              note "Attempt cap of ${REMEDIATION_MAX_ATTEMPTS} reached — ${TOTAL} candidates existed, $((TOTAL - attempts)) not tried."
              break
            fi
            attempts=$((attempts + 1))

            try_alpine=${entry%%|*}
            try_kubectl=${entry##*|}

            note "### attempt ${attempts}: alpine ${try_alpine}, kubectl ${try_kubectl}"

            sed -i -E "s|^FROM alpine:.*|FROM alpine:${try_alpine}|" Dockerfile
            sed -i -E "s|^ARG KUBECTL_VERSION=.*|ARG KUBECTL_VERSION=${try_kubectl}|" Dockerfile

            if ! docker buildx build --load --platform linux/amd64 --no-cache \
                   -t remediation:local . > /tmp/sec/attempt-build.log 2>&1; then
              note "- rejected: does not build"
              tail -20 /tmp/sec/attempt-build.log
              cp /tmp/sec/Dockerfile.incumbent Dockerfile
              continue
            fi

            if ! /tmp/sec/smoke.sh remediation:local; then
              note "- rejected: breaks the compatibility contract"
              cp /tmp/sec/Dockerfile.incumbent Dockerfile
              continue
            fi

            probe remediation:local > /tmp/sec/attempt-tools.env
            try_kubectl_major=$(major "$(grep '^kubectl=' /tmp/sec/attempt-tools.env | cut -d= -f2)")
            try_awscli_major=$(major "$(grep '^awscli=' /tmp/sec/attempt-tools.env | cut -d= -f2)")

            if [ "$try_kubectl_major" != "$CUR_KUBECTL_MAJOR" ] || [ "$try_awscli_major" != "$CUR_AWSCLI_MAJOR" ]; then
              note "- rejected: would move a tool's major version (kubectl ${CUR_KUBECTL_MAJOR}->${try_kubectl_major}, aws-cli ${CUR_AWSCLI_MAJOR}->${try_awscli_major}). A breaking upgrade is not an acceptable way to clear a CVE."
              cp /tmp/sec/Dockerfile.incumbent Dockerfile
              continue
            fi

            scan remediation:local /tmp/sec/attempt

            if improves /tmp/sec/attempt.ch.json /tmp/sec/incumbent.ch.json; then
              note "- ACCEPTED: $(score /tmp/sec/incumbent.ch.json) -> $(score /tmp/sec/attempt.ch.json)"
              cp /tmp/sec/attempt.ch.json /tmp/sec/incumbent.ch.json
              applied=true
              {
                echo "alpine=${try_alpine}"
                echo "kubectl=${try_kubectl}"
              } >> "$GITHUB_OUTPUT"
              break
            fi

            note "- rejected: no improvement ($(score /tmp/sec/attempt.ch.json) vs $(score /tmp/sec/incumbent.ch.json))"
            cp /tmp/sec/Dockerfile.incumbent Dockerfile
          done 3< /tmp/sec/candidates.txt

          note ""
          if [ "$applied" = "true" ]; then
            note "Mechanical remediation applied."
          else
            note "No mechanical remediation improved on the candidate; Dockerfile left untouched."
          fi

          {
            echo "applied=${applied}"
            echo "attempts=${attempts}"
            echo "truncated=${truncated}"
          } >> "$GITHUB_OUTPUT"

      - name: AI remediation round
        # Runs only when something fixable is still there after the mechanical search,
        # and only when the agent is available at all. Whatever it proposes goes
        # through the identical accept-or-revert gate: build, smoke, rescan, improve or
        # be thrown away. It cannot lower the bar, only find a lever the search did not
        # model.
        id: ai_remediate
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          source /tmp/sec/lib.sh
          source /tmp/sec/probe.sh

          echo "applied=false" >> "$GITHUB_OUTPUT"

          # The mechanical step exits early without writing this when there is nothing
          # to do.
          [ -f /tmp/sec/incumbent.ch.json ] || cp /tmp/sec/candidate.ch.json /tmp/sec/incumbent.ch.json

          if [ "$(n_fixable /tmp/sec/incumbent.ch.json)" = "0" ]; then
            echo "Nothing fixable remains — skipping the AI round."
            exit 0
          fi

          md_findings /tmp/sec/incumbent.ch.json > /tmp/sec/remaining.md
          cp /tmp/sec/incumbent.ch.json /tmp/sec/remaining.json

          # Refreshed here: the mechanical step may have accepted a change, and a
          # rejected AI proposal must roll back to that, not to HEAD.
          cp Dockerfile /tmp/sec/Dockerfile.incumbent

          cat > /tmp/sec/prompt.md <<'AGENT_PROMPT'
          You are the security remediation agent for this container image repository.

          A candidate image has already been built from the Dockerfile in the working
          tree, smoke-tested, and scanned. A mechanical search has already tried the
          obvious levers — moving the Alpine base tag forward and moving kubectl to
          the current stable release — and kept whatever helped.

          What is left is in /tmp/sec/remaining.md (a table) and
          /tmp/sec/remaining.json (the same data). Read both.

          Your job: decide whether ONE more minimal Dockerfile change could remove any
          of the remaining Critical or High findings WITHOUT breaking the image, and
          if so, make it. You only edit the Dockerfile. You do not commit, tag, push
          or release, and you do not touch CHANGELOG.md.

          Most of the time the correct answer is TO CHANGE NOTHING. That is a real
          result, not a failure. Say so and stop.

          ----------------------------------------------------------------------
          WHAT YOU MAY DO
          ----------------------------------------------------------------------

          - Remove an apk package that this image genuinely does not need, if a
            finding is against that package and nothing else depends on it. Prove it:

              docker run --rm alpine:<TAG> sh -c 'apk add --no-cache --simulate <rest of the list>'

            and confirm the removed package does not come back as a dependency.

          - Replace a package with a smaller equivalent that Alpine ships, if that
            genuinely drops a vulnerable dependency and every tool still works.

          - Move the Alpine tag, if you can show the mechanical search missed a tag
            that helps. It tried newest-first; check /tmp/sec/remediation-log.md before
            assuming it missed anything.

          ----------------------------------------------------------------------
          WHAT YOU MAY NOT DO — these break images
          ----------------------------------------------------------------------

          - NEVER pin an apk package to an exact version with `=`. It breaks the
            moment Alpine drops that package.
          - NEVER add `apk upgrade`. It has been measured on this image and changes
            nothing; the alpine:X.Y tag already carries the newest patch level.
          - NEVER add edge, testing or community repositories from another release.
            Mixing branches breaks musl and every dynamically linked tool with it.
          - NEVER pip install, pip upgrade, or hand-replace a Python library that the
            `aws-cli` apk package owns. Several remaining findings are against
            `cryptography` and `py3-jmespath`, whose fixed versions Alpine has not
            packaged. Overwriting them out of band is how you get an aws-cli that
            imports but fails at runtime. Leave them and report them.
          - NEVER remove bash, ca-certificates, curl, jq or aws-cli. They are the
            point of this image.
          - NEVER change ENTRYPOINT, CMD, USER, WORKDIR, ENV or the uid.
          - NEVER move a tool to a new MAJOR version.
          - NEVER edit anything except the Dockerfile.

          ----------------------------------------------------------------------
          HOW YOUR WORK IS JUDGED
          ----------------------------------------------------------------------

          After you finish, the workflow rebuilds the image, runs the full
          compatibility suite against it, and rescans it. Your change is kept ONLY if
          Criticals do not increase AND Critical+High strictly decreases AND every
          smoke check still passes. Otherwise it is reverted and the run continues
          without it. You cannot make the image worse, so there is no reason to gamble
          — but there is also no credit for a change that does not measurably help.

          ----------------------------------------------------------------------
          FINAL OUTPUT
          ----------------------------------------------------------------------

          A short report, in this shape:

            CHANGED: <yes|no>
            <if yes: one line saying exactly what you changed and which finding ids it targets>

            For each remaining Critical/High finding, one line:
              <id> — <package> — <why it cannot be safely fixed here>

          Be specific about "why". "No upstream fix exists", "fixed in cryptography
          48.0.1 but Alpine 3.24 ships 47.0.0", and "only fixable by removing aws-cli"
          are useful. "Cannot be fixed" is not.
          AGENT_PROMPT

          codex exec \
            --skip-git-repo-check \
            --sandbox danger-full-access \
            --output-last-message /tmp/sec/ai-remediation.md \
            "$(cat /tmp/sec/prompt.md)" || true

          # --- gate whatever it did -------------------------------------------
          CHANGED=$(git status --porcelain | awk '{print $NF}')
          OUT_OF_SCOPE=$(echo "$CHANGED" | grep -vE '^(Dockerfile|CHANGELOG\.md)$' || true)

          if [ -n "$OUT_OF_SCOPE" ]; then
            echo "::error::AI remediation touched files outside its scope:"
            echo "$OUT_OF_SCOPE"
            exit 1
          fi

          if ! echo "$CHANGED" | grep -q '^Dockerfile$'; then
            echo "AI round proposed no Dockerfile change."
            exit 0
          fi

          echo "--- proposed diff ---"
          git diff -- Dockerfile

          if grep -nE '^[[:space:]]+[a-z0-9][a-z0-9._+-]*=[0-9]' Dockerfile; then
            echo "::warning::AI remediation pinned an apk package to an exact version — reverting."
            cp /tmp/sec/Dockerfile.incumbent Dockerfile
            exit 0
          fi

          if git diff -- Dockerfile | grep -qE '^\+.*(apk upgrade|edge|/testing|pip install|pip3 install)'; then
            echo "::warning::AI remediation used a forbidden lever — reverting."
            cp /tmp/sec/Dockerfile.incumbent Dockerfile
            exit 0
          fi

          if git diff -- Dockerfile | grep -qE '^[-+](ENTRYPOINT|CMD|USER|WORKDIR|ENV|EXPOSE|VOLUME)'; then
            echo "::warning::AI remediation changed the image interface — reverting."
            cp /tmp/sec/Dockerfile.incumbent Dockerfile
            exit 0
          fi

          if ! docker buildx build --load --platform linux/amd64 --no-cache \
                 -t ai-remediation:local . > /tmp/sec/ai-build.log 2>&1; then
            echo "::warning::AI remediation does not build — reverting."
            tail -20 /tmp/sec/ai-build.log
            cp /tmp/sec/Dockerfile.incumbent Dockerfile
            exit 0
          fi

          if ! /tmp/sec/smoke.sh ai-remediation:local; then
            echo "::warning::AI remediation breaks the compatibility contract — reverting."
            cp /tmp/sec/Dockerfile.incumbent Dockerfile
            exit 0
          fi

          probe ai-remediation:local > /tmp/sec/ai-tools.env
          AI_KUBECTL_MAJOR=$(major "$(grep '^kubectl=' /tmp/sec/ai-tools.env | cut -d= -f2)")
          AI_AWSCLI_MAJOR=$(major "$(grep '^awscli=' /tmp/sec/ai-tools.env | cut -d= -f2)")
          CUR_KUBECTL_MAJOR=$(major "$(grep '^kubectl=' /tmp/sec/candidate-tools.env | cut -d= -f2)")
          CUR_AWSCLI_MAJOR=$(major "$(grep '^awscli=' /tmp/sec/candidate-tools.env | cut -d= -f2)")

          if [ "$AI_KUBECTL_MAJOR" != "$CUR_KUBECTL_MAJOR" ] || [ "$AI_AWSCLI_MAJOR" != "$CUR_AWSCLI_MAJOR" ]; then
            echo "::warning::AI remediation moved a tool's major version — reverting."
            cp /tmp/sec/Dockerfile.incumbent Dockerfile
            exit 0
          fi

          scan ai-remediation:local /tmp/sec/ai-attempt

          if improves /tmp/sec/ai-attempt.ch.json /tmp/sec/incumbent.ch.json; then
            echo "AI remediation ACCEPTED: $(score /tmp/sec/incumbent.ch.json) -> $(score /tmp/sec/ai-attempt.ch.json)"
            cp /tmp/sec/ai-attempt.ch.json /tmp/sec/incumbent.ch.json
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AI remediation did not improve the scan — reverting."
            cp /tmp/sec/Dockerfile.incumbent Dockerfile
          fi

      - name: Rebuild the remediated image
        # Only when something was actually accepted. This is also what puts the final
        # amd64 layers into the gha cache, so the multi-arch push publishes exactly
        # what was scanned and smoke-tested.
        if: steps.remediate.outputs.applied == 'true' || steps.ai_remediate.outputs.applied == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          no-cache: true
          tags: candidate:local
          cache-to: type=gha,mode=max

      - name: Rescan after remediation
        if: steps.remediate.outputs.applied == 'true' || steps.ai_remediate.outputs.applied == 'true'
        run: |
          set -euo pipefail
          source /tmp/sec/lib.sh

          /tmp/sec/smoke.sh candidate:local

          scan candidate:local /tmp/sec/candidate

          echo "after remediation: $(score /tmp/sec/candidate.ch.json)"
          md_findings /tmp/sec/candidate.ch.json

      # =======================================================================
      # 4. Decide the version, decide whether to publish
      # =======================================================================

      - name: Resolve the SemVer version
        id: version
        run: |
          set -euo pipefail
          source /tmp/sec/lib.sh
          source /tmp/sec/probe.sh

          BASE_SHA="${{ steps.base.outputs.sha }}"

          PREV=$(git show "${BASE_SHA}:CHANGELOG.md" \
                 | grep -m1 -E '^## v[0-9]+\.[0-9]+\.[0-9]+' \
                 | sed -E 's/^## (v[0-9]+\.[0-9]+\.[0-9]+).*/\1/' || true)
          PREV=${PREV:-v0.0.0}

          DOCKERFILE_CHANGED=false
          git diff --quiet -- Dockerfile || DOCKERFILE_CHANGED=true

          REMEDIATED=false
          if [ "${{ steps.remediate.outputs.applied }}" = "true" ] \
             || [ "${{ steps.ai_remediate.outputs.applied }}" = "true" ]; then
            REMEDIATED=true
          fi

          # --- what changed, in SemVer terms -----------------------------------
          LEVEL=none

          if [ "$DOCKERFILE_CHANGED" = "true" ] || [ "$REMEDIATED" = "true" ] \
             || [ "${{ inputs.force_release }}" = "true" ]; then
            LEVEL=fix
          fi

          # A push only counts when it changed something that ends up IN the image.
          # Terraform re-syncs this workflow file on every apply, and a docs or CI
          # commit must not cut a release for an image nobody touched. The build and
          # the scan still run — only the publish is skipped.
          if [ "${{ github.event_name }}" = "push" ] && [ "$LEVEL" = "none" ]; then
            PUSHED=$(git diff --name-only "${{ github.event.before }}" "${BASE_SHA}" 2>/dev/null || echo UNKNOWN)

            if [ "$PUSHED" = "UNKNOWN" ]; then
              echo "Cannot diff the push range — assuming the image changed."
              LEVEL=fix
            elif printf '%s\n' "$PUSHED" \
                 | grep -qvE '^(CHANGELOG\.md|README\.md|LICENSE|SECURITY\.md|\.gitignore|\.github/)'; then
              echo "Push changed image content:"
              printf '%s\n' "$PUSHED" | sed 's/^/  /'
              LEVEL=fix
            else
              echo "Push touched only docs/CI — rebuilt and rescanned, but not republished."
            fi
          fi

          probe candidate:local > /tmp/sec/final-tools.env

          # Everything this image ships, and what this release removed. Both are
          # reported in the changelog entry, the release notes and the run summary.
          inventory candidate:local > /tmp/sec/inventory.tsv

          if [ -f /tmp/sec/published.ch.json ]; then
            resolved /tmp/sec/published.ch.json /tmp/sec/candidate.ch.json > /tmp/sec/resolved.json
          else
            echo '[]' > /tmp/sec/resolved.json
          fi

          echo "resolved by this release: $(jq 'length' /tmp/sec/resolved.json) Critical/High finding(s)"
          NEW_KUBECTL=$(grep '^kubectl=' /tmp/sec/final-tools.env | cut -d= -f2)
          NEW_AWSCLI=$(grep '^awscli=' /tmp/sec/final-tools.env | cut -d= -f2)
          NEW_ALPINE=$(grep -m1 -E '^FROM alpine:' Dockerfile | cut -d: -f2 | tr -d '[:space:]')

          OLD_KUBECTL=""; OLD_AWSCLI=""; OLD_ALPINE=""
          if [ "${{ steps.published.outputs.exists }}" = "true" ]; then
            OLD_KUBECTL=$(jq -r '."io.homelab.tools.kubectl" // ""'  /tmp/sec/published-labels.json)
            OLD_AWSCLI=$(jq  -r '."io.homelab.tools.aws-cli" // ""'  /tmp/sec/published-labels.json)
            OLD_ALPINE=$(jq  -r '."io.homelab.tools.alpine"  // ""'  /tmp/sec/published-labels.json)
          fi

          echo "shipped now : kubectl=${NEW_KUBECTL} aws-cli=${NEW_AWSCLI} alpine=${NEW_ALPINE}"
          echo "shipped last: kubectl=${OLD_KUBECTL:-?} aws-cli=${OLD_AWSCLI:-?} alpine=${OLD_ALPINE:-?}"

          feature() { [ "$LEVEL" = "breaking" ] || LEVEL=feature; }

          if [ -z "$OLD_KUBECTL" ] || [ -z "$OLD_AWSCLI" ] || [ -z "$OLD_ALPINE" ]; then
            # No labels to compare against — treat as a feature release rather than
            # silently calling a possibly-large change a patch.
            if [ "$LEVEL" != "none" ]; then
              echo "Previous tool labels unavailable — defaulting to a feature-level bump."
              feature
            fi
          else
            [ "$NEW_ALPINE" = "$OLD_ALPINE" ]                        || feature
            [ "$(minor "$NEW_KUBECTL")" = "$(minor "$OLD_KUBECTL")" ] || feature
            [ "$(minor "$NEW_AWSCLI")"  = "$(minor "$OLD_AWSCLI")"  ] || feature
            [ "$(major "$NEW_KUBECTL")" = "$(major "$OLD_KUBECTL")" ] || LEVEL=breaking
            [ "$(major "$NEW_AWSCLI")"  = "$(major "$OLD_AWSCLI")"  ] || LEVEL=breaking
          fi

          # An apk package disappearing changes what the image ships.
          OLD_PKGS=$(git show "${BASE_SHA}:Dockerfile" | grep -cE '^[[:space:]]+[a-z0-9][a-z0-9._+-]*[[:space:]]*\\?$' || true)
          NEW_PKGS=$(grep -cE '^[[:space:]]+[a-z0-9][a-z0-9._+-]*[[:space:]]*\\?$' Dockerfile || true)
          if [ "${NEW_PKGS:-0}" -lt "${OLD_PKGS:-0}" ]; then
            echo "An apk package was removed (${OLD_PKGS} -> ${NEW_PKGS})."
            LEVEL=breaking
          fi

          # The image interface is off limits to both agents; a change here means a
          # human edited it, and it is a breaking change by definition.
          if git diff "${BASE_SHA}" -- Dockerfile | grep -qE '^[-+](ENTRYPOINT|CMD|USER|WORKDIR|ENV|EXPOSE|VOLUME)'; then
            echo "The image interface changed."
            LEVEL=breaking
          fi

          # --- map to a component, honouring SemVer's pre-1.0 clause ------------
          PREV_MAJOR=$(major "$PREV")

          case "$LEVEL" in
            none)     COMPONENT=none ;;
            fix)      COMPONENT=patch ;;
            feature)  COMPONENT=minor ;;
            breaking) if [ "$PREV_MAJOR" = "0" ]; then COMPONENT=minor; else COMPONENT=major; fi ;;
          esac

          echo "change level: ${LEVEL} -> ${COMPONENT} bump from ${PREV}"

          bump() {
            local v=${1#v} c=$2 M m p rest
            M=${v%%.*}; rest=${v#*.}; m=${rest%%.*}; p=${rest#*.}
            case "$c" in
              major) M=$((M + 1)); m=0; p=0 ;;
              minor) m=$((m + 1)); p=0 ;;
              patch) p=$((p + 1)) ;;
            esac
            printf 'v%s.%s.%s\n' "$M" "$m" "$p"
          }

          if [ "$COMPONENT" = "none" ]; then
            echo "Nothing changed — no new version."
            {
              echo "release=false"
              echo "version=${PREV}"
              echo "previous=${PREV}"
              echo "level=none"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEXT=$(bump "$PREV" "$COMPONENT")
          echo "version: ${PREV} -> ${NEXT}"

          # --- write it into the CHANGELOG -------------------------------------
          TODAY=$(date -u +%F)

          if grep -qE '^## vNEXT' CHANGELOG.md; then
            # The version agent wrote the section; only the placeholder needs filling.
            # A plain global substitution rather than a `0,/re/` range: that address
            # form is a GNU extension, and there must be exactly one placeholder
            # anyway — more than one means the agent wrote a section it should not
            # have, which is worth failing on rather than papering over.
            PLACEHOLDERS=$(grep -c '^## vNEXT' CHANGELOG.md)

            if [ "$PLACEHOLDERS" -ne 1 ]; then
              echo "::error::Expected exactly one '## vNEXT' heading, found ${PLACEHOLDERS}."
              exit 1
            fi

            sed -i -E "s|^## vNEXT.*|## ${NEXT} — ${TODAY}|" CHANGELOG.md

            # Two things get appended to whatever the agent wrote: the tooling
            # inventory probed from the image that is actually about to ship, and the
            # findings this release removed. When a remediation moved the base further
            # than the agent's table says, that is recorded here too rather than by
            # rewriting the agent's rows.
            {
              echo
              if [ "$REMEDIATED" = "true" ]; then
                echo "Security remediation was applied after the table above was written. The image"
                echo "published for this version is alpine ${NEW_ALPINE}, kubectl ${NEW_KUBECTL}," \
                     "aws-cli ${NEW_AWSCLI}, scanning as $(n_crit /tmp/sec/candidate.ch.json) Critical" \
                     "and $(n_high /tmp/sec/candidate.ch.json) High."
                echo
              fi
              if [ "$(jq 'length' /tmp/sec/resolved.json)" != "0" ]; then
                echo "### Fixed"
                echo
                md_resolved /tmp/sec/resolved.json
                echo
              fi
              echo "### Contents"
              echo
              md_tools /tmp/sec/inventory.tsv
              echo
            } > /tmp/sec/secnote.md

            SECOND=$(grep -n '^## ' CHANGELOG.md | sed -n '2p' | cut -d: -f1 || true)

            if [ -n "$SECOND" ]; then
              head -n "$((SECOND - 1))" CHANGELOG.md > /tmp/sec/CHANGELOG.new
              cat /tmp/sec/secnote.md                >> /tmp/sec/CHANGELOG.new
              tail -n "+${SECOND}" CHANGELOG.md      >> /tmp/sec/CHANGELOG.new
              mv /tmp/sec/CHANGELOG.new CHANGELOG.md
            else
              cat /tmp/sec/secnote.md >> CHANGELOG.md
            fi
          else
            # A remediation-only or push-triggered release: the version agent never
            # ran, or ran and found nothing, so there is no section to rename.
            #
            # The rows are built first so a plain rebuild — where nothing was pinned
            # differently — does not emit a table with a header and no rows. `if`
            # rather than `[ ] && echo`, because a false test as the last command of
            # a group under `set -e` would end the step.
            {
              if [ -n "$OLD_ALPINE" ] && [ "$NEW_ALPINE" != "$OLD_ALPINE" ]; then
                echo "| alpine | ${OLD_ALPINE} | ${NEW_ALPINE} |"
              fi
              if [ -n "$OLD_KUBECTL" ] && [ "$NEW_KUBECTL" != "$OLD_KUBECTL" ]; then
                echo "| kubectl | ${OLD_KUBECTL} | ${NEW_KUBECTL} |"
              fi
              if [ -n "$OLD_AWSCLI" ] && [ "$NEW_AWSCLI" != "$OLD_AWSCLI" ]; then
                echo "| aws-cli | ${OLD_AWSCLI} | ${NEW_AWSCLI} |"
              fi
            } > /tmp/sec/rows.md

            {
              echo "## ${NEXT} — ${TODAY}"
              echo
              if [ -s /tmp/sec/rows.md ]; then
                echo "| tool | from | to |"
                echo "|------|------|----|"
                cat /tmp/sec/rows.md
                echo
              fi
              if [ "$REMEDIATED" = "true" ]; then
                PUB_C=$([ -f /tmp/sec/published.ch.json ] && n_crit /tmp/sec/published.ch.json || echo '?')
                PUB_H=$([ -f /tmp/sec/published.ch.json ] && n_high /tmp/sec/published.ch.json || echo '?')
                echo "Security rebuild. The previous image scanned as ${PUB_C} Critical and ${PUB_H} High;" \
                     "this one scans as $(n_crit /tmp/sec/candidate.ch.json) Critical and" \
                     "$(n_high /tmp/sec/candidate.ch.json) High. The release notes list what remains and why."
              else
                echo "Rebuild against current Alpine packages. No pinned version changed."
              fi
              echo
              if [ "$(jq 'length' /tmp/sec/resolved.json)" != "0" ]; then
                echo "### Fixed"
                echo
                md_resolved /tmp/sec/resolved.json
                echo
              fi
              echo "### Contents"
              echo
              md_tools /tmp/sec/inventory.tsv
              echo
            } > /tmp/sec/newsection.md

            # Insert directly above the newest existing entry, so the file's preamble
            # stays where it is.
            FIRST=$(grep -n '^## v' CHANGELOG.md | head -1 | cut -d: -f1 || true)

            if [ -n "$FIRST" ]; then
              head -n "$((FIRST - 1))" CHANGELOG.md   > /tmp/sec/CHANGELOG.new
              cat /tmp/sec/newsection.md             >> /tmp/sec/CHANGELOG.new
              tail -n "+${FIRST}" CHANGELOG.md       >> /tmp/sec/CHANGELOG.new
            else
              cat CHANGELOG.md /tmp/sec/newsection.md > /tmp/sec/CHANGELOG.new
            fi

            mv /tmp/sec/CHANGELOG.new CHANGELOG.md
          fi

          {
            echo "release=true"
            echo "version=${NEXT}"
            echo "previous=${PREV}"
            echo "level=${COMPONENT}"
          } >> "$GITHUB_OUTPUT"

      - name: Security policy decision
        id: policy
        run: |
          set -euo pipefail
          source /tmp/sec/lib.sh

          CAND_CRIT=$(n_crit /tmp/sec/candidate.ch.json)
          CAND_HIGH=$(n_high /tmp/sec/candidate.ch.json)
          CAND_FIX=$(n_fixable /tmp/sec/candidate.ch.json)

          echo "policy: ${SECURITY_POLICY}"
          echo "candidate: ${CAND_CRIT} Critical / ${CAND_HIGH} High (${CAND_FIX} with an upstream fix)"

          BLOCK=false
          REASON=""

          if [ "${{ steps.published.outputs.exists }}" = "true" ]; then
            PUB_CRIT="${{ steps.published.outputs.crit }}"
            PUB_HIGH="${{ steps.published.outputs.high }}"
            echo "published: ${PUB_CRIT} Critical / ${PUB_HIGH} High"

            if [ "$CAND_CRIT" -gt "$PUB_CRIT" ]; then
              BLOCK=true
              REASON="the candidate has more Critical findings than the published image (${PUB_CRIT} -> ${CAND_CRIT})"
            elif [ $((CAND_CRIT + CAND_HIGH)) -gt $((PUB_CRIT + PUB_HIGH)) ]; then
              BLOCK=true
              REASON="the candidate has more Critical+High findings than the published image ($((PUB_CRIT + PUB_HIGH)) -> $((CAND_CRIT + CAND_HIGH)))"
            fi
          else
            echo "published: none yet"
          fi

          if [ "$SECURITY_POLICY" = "strict" ] && [ "$CAND_FIX" -gt 0 ]; then
            BLOCK=true
            REASON="strict policy: ${CAND_FIX} Critical/High finding(s) still have an upstream fix"
          fi

          if [ "$SECURITY_POLICY" = "report-only" ] && [ "$BLOCK" = "true" ]; then
            echo "::warning::report-only policy — publishing despite: ${REASON}"
            BLOCK=false
            REASON=""
          fi

          {
            echo "block=${BLOCK}"
            echo "reason=${REASON}"
            echo "crit=${CAND_CRIT}"
            echo "high=${CAND_HIGH}"
            echo "fixable=${CAND_FIX}"
          } >> "$GITHUB_OUTPUT"

      - name: Gate — the publish policy
        if: steps.policy.outputs.block == 'true'
        run: |
          echo "::error::Refusing to publish — ${{ steps.policy.outputs.reason }}."
          echo "Re-run with security_policy=report-only to publish anyway, or fix the finding."
          exit 1

      - name: Commit the release
        # One commit for the whole run: the version agent's pins, any accepted
        # remediation, and the resolved version number.
        id: commit
        if: steps.version.outputs.release == 'true'
        run: |
          set -euo pipefail

          if git diff --quiet -- Dockerfile CHANGELOG.md; then
            echo "Nothing to commit."
            exit 0
          fi

          echo "--- diff ---"
          git diff -- Dockerfile CHANGELOG.md

          git add Dockerfile CHANGELOG.md
          git commit -m "release ${{ steps.version.outputs.version }}"
          git push origin main

      # =======================================================================
      # 5. Publish
      # =======================================================================

      - name: Read the build metadata
        id: meta
        # `always()` so a blocked publish still produces a usable summary. hashFiles
        # cannot be used to guard this: it only sees paths inside the workspace.
        if: always()
        run: |
          set -euo pipefail

          if [ ! -f /tmp/sec/final-tools.env ]; then
            echo "No probe data — the run stopped before the image was measured."
            exit 0
          fi

          {
            echo "ALPINE=$(grep -m1 -E '^FROM alpine:' Dockerfile | cut -d: -f2 | tr -d '[:space:]')"
            echo "KUBECTL=$(grep '^kubectl=' /tmp/sec/final-tools.env | cut -d= -f2)"
            echo "AWSCLI=$(grep '^awscli=' /tmp/sec/final-tools.env | cut -d= -f2)"
            echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        if: steps.version.outputs.release == 'true'
        # `cache-from: gha` reuses the exact amd64 layers the candidate build wrote,
        # so the amd64 image published here is the one that was scanned and smoke
        # tested. arm64 is built fresh; the Dockerfile's own RUN steps assert that
        # kubectl and aws run on it, so a broken arm64 fails the build before any push.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.meta.outputs.SHORT_SHA }}
          labels: |
            org.opencontainers.image.title=kubectl-awscli
            org.opencontainers.image.description=Alpine ${{ steps.meta.outputs.ALPINE }} with kubectl ${{ steps.meta.outputs.KUBECTL }} and aws-cli ${{ steps.meta.outputs.AWSCLI }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.created=${{ steps.meta.outputs.BUILD_DATE }}
            org.opencontainers.image.base.name=docker.io/library/alpine:${{ steps.meta.outputs.ALPINE }}
            io.homelab.tools.kubectl=${{ steps.meta.outputs.KUBECTL }}
            io.homelab.tools.aws-cli=${{ steps.meta.outputs.AWSCLI }}
            io.homelab.tools.alpine=${{ steps.meta.outputs.ALPINE }}
            io.homelab.security.critical=${{ steps.policy.outputs.crit }}
            io.homelab.security.high=${{ steps.policy.outputs.high }}
            io.homelab.security.scanned-by=grype ${{ env.GRYPE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # =======================================================================
      # 6. Report
      # =======================================================================

      - name: Assemble the security report
        if: always()
        run: |
          set -euo pipefail
          source /tmp/sec/lib.sh 2>/dev/null || exit 0
          [ -f /tmp/sec/candidate.ch.json ] || exit 0

          {
            echo "### Vulnerability report — linux/amd64"
            echo
            echo "Scanned with grype \`${GRYPE_VERSION}\` before publication. Policy: \`${SECURITY_POLICY}\`."
            echo
            echo "**${{ steps.policy.outputs.crit }} Critical · ${{ steps.policy.outputs.high }} High**"
            echo " (${{ steps.policy.outputs.fixable }} of which have a fix published upstream)"
            echo
            md_findings /tmp/sec/candidate.ch.json
            echo
            if [ -f /tmp/sec/resolved.json ] && [ "$(jq 'length' /tmp/sec/resolved.json)" != "0" ]; then
              echo "#### Fixed in this release"
              echo
              md_resolved /tmp/sec/resolved.json
              echo
            fi
            echo "\`fix available upstream\` means a fixed version exists somewhere — it does"
            echo "not mean Alpine has packaged it. Where it has not, the only routes left are"
            echo "pip-installing over an apk-owned library or dropping aws-cli, both of which"
            echo "break the image, so the finding stays and is reported here instead."
          } > /tmp/sec/report.md

          if [ -f /tmp/sec/remediation-log.md ]; then
            {
              echo
              echo "<details><summary>Remediation attempts</summary>"
              echo
              cat /tmp/sec/remediation-log.md
              echo
              echo "</details>"
            } >> /tmp/sec/report.md
          fi

          if [ -f /tmp/sec/ai-remediation.md ]; then
            {
              echo
              echo "<details><summary>Agent triage of what remains</summary>"
              echo
              cat /tmp/sec/ai-remediation.md
              echo
              echo "</details>"
            } >> /tmp/sec/report.md
          fi

          # The SARIF upload needs the file inside the workspace.
          cp /tmp/sec/candidate.grype.sarif "${GITHUB_WORKSPACE}/grype.sarif" 2>/dev/null || true

      - name: Upload SARIF
        # Copied into the workspace by the step above: both `hashFiles` and
        # upload-sarif resolve paths relative to GITHUB_WORKSPACE and cannot reach
        # /tmp. This happens after the commit, so the untracked file is never staged.
        if: always() && hashFiles('grype.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: grype.sarif
          category: grype

      - name: Upload SBOM and scan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_id }}
          path: |
            /tmp/sec/candidate.sbom.json
            /tmp/sec/candidate.grype.json
            /tmp/sec/candidate.grype.txt
            /tmp/sec/candidate.ch.json
            /tmp/sec/report.md
            /tmp/sec/remediation-log.md
            /tmp/sec/ai-remediation.md
            /tmp/version-agent.md
          if-no-files-found: warn
          retention-days: 90

      - name: Step summary
        if: always()
        run: |
          set -uo pipefail
          source /tmp/sec/lib.sh 2>/dev/null || true

          {
            echo "## kubectl-awscli"
            echo
            if [ "${{ steps.version.outputs.release }}" = "true" ]; then
              echo "**${{ steps.version.outputs.previous }} → ${{ steps.version.outputs.version }}**" \
                   "(\`${{ steps.version.outputs.level }}\` bump)"
            else
              echo "**No release** — nothing changed. The image was still rebuilt and rescanned."
            fi
            echo
            if [ -f /tmp/sec/inventory.tsv ]; then
              md_tools /tmp/sec/inventory.tsv
            fi
            echo
            [ -f /tmp/sec/report.md ] && cat /tmp/sec/report.md
            echo
            if [ -f /tmp/version-agent.md ]; then
              echo "<details><summary>Version agent</summary>"
              echo
              cat /tmp/version-agent.md
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        if: steps.version.outputs.release == 'true' && steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          source /tmp/sec/lib.sh

          TAG="${{ steps.version.outputs.version }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi

          # Prose comes from the CHANGELOG section this run wrote: everything from the
          # newest `## ` heading up to the next one.
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md

          {
            echo
            echo "### Contents"
            echo
            if [ -f /tmp/sec/inventory.tsv ]; then
              md_tools /tmp/sec/inventory.tsv
            fi
            echo
            cat /tmp/sec/report.md
            echo
            echo "### Image"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${TAG}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> notes.md

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            /tmp/sec/candidate.sbom.json \
            /tmp/sec/candidate.grype.txt