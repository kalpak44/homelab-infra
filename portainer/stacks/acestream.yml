# ==============================================================================
# Portainer Stack: AceStream (Engine + acexy + playlist proxy)
# ==============================================================================
#
# Purpose
# -------
# Three-tier AceStream IPTV setup for WebOS / Kodi / VLC clients on the LAN.
# The playlist proxy is an authenticated UI for manually curating playlists
# from live AceStream search results. It serves each playlist and its matching
# XMLTV document through a random, bearer-token-style playlist ID.
#
#   1. AceStream Engine
#      P2P streaming engine. Its HTTP admin API on 6878 is NEVER published to
#      the host — reachable only from other containers in this stack's Docker
#      network. P2P port 8621/tcp+udp IS published for swarm health.
#
#   2. acexy
#      Small Go proxy in front of the engine. Solves three AceStream limits:
#        - Only one client per stream (acexy multiplexes so N clients can
#          watch the same infohash concurrently).
#        - Manual pid assignment per client (acexy generates one automatically).
#        - Fragile transmission — momentary engine hiccup drops every client
#          (acexy insulates the clients from those errors).
#      Only endpoint exposed: /ace/getstream.
#
#   3. playlist proxy (kalpak44/acestream-proxy)
#      Authenticated Node.js UI for searching the engine, curating categories
#      and channels, and serving playlists. Each generated channel URL already
#      points at acexy — no post-processing needed.
#
# Data flow
# ---------
#
#   Administrator
#       │
#       │  http://192.168.1.7:6880/  (authenticated UI)
#       ▼
#   playlist proxy :6880  ── http://engine:6878/search ───────────┐
#       │  /<playlist-id>/playlist.m3u8 points at ▼                │
#       ▼                                                          │
#   acexy :6879                                                    │
#       │                                                         │
#       ▼                                                         │
#   acestream-engine :6878 (internal bridge network only)  ◄──────┘
#       │
#       ▼
#   AceStream P2P swarm (via published TCP+UDP :8621)
#
# Portainer deployment
# --------------------
#
#   1. In Portainer, open "Stacks".
#   2. Select "Add stack".
#   3. Paste or upload this file (or point Portainer at this repo path).
#   4. Deploy the stack.
#   5. Set the AUTH_USERNAME, AUTH_PASSWORD, and SESSION_SECRET stack
#      variables to their existing values.
#   6. Deploy the stack, then open http://192.168.1.7:6880/ and sign in.
#   7. Create a playlist, add channels from Search, and use the private URL
#      shown for that playlist (/<playlist-id>/playlist.m3u8) in the IPTV
#      client. The random playlist ID is a bearer token; do not share it.
#
# Security notes
# --------------
#
# - The AceStream engine admin API on port 6878 is NEVER published to the
#   host. Only acexy (in the same Docker network) can reach it. Do NOT add
#   a `ports:` entry to the engine service.
# - P2P port 8621/tcp+udp IS published for swarm health. It speaks the
#   BitTorrent-family protocol, not HTTP; there is no admin surface on it.
# - When exposing this stack over the Cloudflare tunnel later, publish
#   only the playlist proxy (:6880) and acexy (:6879). Never publish the
#   engine's HTTP port. Add a Cloudflare Access policy (email/IP allowlist)
#   on both public hostnames.
#
# Image versioning
# ----------------
#
# Engine + playlist proxy are pinned to specific short-sha tags for
# reproducibility. Acexy is on :latest — pin to a specific tag before going
# public.
#
# ==============================================================================

version: "3.8"

networks:
  acestream:
    driver: bridge

volumes:
  # Persists curated playlists, settings, and generated M3U/XML files.
  acestream-playlist-data:

services:
  # ============================================================================
  # AceStream Engine
  # ============================================================================
  #
  # The P2P streaming engine. HTTP admin API on 6878 is intentionally NOT
  # published to the host — it is reachable only from other containers in
  # the `acestream` network via the Docker DNS name `engine`.
  #
  engine:
    image: ghcr.io/kalpak44/acestream-engine:274465d
    container_name: acestream-engine
    restart: unless-stopped

    networks:
      - acestream

    expose:
      - "6878"

    ports:
      # ⚠️ TEMPORARY — admin API exposed to LAN for channel search / debugging.
      # REMOVE this line once done. See "Security notes" at the top of this
      # file: this port must NOT stay published in the long term, and MUST
      # NEVER be exposed via the Cloudflare tunnel.
      - "6878:6878"

      # P2P port for AceStream peer traffic. Publishing improves swarm health.
      # This port is BitTorrent family; it does NOT expose the admin API.
      - "8621:8621/tcp"
      - "8621:8621/udp"

    # The engine caches stream chunks in /dev/shm. Default 64 MB is too small.
    shm_size: "2g"

    # Passed through as extra args to the engine binary (via the image's
    # entrypoint, which always prepends --client-console).
    command:
      - "--cache-max-bytes"
      - "1610612736"      # 1.5 GiB

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6878/webui/api/service?method=get_version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ============================================================================
  # acexy
  # ============================================================================
  #
  # Stream multiplexer + resilience layer in front of the engine. This is the
  # only component that talks to the engine's HTTP API.
  #
  acexy:
    image: ghcr.io/javinator9889/acexy:latest
    container_name: acestream-acexy
    restart: unless-stopped

    networks:
      - acestream

    depends_on:
      engine:
        condition: service_healthy

    ports:
      # Client-facing stream endpoint. WebOS / IPTV players hit:
      #   http://192.168.1.7:6879/ace/getstream?infohash=<hash>
      - "6879:8080"

    environment:
      # acexy talks to the engine using the compose network DNS name.
      ACEXY_HOST: engine
      ACEXY_PORT: "6878"
      ACEXY_SCHEME: http

      # acexy listens on all interfaces on port 8080 inside the container;
      # published on the host as 6879.
      ACEXY_LISTEN_ADDR: ":8080"

      # MPEG-TS mode (default). HLS mode is marked non-tested upstream.
      # Set to "true" to switch to HLS output if you need it.
      ACEXY_M3U8: "false"

      # Per-stream client-facing buffer. Upstream default is 4.2MiB, which
      # only holds ~1 s at 4K HDR bitrates and stutters on flaky swarms.
      # 32MiB gives ~10 s at 25 Mbit/s and ~4-5 s at 60 Mbit/s. Bump to
      # 64MiB if 4K HDR still stalls. Cost: RAM per active stream × clients.
      ACEXY_BUFFER_SIZE: "32MiB"

      # How long acexy waits for the engine to start returning bytes before
      # giving up (default 1s). P2P swarms often need a few seconds to warm
      # up, especially on 4K streams.
      ACEXY_NO_RESPONSE_TIMEOUT: "5s"

      # How long a stalled client can stay connected before being evicted
      # (default 5s). Slightly higher to survive brief TV-side hiccups.
      ACEXY_CLIENT_EVICTION_TIMEOUT: "10s"

  # ============================================================================
  # Playlist proxy (kalpak44/acestream-proxy)
  # ============================================================================
  #
  # Authenticated UI for searching the engine and manually curating playlists.
  # Every generated stream URL points at acexy. Playlist state is persisted in
  # the named volume below.
  #
  # Endpoints:
  #   GET  http://192.168.1.7:6880/                           — admin UI
  #   GET  http://192.168.1.7:6880/<playlist-id>/playlist.m3u8 — playlist
  #   GET  http://192.168.1.7:6880/<playlist-id>/epg.xml       — XMLTV EPG
  #
  playlist:
    image: ghcr.io/kalpak44/acestream-proxy:d2f79e3
    container_name: acestream-playlist
    restart: unless-stopped

    networks:
      - acestream

    depends_on:
      engine:
        condition: service_healthy

    ports:
      - "6880:8000"

    volumes:
      - acestream-playlist-data:/app/data

    environment:
      # Required. Preserve these existing Portainer stack variables; startup
      # fails if any is absent. Changing SESSION_SECRET invalidates sessions.
      AUTH_USERNAME: "${AUTH_USERNAME}"
      AUTH_PASSWORD: "${AUTH_PASSWORD}"
      SESSION_SECRET: "${SESSION_SECRET}"

      # Defaults used by the admin UI. Runtime overrides are stored in the
      # mounted data volume and therefore survive image upgrades.
      ACESTREAM_SEARCH_URL: "http://engine:6878/search"

      # MPEG-TS base URL baked into generated M3U entries. This must be the
      # client-reachable acexy URL, not the internal Docker name.
      ACESTREAM_STREAM_BASE: "http://192.168.1.7:6879/ace/getstream"
      ACESTREAM_PAGE_SIZE: "50"

      # Used in the M3U's url-tvg header for the matching per-playlist XMLTV.
      PUBLIC_BASE_URL: "http://192.168.1.7:6880"
      PORT: "8000"
      DATA_DIR: "/app/data"

      # The service is currently accessed directly over HTTP on the LAN.
      # Set both to true if it moves behind a TLS-terminating reverse proxy.
      SESSION_COOKIE_SECURE: "false"
      TRUST_PROXY: "false"
