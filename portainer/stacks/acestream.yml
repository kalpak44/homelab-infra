# ==============================================================================
# Portainer Stack: AceStream (Engine + acexy + playlist proxy)
# ==============================================================================
#
# Purpose
# -------
# Three-tier AceStream IPTV setup that produces a single M3U for WebOS / Kodi /
# VLC clients on the LAN. The playlist proxy uses an upstream M3U (SOURCE_PLAYLIST_URL)
# as the channel catalog, matches each channel against live AceStream infohashes
# from the engine's /search, and re-emits playlist.m3u8 on a cron schedule with
# URLs already pointing at the acexy multiplex layer.
#
#   1. AceStream Engine
#      P2P streaming engine. Its HTTP admin API on 6878 is NEVER published to
#      the host — reachable only from other containers in this stack's Docker
#      network. P2P port 8621/tcp+udp IS published for swarm health.
#
#   2. acexy
#      Small Go proxy in front of the engine. Solves three AceStream limits:
#        - Only one client per stream (acexy multiplexes so N clients can
#          watch the same infohash concurrently).
#        - Manual pid assignment per client (acexy generates one automatically).
#        - Fragile transmission — momentary engine hiccup drops every client
#          (acexy insulates the clients from those errors).
#      Only endpoint exposed: /ace/getstream.
#
#   3. playlist proxy (kalpak44/acestream-proxy)
#      Node.js service that uses SOURCE_PLAYLIST_URL as the channel catalog
#      (names, groups, logos, EPG ids), matches each channel against live
#      AceStream infohashes from the engine's /search endpoint, and emits
#      playlist.m3u8 on a cron schedule (default nightly). Each entry already
#      points at acexy — no post-processing needed.
#
# Data flow
# ---------
#
#   WebOS TV / IPTV client
#       │
#       │  http://192.168.1.7:6880/playlist.m3u8  (refreshed hourly)
#       ▼
#   playlist proxy :6880  ── periodic http://engine:6878/search ──┐
#       │  (M3U entries point at ▼)                                │
#       ▼                                                          │
#   acexy :6879                                                    │
#       │                                                         │
#       ▼                                                         │
#   acestream-engine :6878 (internal bridge network only)  ◄──────┘
#       │
#       ▼
#   AceStream P2P swarm (via published TCP+UDP :8621)
#
# Portainer deployment
# --------------------
#
#   1. In Portainer, open "Stacks".
#   2. Select "Add stack".
#   3. Paste or upload this file (or point Portainer at this repo path).
#   4. Deploy the stack.
#   5. Set the SOURCE_PLAYLIST_URL stack variable to your upstream M3U URL.
#   6. Deploy the stack.
#   7. On the WebOS TV IPTV client (SS IPTV, IPTV Smarters, etc.), point at:
#        http://192.168.1.7:6880/playlist.m3u8
#      Playlist rebuilds on startup and nightly at 03:00 (configurable via
#      CRON_SCHEDULE). Restart the playlist container to force an immediate
#      rebuild.
#
# Security notes
# --------------
#
# - The AceStream engine admin API on port 6878 is NEVER published to the
#   host. Only acexy (in the same Docker network) can reach it. Do NOT add
#   a `ports:` entry to the engine service.
# - P2P port 8621/tcp+udp IS published for swarm health. It speaks the
#   BitTorrent-family protocol, not HTTP; there is no admin surface on it.
# - When exposing this stack over the Cloudflare tunnel later, publish
#   only the playlist proxy (:6880) and acexy (:6879). Never publish the
#   engine's HTTP port. Add a Cloudflare Access policy (email/IP allowlist)
#   on both public hostnames.
#
# Image versioning
# ----------------
#
# Engine + playlist proxy are pinned to specific short-sha tags for
# reproducibility. Acexy is on :latest — pin to a specific tag before going
# public.
#
# ==============================================================================

version: "3.8"

networks:
  acestream:
    driver: bridge

services:
  # ============================================================================
  # AceStream Engine
  # ============================================================================
  #
  # The P2P streaming engine. HTTP admin API on 6878 is intentionally NOT
  # published to the host — it is reachable only from other containers in
  # the `acestream` network via the Docker DNS name `engine`.
  #
  engine:
    image: ghcr.io/kalpak44/acestream-engine:274465d
    container_name: acestream-engine
    restart: unless-stopped

    networks:
      - acestream

    # Only visible inside the compose network — no `ports:` for 6878.
    expose:
      - "6878"

    # P2P port for AceStream peer traffic. Publishing improves swarm health.
    # This port is BitTorrent family; it does NOT expose the admin API.
    ports:
      - "8621:8621/tcp"
      - "8621:8621/udp"

    # The engine caches stream chunks in /dev/shm. Default 64 MB is too small.
    shm_size: "2g"

    # Passed through as extra args to the engine binary (via the image's
    # entrypoint, which always prepends --client-console).
    command:
      - "--cache-max-bytes"
      - "1610612736"      # 1.5 GiB

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6878/webui/api/service?method=get_version || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ============================================================================
  # acexy
  # ============================================================================
  #
  # Stream multiplexer + resilience layer in front of the engine. This is the
  # only component that talks to the engine's HTTP API.
  #
  acexy:
    image: ghcr.io/javinator9889/acexy:latest
    container_name: acestream-acexy
    restart: unless-stopped

    networks:
      - acestream

    depends_on:
      engine:
        condition: service_healthy

    ports:
      # Client-facing stream endpoint. WebOS / IPTV players hit:
      #   http://192.168.1.7:6879/ace/getstream?infohash=<hash>
      - "6879:8080"

    environment:
      # acexy talks to the engine using the compose network DNS name.
      ACEXY_HOST: engine
      ACEXY_PORT: "6878"
      ACEXY_SCHEME: http

      # acexy listens on all interfaces on port 8080 inside the container;
      # published on the host as 6879.
      ACEXY_LISTEN_ADDR: ":8080"

      # MPEG-TS mode (default). HLS mode is marked non-tested upstream.
      # Set to "true" to switch to HLS output if you need it.
      ACEXY_M3U8: "false"

  # ============================================================================
  # Playlist proxy (kalpak44/acestream-proxy)
  # ============================================================================
  #
  # Node service that uses SOURCE_PLAYLIST_URL as the channel catalog (names,
  # groups, logos, EPG ids), matches each channel against live AceStream
  # infohashes from the engine's /search, and emits playlist.m3u8 on a cron
  # schedule. Each entry's stream URL already points at acexy.
  #
  # Endpoints:
  #   GET  http://192.168.1.7:6880/playlist.m3u8   — current playlist
  #   HEAD http://192.168.1.7:6880/playlist.m3u8   — probe (headers only)
  #   (no /refresh endpoint — rebuilds on startup and via cron only)
  #
  playlist:
    image: ghcr.io/kalpak44/acestream-proxy:c8152af
    container_name: acestream-playlist
    restart: unless-stopped

    networks:
      - acestream

    depends_on:
      engine:
        condition: service_healthy

    ports:
      - "6880:8000"

    environment:
      # Required. Upstream M3U used as the channel catalog (names, groups,
      # logos, EPG ids). Set via Portainer stack variable SOURCE_PLAYLIST_URL.
      SOURCE_PLAYLIST_URL: "${SOURCE_PLAYLIST_URL}"

      # Talks to the engine via the compose network DNS name.
      ACESTREAM_SEARCH_URL: "http://engine:6878/search"

      # Base URL baked into every M3U entry. MUST be the URL the CLIENT (TV)
      # uses to reach acexy — not the internal Docker name. Uses acexy's
      # /ace/getstream endpoint (MPEG-TS); the proxy appends ?infohash=<hash>.
      # Host port 6879 → container port 8080.
      ACESTREAM_STREAM_BASE: "http://192.168.1.7:6879/ace/getstream"

      # Search pagination size.
      ACESTREAM_PAGE_SIZE: "50"

      # Cron schedule for playlist rebuilds (default: nightly at 03:00).
      CRON_SCHEDULE: "0 3 * * *"

      # EPG URL advertised in the #EXTM3U header of the generated playlist.
      EPG_URL: "https://iptv.online/epg/epg.xml.gz"

      # Output filename served at /playlist.m3u8
      PLAYLIST_FILE: "playlist.m3u8"

      PORT: "8000"